function forgeConcepts(cs){
  var out=[],seen={};
  (cs.questions||[]).forEach(function(q){
    [].concat(q.core||[],q.refine?[q.refine]:[],q.exclude?[q.exclude]:[],q.pivot||[],q.extendConcepts||[])
      .forEach(function(c){if(c&&!seen[c.id]){seen[c.id]=1;out.push(c);}});});
  return out;}
function forgeTab(cs){
  var sample="Mr. Rao, 46, three months of headaches and facial flushing. Haemoglobin 19.8, haematocrit 59%. "
    +"Oxygen saturation 98% on room air, arterial blood gas normal, chest X-ray clear, echocardiogram shows no shunt. "
    +"Serum erythropoietin is markedly elevated. He has never smoked and lives at sea level. "
    +"CT abdomen shows a hypervascular renal mass. His mother had a cerebellar haemangioblastoma.";
  var raw=S.forgeRaw==null?sample:S.forgeRaw;
  var cons=forgeConcepts(cs),an=analyseAnswer(raw,cons);
  var found=Object.keys(an.byConcept);
  var L=lintCase(cs);
  var h='<div class="card"><h2>Author a case</h2>'
    +'<div class="small" style="margin-bottom:10px">Paste a case in prose. The engine reports which of this domain\'s concepts it can already recognise, '
    +'so an author can see the coverage gap before writing a single rubric line. Analysis only — nothing is published from here in the POC.</div>'
    +'<textarea id="forgeRaw" style="min-height:150px">'+esc(raw)+'</textarea>'
    +'<div class="row"><button class="btn primary" id="forgeRun">Analyse</button></div></div>';
  h+='<div class="card"><h2>Concepts detected · '+found.length+' of '+cons.length+'</h2><div class="chipset">'
    +cons.map(function(c){
      var on=found.indexOf(c.id)>=0;
      return '<span class="dchip" style="'+(on?"border-color:var(--accent);color:var(--accent);background:var(--accent-soft)":"opacity:.5")
        +'">'+esc(c.id)+'</span>';}).join("")+'</div></div>';
  h+='<div class="card"><h2>Author lint on the live case</h2>'
    +(L.errors.length?'<div class="warnline">'+L.errors.map(esc).join("<br>")+'</div>'
      :'<div class="glyph g-green"><span class="g">✓</span>No structural errors</div>')
    +'<div class="small" style="margin-top:8px">Weights '+L.weightSum+'/100 · reasoning 90 · recall 10 · every question carries a model answer.</div></div>';
  return h;
}

/* Keep the page inside the window, measured in real pixels.

   Two independent things can go wrong, and the first one caused the second:

   1. THE CONTAINER ITSELF IS TOO WIDE. .wrap is sized in vw, and vw is not
      trustworthy under OS display scaling or an unusual zoom — it can resolve
      wider than the window actually is. Everything inside then overruns no
      matter how the grid is configured, so collapsing columns cannot help.
      Fix it in measured px before touching the grid.

   2. THREE COLUMNS DO NOT FIT. Only then is collapsing the right answer.

   Both checks measure after a clean reset so the layout restores itself when
   the room comes back, rather than latching into the fallback forever. */
function fitDesk(){
  var vw=document.documentElement.clientWidth;
  /* querySelectorAll, not querySelector: the shell renders more than one
     width-constrained box (the bar's inner row as well as the page body), and
     clamping only the first left the others free to overrun. */
  var boxes=document.querySelectorAll(".wrap,.barinner"),bi;
  for(bi=0;bi<boxes.length;bi++){
    var box=boxes[bi];
    box.style.width="";                        /* measure unclamped */
    var br=box.getBoundingClientRect();
    /* -4px so a sub-pixel rounding difference cannot leave a 1px overhang */
    if(br.width>vw-4||br.right>vw+1){
      /* no floor: below a clientWidth of 316 a 300px floor assigns a box WIDER
         than the viewport, auto margins then resolve to zero, and the excess is
         unreachable — the guard would be causing the very overflow it exists
         to prevent */
      box.style.width=Math.max(0,vw-16)+"px";
      box.style.marginLeft="auto";box.style.marginRight="auto";
    }
  }
  var enc=document.querySelector(".enc");if(!enc)return;
  enc.classList.remove("narrow");
  var kids=enc.children,i,over=false;
  for(i=0;i<kids.length;i++){
    if(kids[i].getBoundingClientRect().right>vw-2){over=true;break;}
  }
  if(over)enc.classList.add("narrow");
  /* Last resort: if even two columns overrun, drop to one. Better a single
     stacked column than a case file the student cannot reach. */
  if(over){
    for(i=0;i<kids.length;i++){
      if(kids[i].getBoundingClientRect().right>vw-2){enc.classList.add("stack");break;}
    }
  }else enc.classList.remove("stack");
}

  function advance(){
    var L=liveCue();if(!L)return;

    if(c.commit==="family"&&!S.askedFamily){S.askedFamily=true;S._say="You asked about the family.";renderScene();return;}

    if(S.beat<cs.beats.length-1){S.beat++;S.cue=0;S._say=sceneOf(cs,S.beat)[0].say;renderScene();}

  all("[data-lset]",function(el){el.onclick=function(){

    if(i>=0)st.evidence.splice(i,1);else st.evidence.push(p[1]);renderScene();};});
  /* questions */
  /* keep the answered counter live without re-rendering on every keystroke */
  function refreshCount(){
    var cs=caseById(S.caseId);if(!cs)return;
    var n=answeredCount(cs),lbl=document.getElementById("ansCount"),btn=document.getElementById("submitAll");

  all("[data-q]",function(el){el.oninput=function(){

  all("[data-idk]",function(el){el.onclick=function(){var id=el.getAttribute("data-idk");
    S.declared[id]=true;S.qAnswers[id]="";route();};});

  var cg=document.getElementById("codaGo");if(cg)cg.onclick=function(){S.codaRevealed=true;route();};
  var fr=document.getElementById("forgeRun");
  if(fr)fr.onclick=function(){var t=document.getElementById("forgeRaw");S.forgeRaw=t?t.value:"";route();};
  /* deterministic strike + loop animation. The rAF path runs ONCE per encounter —
