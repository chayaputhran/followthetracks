function encounterView(){
  var cs=caseById(S.caseId);
  if(!cs)return shell("cases",'<div class="card">Case not found.</div>');
  var body='<div class="crumbs"><a data-nav="#/cases">Case</a> › '+esc(cs.title)+'</div>';
  body+='<div class="enc"><div class="railwrap">'+spineHTML(cs)+hypBoardHTML(cs)+'</div><div>';
  body+='<div class="card"><div class="kicker">Narrative case · reasoning examined</div>'
    +'<h1 class="pagetitle voice-case" style="margin:6px 0 4px">'+esc(cs.title)+'</h1>'
    +'<div class="small">'+esc(cs.oneLiner)+'</div></div>';

  var upto=S.revealAll?cs.beats.length-1:S.beat;
  for(var i=0;i<=upto&&i<cs.beats.length;i++){
    var b=cs.beats[i],current=(i===S.beat)&&!S.revealAll,locked=i<S.beat||S.revealAll;
    if(b.interlock){body+=interlockHTML(cs,b.interlock,locked);continue;}
    if(b.kind==="rewind"){
      body+='<div class="beat"><div class="stagetok">Rewind</div><h2 class="voice-case">'+esc(b.title)+'</h2>'
        +'<div class="small" style="margin-top:6px">The evidence changed, so the hypothesis step reopens. '
        +'This is the method working, not failing — nothing here is a correction of you.</div>'
        +(current?'<div class="row"><button class="btn primary" data-adv="1">Return to Stage 4 →</button></div>':"")+'</div>';
      continue;}
    if(b.kind==="questions"){
      body+='<div class="beat" id="qblock"><div class="stagetok">Understanding</div>'
        +'<h2 class="voice-case">'+esc(b.title)+'</h2>'+questionsHTML(cs)
        +'<div class="row"><button class="btn primary" id="submitAll">Submit for grading →</button>'
        +'<button class="btn ghost" data-nav="#/cases">Back</button></div></div>';
      continue;}
    body+='<div class="beat'+(locked?" locked":"")+'">'
      +'<div class="stagetok">'+esc(b.n?("Stage "+b.n+(b.revised?" · Revised":"")):"Interlude")+'</div>'
      +'<h2 class="voice-case">'+esc(b.title)+'</h2>';
    if(b.kicker)body+='<div class="small" style="margin:4px 0 8px">'+esc(b.kicker)+'</div>';
    body+=revealHTML(b.reveal);
    if(b.ledger){
      body+=ledgerHTML(cs);
      if(current&&!S.ledgerCommitted)body+='<div class="row"><button class="btn primary" id="ledgerCommit"'
        +(ledgerReady(cs)?"":" disabled")+'>Commit the differential →</button></div>';
      else if(current)body+='<div class="row"><button class="btn primary" data-adv="1">Continue →</button></div>';}
    else if(b.askFamily){
      if(!S.askedFamily){
        if(current)body+='<div class="row"><button class="btn primary" id="askFamily" aria-expanded="false">Ask the patient about family history</button></div>';
      }else{
        body+=dlgHTML(cs.family.dialogue)+pedigreeHTML(cs);
        if(current)body+='<div class="row"><button class="btn primary" data-adv="1">Continue to the questions →</button></div>';}}
    else if(b.capture){
      if(locked){body+='<div class="locked-recap voice-case"><span class="lbl">You committed</span>'
        +esc(b.capture==="hyp1"?S.hyp1:S.hyp2)+'</div>';}
      else{
        body+='<div class="prompt" style="margin-top:12px">'+esc(b.prompt)+'</div>'
          +'<textarea data-cap="'+esc(b.capture)+'" placeholder="'+esc(b.placeholder||"")+'">'
          +esc(b.capture==="hyp1"?S.hyp1:S.hyp2)+'</textarea>'
          +'<div class="row"><button class="btn primary" data-adv="1"'+(beatReady(cs,i)?"":" disabled")+'>Commit →</button>'
          +'<span class="small">Committed answers lock. The case will not show you what comes next until you have written this one.</span></div>';}}
    else if(current){
      body+='<div class="row"><button class="btn primary" data-adv="1">Continue →</button></div>';}
    body+='</div>';
  }
  body+='<div class="demorow row"><span class="small">Load a worked attempt:</span>'
    +'<button class="btn ghost sm" data-fx="strong">Model</button>'
    +'<button class="btn ghost sm" data-fx="saba">Real student</button>'
    +'<button class="btn ghost sm" data-fx="gamed">Keyword-stuffed</button></div>';
  body+='</div></div>';
  return shell("cases",body);
}


/* ============================================================
   SCORECARD — a feedback surface, not a receipt.
   The table comments on what was written; the denominator is the
   whole case. Those are different things and both must be true.
   ============================================================ */
function starGlyphs(n){
  if(n==null)return "";
  var s="";for(var i=0;i<5;i++)s+='<span class="sc-star'+(i<n?" on":"")+'">'+(i<n?"★":"☆")+'</span>';
  return '<span class="sc-stars" title="'+n+' of 5">'+s+'</span>';}
var GLYPH_MARK={green:"✓",amber:"◑",red:"✕",mute:"–"};
function glyphHTML(r){
  var tier=STATUS_GLYPH[r.status]||"mute";
  return '<span class="glyph g-'+tier+'"><span class="g">'+GLYPH_MARK[tier]+'</span>'+esc(r.label)+'</span>';}
function modelHTML(it){
  return '<div class="modelans voice-case">'+it.model.lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join("")
    +'<cite class="src">From the case answer key</cite></div>';}
function chainHTML(it,r){
  if(!it.chain)return "";
  var firstMiss=-1;
  var h='<div class="chain">'+it.chain.map(function(l,i){
    var got=!!r.hits[l.conceptId];
    if(!got&&firstMiss<0)firstMiss=i;
    return (i?'<span class="mech-arrow"></span>':"")+'<div class="link '+(got?"got":"miss")+'">'+esc(l.text)
      +(got?'<span class="yours">you produced this</span>':"")+'</div>';}).join("")+'</div>';
  if(firstMiss>=0){
    var l=it.chain[firstMiss],pa=S.probeAns[it.id+"_"+firstMiss];
    h+='<div class="probe"><div class="ph">The one link missing from your chain</div>'
      +'<div class="pq voice-case">'+esc(l.probe)+'</div>'
      +(pa!=null
        ? '<div class="probeans"><b>You said:</b> '+esc(pa)+'</div><div class="probeans"><b>The link:</b> '+esc(l.text)+'</div>'
        : '<input class="line" data-probe="'+esc(it.id)+'|'+firstMiss+'" placeholder="Answer from memory first …"/>'
          +'<div class="row"><button class="btn ghost sm" data-probeshow="'+esc(it.id)+'|'+firstMiss+'">Show the link</button>'
          +'<span class="small">Ungraded. The attempt is the point.</span></div>')
      +'</div>';}
  return h;}
function peerHTML(it){
  var p=it.peer;if(!p)return "";
  var mine=S.adjudication[it.id];
  var h='<div class="peerbox"><div class="ph">Another detective\'s notebook</div>'
    +'<div class="peerans voice-case">'+esc(p.answer)+'</div>';
  if(!mine){
    h+='<div class="small">Before you see the examiner: how would you mark this?</div>'
      +'<div class="adjset">'+["5","4","3","2","honest gap"].map(function(v){
        return '<button data-adj="'+esc(it.id)+'|'+esc(v)+'">'+esc(v==="honest gap"?"Honest gap":v+" stars")+'</button>';}).join("")+'</div>';
  }else{
    var ex=p.examinerStars==null?"honest gap":String(p.examinerStars);
    var match=mine===ex;
    h+='<div class="small">You marked it <b>'+esc(mine==="honest gap"?"an honest gap":mine+" stars")+'</b>.</div>'
      +'<div class="ph" style="margin-top:12px">Examiner\'s verdict</div>'
      +(p.examinerStars!=null?starGlyphs(p.examinerStars):'<span class="glyph g-amber"><span class="g">◑</span>No stars — and no penalty</span>')
      +quoteHTML(p.examinerLines,"From the case")
      +'<div class="delta '+(match?"match":"off")+'">'+(match?"You agreed with the examiner.":"You marked it "+esc(mine)+"; the examiner marked it "+esc(ex)+".")
      +' '+esc(p.teachingPoint)+'</div>';}
  return h+'</div>';}

function scorecardView(cs,rec,gidx){
  var ans=rec.answers||{},Q=gradeQuestions(cs,ans,rec.state||{});
  var overall=Q.overall10.toFixed(1);
  var vcls=Q.flags.anchored?"vb-unsafe":(Q.flags.assertionCapped?"vb-risky":(Q.overall10>=7.5?"vb-safe":Q.overall10<4?"vb-unsafe":"vb-risky"));
  var vt=Q.flags.anchored?"Held a dead hypothesis"
    :(Q.flags.cleanRevision?"Revised cleanly on the evidence":"Scorecard");
  var body='<div class="crumbs"><a data-nav="#/cases">Case</a> › '+esc(cs.title)+' › Scorecard</div>';
  body+='<div class="verdictband '+vcls+'"><h2>'+esc(vt)+'</h2>'
    +'<div class="sm">'+esc(cs.title)+'</div><span class="scorechip">'+esc(overall)+' / 10</span></div>';

  /* --- 1. how the answers were read --- */
  body+='<div class="card"><h2>Question by question</h2>'
    +quoteHTML(cs.reviewFrame,"From the case")
    +'<div class="sc-table">';
  var attempted=[],unattempted=[];
  (cs.questions||[]).forEach(function(it,n){
    var r=Q.q[it.id];
    if(r.status==="unattempted"){unattempted.push({it:it,n:n});return;}
    attempted.push(it.id);
    var a=ans[it.id]||"";
    body+='<div class="sc-row"><div class="sc-qn">Question '+(n+1)+' · '+it.w+' marks</div>'
      +'<div class="sc-q voice-case">'+esc(it.qtext)+'</div>'
      +'<div class="sc-ans voice-case">'+esc(a)+'</div>'
      +'<div class="sc-verdict">'+glyphHTML(r)+starGlyphs(r.stars)
      +(r.conduct==="honest"?'<span class="conductchip">honestly declared</span>':"")
      +(r.suspectStuffing?'<span class="conductchip">flagged for review</span>':"")
      +'</div>'
      +'<div class="sc-fb">'+esc(r.feedback)+'</div>'
      +'<div class="sc-extra">';
    if(r.extendText)body+='<div class="extendbox"><div class="eh">Adding to your answer</div>'+esc(r.extendText)+'</div>';
    if(r.refineChain)body+='<div class="extendbox"><div class="eh">The sequence, link by link</div>'
      +r.refineChain.map(function(l){return '<div class="voice-case">'+esc(l)+'</div>';}).join("")+'</div>';
    body+=chainHTML(it,r);
    if(it.aside)body+=quoteHTML([it.aside],"From the case answer key");
    body+=modelHTML(it);
    body+=peerHTML(it);
    body+='</div></div>';});
  body+='</div></div>';

  /* --- 2. what was never attempted — taught anyway --- */
  unattempted.forEach(function(u){
    body+='<div class="card"><h2>Not attempted — worth knowing anyway</h2>'
      +'<div class="sc-q voice-case" style="margin-bottom:8px">'+esc(u.it.qtext)+'</div>'
      +modelHTML(u.it)
      +'<div class="small" style="margin-top:10px">Not graded as an answer. It still counts as 0 of '
      +u.it.w+' marks toward the total.</div></div>';});

  /* --- 3. the honesty ledger: make the incentive visible or it changes nothing --- */
  if(Q.honestGapCount>0){
    body+='<div class="card ledgercard"><h2>What your honesty was worth</h2>'
      +'<div class="ledgernum">+'+Q.honestGapMarks.toFixed(1)+'</div>'
      +'<div>You marked '+Q.honestGapCount+' answer'+(Q.honestGapCount>1?"s":"")+' as unknown rather than guessing. '
      +'Each earned '+Math.round(GAP_CREDIT*100)+'% of its marks. A confident wrong answer would have earned nothing — '
      +'guessing would have cost you '+Q.honestGapMarks.toFixed(1)+' marks out of 10.</div>'
      +quoteHTML([cs.trustLine],"From the case")+'</div>';
    body+='<div class="card"><h2>New to your notebook</h2>'
      +quoteHTML([cs.notebookLine],"From the case");
    (cs.questions||[]).forEach(function(it){
      var r=Q.q[it.id];
      if(r.status!=="newConcept"&&r.status!=="factGap")return;
      body+='<div class="nbitem"><div class="nq voice-case">'+esc(it.qtext)+'</div>'+modelHTML(it)+'</div>';});
    body+='</div>';}

  /* --- 4. the read --- */
  var readLine=Q.reasoningPct>=Q.recallPct+15?"You reasoned rather than recalled."
    :(Q.recallPct>Q.reasoningPct+15?"You recalled more reliably than you reasoned."
      :"Reasoning and recall came out level.");
  body+='<div class="card"><h2>The read</h2><div style="font-family:var(--font-display);font-size:17px;margin-bottom:10px">'
    +esc(readLine)+'</div>';
  function bar(lbl,v){return '<div class="metric"><div class="top"><b>'+esc(lbl)+'</b><span>'+v+'%</span></div>'
    +'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%;background:'
    +(v>=70?"var(--green)":v>=40?"var(--amber)":"var(--danger)")+'"></i></div></div>';}
  body+=bar("Reasoning · Q1–Q6 · 90 marks",Q.reasoningPct)+bar("Recall · Q7–Q8 · 10 marks",Q.recallPct)
    +'<div class="small">Reasoning carries nine times the weight of recall. That ratio is the product\'s whole argument.</div>'
    +quoteHTML(cs.verdictLines,"From the case")+'</div>';

  /* --- 5. greatest strength --- */
  if(Q.strength){
    body+='<div class="card"><h2>Your strongest move</h2>'
      +'<div class="sc-q voice-case">'+esc(Q.strength.q)+'</div>'
      +(Q.strength.note?'<div class="small" style="margin-top:6px">'+esc(Q.strength.note)+'</div>':"")
      +quoteHTML(cs.strengthLines,"From the case")+'</div>';}

  /* --- 6. the mechanism, marked against what the student produced --- */
  var hits={};(cs.questions||[]).forEach(function(it){
    var r=Q.q[it.id];Object.keys(r.hits||{}).forEach(function(k){hits[k]=true;});});
  body+='<div class="card"><h2>The pathway this case turns on</h2>'
    +'<div class="small">Questions 4, 5 and 6 all live on one mechanism. Here it is in both states.</div>'
    +mechHTML(cs,hits)+'</div>';

  /* --- 7. the number, last --- */
  body+='<div class="card sc-overall"><div class="sc-big">'+esc(overall)+' <span>/ 10</span></div>'
    +'<div class="small">Across '+Q.attemptedCount+' of '+cs.questions.length+' questions answered. '
    +'The case is scored out of all eight — an unanswered question is not a penalty, it is simply unearned.</div>'
    +quoteHTML([cs.closingLine],"From the case")+'</div>';

  /* --- 8. the coda, generated before it is given --- */
  var c=cs.coda;
  body+='<div class="card sc-coda"><h2 class="voice-case">'+esc(c.title)+'</h2>'
    +quoteHTML(c.frame,"From the case answer key");
  c.specialists.forEach(function(sp){
    body+='<div class="coda-row"><span class="ic ok">✓</span><div><span class="who">'+esc(sp.who)+'</span> '
      +esc(sp.concluded)+'.</div></div>';});
  if(!S.codaRevealed&&!rec.codaText){
    body+='<div class="prompt" style="margin-top:14px">'+esc(c.ask)+'</div>'
      +'<textarea id="codaText" placeholder="'+esc(c.placeholder)+'">'+esc(S.codaText)+'</textarea>'
      +'<div class="row"><button class="btn primary" id="codaGo">Commit, then read the answer</button></div>';
  }else{
    var mine=rec.codaText||S.codaText;
    if(mine)body+='<div class="locked-recap voice-case" style="margin-top:14px"><span class="lbl">You wrote</span>'+esc(mine)+'</div>';
    body+='<div style="margin-top:16px"><div class="small">Everyone asked the same question:</div>'
      +'<div class="coda-q wrong voice-case" id="codaWrong">“'+esc(c.wrongQ)+'”</div>'
      +'<div class="small" style="margin-top:8px">The correct question was different:</div>'
      +'<div class="coda-q right voice-case">“'+esc(c.rightQ)+'”</div></div>'
      +quoteHTML(c.anchorLines,"From the case answer key")
      +quoteHTML(c.notHidden.concat([c.violin]).concat(c.hidden),"From the case answer key")
      +'<blockquote class="coda-close voice-case">'+esc(c.close)+'</blockquote>'
      +'<cite class="src">From the case narrative</cite>';}
  body+='</div>';

  body+='<div class="card"><div class="disclaimer">Graded by a deterministic concept-and-negation engine standing in for the production language examiner. '
    +'A deployed system uses a language model behind this same rubric, with faculty review of every grade. '
    +'Answers flagged for review are surfaced to faculty and never silently rescored.</div></div>';
  body+='<div class="row"><button class="btn primary" data-retry="'+esc(cs.id)+'">Attempt the case again</button>'
    +'<button class="btn ghost" data-nav="#/cases">Back</button></div>';
  return shell("report",body);
}
function reportView(id,gidx){
  var cs=caseById(id),arr=loadAttempts(),rec=arr[gidx];
  if(!cs||!rec||rec.caseId!==id)return shell("cases",'<div class="card">Scorecard not found.</div>');
  return scorecardView(cs,rec,gidx);
}
function submitAttempt(){
  var cs=caseById(S.caseId);if(!cs)return;
  var ans={};(cs.questions||[]).forEach(function(it){ans[it.id]=S.qAnswers[it.id]||"";});
  var state={declared:JSON.parse(JSON.stringify(S.declared)),
    interlock:JSON.parse(JSON.stringify(S.interlock)),ledger:JSON.parse(JSON.stringify(S.ledger))};
  var Q=gradeQuestions(cs,ans,state);
  var rec={caseId:cs.id,seq:++S.seq,answers:ans,state:state,hyp1:S.hyp1,hyp2:S.hyp2,
    codaText:"",grade:{overall10:Q.overall10,earned100:Q.earned100}};
  var arr=loadAttempts();arr.push(rec);lsSet(K_ATT,arr);
  S._submitted=true;S.attemptIndex=arr.length-1;
  nav("#/report/"+encodeURIComponent(cs.id)+"/"+S.attemptIndex);
}


/* ============================================================
   FACULTY — pointed at the question layer, which is what the
   documents actually describe.
   ============================================================ */
var COHORT=null;
function cohortOf(cs){if(!COHORT)COHORT=cohort(cs);return COHORT;}
function facultyView(){
  var cs=CASES[0],tab=S.facultyTab;
  var body='<div class="crumbs">College view</div><h1 class="pagetitle">'+esc(cs.title)+'</h1>'
    +'<p class="pagesub">NMC · '+esc(cs.competency.code)+' — '+esc(cs.competency.text)+'</p>'
    +'<div class="tabs">'
    +[["cohort","Cohort"],["review","Review queue"],["forge","Case Forge"]].map(function(t){
      return '<button class="'+(tab===t[0]?"on":"")+'" data-ftab="'+t[0]+'">'+t[1]+'</button>';}).join("")
    +'</div>';
  body+=tab==="review"?reviewTab(cs):(tab==="forge"?forgeTab(cs):cohortTab(cs));
  return shell("faculty",body);
}
function cohortTab(cs){
  var C=cohortOf(cs);
  var h='<div class="statgrid">'
    +'<div class="stat"><div class="n">'+C.mean.toFixed(1)+'</div><div class="l">Mean score / 10</div></div>'
    +'<div class="stat"><div class="n">'+Math.round(C.anchored/C.N*100)+'%</div><div class="l">Held a dead hypothesis</div></div>'
    +'<div class="stat"><div class="n">'+Math.round(C.honest/C.N*100)+'%</div><div class="l">Declared at least one gap</div></div>'
    +'<div class="stat"><div class="n">'+C.suspect+'</div><div class="l">Flagged for review</div></div>'
    +'</div>';
  h+='<div class="card"><h2>Where the batch loses marks</h2>'
    +'<div class="small" style="margin-bottom:10px">Percentage of the cohort scoring below half marks on each question. '
    +'This is the teaching target — it names the step of the mechanism the batch could not produce.</div>';
  (cs.questions||[]).forEach(function(it,n){
    var p=C.perQ[it.id];
    h+='<div class="missrow"><div><b>Q'+(n+1)+'.</b> '+esc(it.qtext)+'</div>'
      +'<div class="pc">'+p.miss+'%</div>'
      +'<div class="missbar"><i style="width:'+p.miss+'%"></i></div></div>';});
  h+='</div>';
  h+='<div class="card"><h2>Honest gaps by question</h2>'
    +'<div class="small" style="margin-bottom:10px">Where students said they had not met the concept. '
    +'A high rate here is a curriculum signal, not a discipline problem.</div>';
  (cs.questions||[]).forEach(function(it,n){
    var p=C.perQ[it.id];
    h+='<div class="missrow"><div><b>Q'+(n+1)+'.</b> '+esc(it.qtext)+'</div>'
      +'<div class="pc">'+p.gap+'%</div>'
      +'<div class="missbar"><i style="width:'+p.gap+'%;background:var(--amber)"></i></div></div>';});
  return h+'</div>';
}
function reviewTab(cs){
  var queue=[
    {key:"saba",label:"Reasoned throughout; forgot one drug and declared it",note:cs.demo.saba._provenance},
    {key:"gamed",label:"Concept-dense answers with no linking reasoning",note:null},
    {key:"weak",label:"Sparse answers; hypothesis never firmly retired",note:null}];
  var sel=S.reviewSel||"saba";
  var h='<div class="card"><h2>Attempts the engine wants a second opinion on</h2>'
    +'<div class="small" style="margin-bottom:12px">The engine shows its working. You keep the final say — an override is recorded against the grade, not hidden behind it.</div>';
  queue.forEach(function(q){
    h+='<div class="qcard'+(sel===q.key?" sel":"")+'" data-rev="'+esc(q.key)+'">'
      +'<b>'+esc(q.key==="saba"?"Detective Saba":q.key==="gamed"?"Attempt B":"Attempt C")+'</b>'
      +'<div class="small">'+esc(q.label)+'</div></div>';});
  h+='</div>';
  var d=cs.demo[sel],ans=demoAnswers(cs,sel),st=demoState(cs,sel);
  var Q=gradeQuestions(cs,ans,st);
  h+='<div class="card"><h2>Engine reading · '+esc(Q.overall10.toFixed(1))+' / 10</h2>';
  (cs.questions||[]).forEach(function(it,n){
    var r=Q.q[it.id],a=ans[it.id]||"";
    if(r.status==="unattempted")return;
    h+='<div class="sc-row"><div class="sc-qn">Q'+(n+1)+'</div>'
      +'<div class="sc-q voice-case">'+esc(it.qtext)+'</div>'
      +'<div class="sc-ans voice-case">'+esc(a)+'</div>'
      +'<div class="sc-verdict">'+glyphHTML(r)+starGlyphs(r.stars)
      +(r.suspectStuffing?'<span class="conductchip">flagged</span>':"")+'</div>'
      +'<div class="sc-fb small">'+esc(r.feedback)+'</div></div>';});
  h+='<div class="row"><button class="btn ghost sm">Agree with the engine</button>'
    +'<button class="btn ghost sm">Override this grade</button>'
    +'<button class="btn ghost sm">Send back for a second attempt</button></div>';
  if(queue.filter(function(q){return q.key===sel;})[0].note){
    h+='<div class="provnote"><b>Source-document note (faculty only).</b> '
      +esc(queue.filter(function(q){return q.key===sel;})[0].note)+'</div>';}
  return h+'</div>';
}
function forgeConcepts(cs){
  var out=[],seen={};
  (cs.questions||[]).forEach(function(q){
    [].concat(q.core||[],q.refine?[q.refine]:[],q.exclude?[q.exclude]:[],q.pivot||[],q.extendConcepts||[])
      .forEach(function(c){if(c&&!seen[c.id]){seen[c.id]=1;out.push(c);}});});
  return out;}
function forgeTab(cs){
  var sample="Mr. Rao, 46, three months of headaches and facial flushing. Haemoglobin 19.8, haematocrit 59%. "
    +"Oxygen saturation 98% on room air, arterial blood gas normal, chest X-ray clear, echocardiogram shows no shunt. "
    +"Serum erythropoietin is markedly elevated. He has never smoked and lives at sea level. "
    +"CT abdomen shows a hypervascular renal mass. His mother had a cerebellar haemangioblastoma.";
  var raw=S.forgeRaw==null?sample:S.forgeRaw;
  var cons=forgeConcepts(cs),an=analyseAnswer(raw,cons);
  var found=Object.keys(an.byConcept);
  var L=lintCase(cs);
  var h='<div class="card"><h2>Case Forge</h2>'
    +'<div class="small" style="margin-bottom:10px">Paste a case in prose. The engine reports which of this domain\'s concepts it can already recognise, '
    +'so an author can see the coverage gap before writing a single rubric line. Analysis only — nothing is published from here in the POC.</div>'
    +'<textarea id="forgeRaw" style="min-height:150px">'+esc(raw)+'</textarea>'
    +'<div class="row"><button class="btn primary" id="forgeRun">Analyse</button></div></div>';
  h+='<div class="card"><h2>Concepts detected · '+found.length+' of '+cons.length+'</h2><div class="chipset">'
    +cons.map(function(c){
      var on=found.indexOf(c.id)>=0;
      return '<span class="dchip" style="'+(on?"border-color:var(--accent);color:var(--accent);background:var(--accent-soft)":"opacity:.5")
        +'">'+esc(c.id)+'</span>';}).join("")+'</div></div>';
  h+='<div class="card"><h2>Author lint on the live case</h2>'
    +(L.errors.length?'<div class="warnline">'+L.errors.map(esc).join("<br>")+'</div>'
      :'<div class="glyph g-green"><span class="g">✓</span>No structural errors</div>')
    +'<div class="small" style="margin-top:8px">Weights '+L.weightSum+'/100 · reasoning 90 · recall 10 · every question carries a model answer.</div></div>';
  return h;
}

/* ============================================================
   GUIDED DEMO
   ============================================================ */
var DEMO=[
 {cap:"The case opens one stage at a time. Nothing further down the page exists yet — so the first hypothesis has to be committed blind.",
  run:function(){S.role="student";S.caseId="VHL-003";resetEncounter();S.beat=1;nav("#/case/VHL-003");}},
 {cap:"Stage 3. The oxygen studies arrive, and the student is asked to judge their own hypothesis before anyone interprets it for them — and to name which findings killed it.",
  run:function(){S.role="student";S.caseId="VHL-003";resetEncounter();S.hyp1=VHL.demo.saba.hyp1;S.beat=2;nav("#/case/VHL-003");}},
 {cap:"The spine rewinds. Stages 4 and 5 run a second time against the revised hypothesis — the document's own structure, and the case's argument about how diagnosis works.",
  run:function(){S.role="student";S.caseId="VHL-003";resetEncounter();
    S.hyp1=VHL.demo.saba.hyp1;S.interlock=VHL.demo.saba.interlock;S.ledger=VHL.demo.saba.ledger;
    S.ledgerCommitted=true;S.beat=6;nav("#/case/VHL-003");}},
 {cap:"The real student's answers, graded. Eight-point-five out of ten — the examiner's own mark, reproduced. She forgot a drug and met a new concept, and said so both times.",
  run:function(){loadDemoAttempt("saba");}},
 {cap:"A keyword-stuffed attempt scores 4.2 and is flagged for faculty review. The concepts are all present; nothing links them.",
  run:function(){loadDemoAttempt("gamed");}},
 {cap:"The college view: which question the batch actually loses marks on, and where students are declaring honest gaps — a curriculum signal rather than a discipline problem.",
  run:function(){S.role="faculty";S.facultyTab="cohort";nav("#/faculty?tab=cohort");}}
];
function loadDemoAttempt(key){
  var cs=VHL,ans=demoAnswers(cs,key),st=demoState(cs,key);
  var Q=gradeQuestions(cs,ans,st);
  var rec={caseId:cs.id,seq:++S.seq,answers:ans,state:st,hyp1:cs.demo[key].hyp1,hyp2:cs.demo[key].hyp2,
    codaText:cs.demo[key].coda||"",grade:{overall10:Q.overall10,earned100:Q.earned100}};
  var arr=loadAttempts();arr.push(rec);lsSet(K_ATT,arr);
  S.role="student";S.codaRevealed=true;
  nav("#/report/"+encodeURIComponent(cs.id)+"/"+(arr.length-1));
}
function demoBar(){
  var old=document.querySelector(".demobar");if(old)old.remove();
  if(S.demoStep<0||S.demoStep>=DEMO.length)return;
  var d=document.createElement("div");d.className="demobar";
  d.innerHTML='<span class="cap">'+esc((S.demoStep+1)+" / "+DEMO.length+" — "+DEMO[S.demoStep].cap)+'</span>'
    +'<button id="demoNext">'+(S.demoStep===DEMO.length-1?"Finish":"Next")+'</button>'
    +'<button class="gh" id="demoExit">Exit</button>';
  document.body.appendChild(d);
  document.getElementById("demoNext").onclick=function(){
    if(S.demoStep>=DEMO.length-1){S.demoStep=-1;d.remove();nav("#/");return;}
    S.demoStep++;DEMO[S.demoStep].run();};
  document.getElementById("demoExit").onclick=function(){S.demoStep=-1;d.remove();nav("#/");};
}
function demoView(){S.demoStep=0;DEMO[0].run();}

/* ============================================================
   ROUTER
   ============================================================ */
function draw(){
  var hash=location.hash||"#/",h,m;
  if(hash==="#/"||hash==="#"||hash===""){
    S.role=null;app.innerHTML=landingView();wire();runSpecimen();demoBar();return;}
  if(hash.indexOf("#/demo")===0){demoView();return;}
  if(hash.indexOf("#/cases")===0){if(!S.role)S.role="student";h=libraryView();}
  else if((m=hash.match(/^#\/case\/(.+)$/))){
    if(!S.role)S.role="student";
    var cid=decodeURIComponent(m[1]);
    if(S.caseId!==cid){S.caseId=cid;resetEncounter();}
    h=encounterView();}
  else if((m=hash.match(/^#\/report\/([^/]+)\/(\d+)$/))){
    if(!S.role)S.role="student";h=reportView(decodeURIComponent(m[1]),parseInt(m[2],10));}
  else if(hash.indexOf("#/faculty")===0){
    S.role="faculty";var t=hash.match(/tab=(\w+)/);S.facultyTab=t?t[1]:"cohort";h=facultyView();}
  else h=shell("cases",'<div class="card">Page not found.</div>');
  app.innerHTML=h;wire();demoBar();
}
function route(){draw();window.scrollTo(0,0);}

function wire(){
  function all(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}
  all("[data-nav]",function(el){el.onclick=function(e){e.preventDefault();
    var d=el.getAttribute("data-nav");
    if(d==="#/"){S.demoStep=-1;var b=document.querySelector(".demobar");if(b)b.remove();}
    nav(d);};});
  all("[data-door]",function(el){el.onclick=function(){S.role=el.getAttribute("data-door");
    nav(S.role==="faculty"?"#/faculty?tab=cohort":"#/cases");};});
  all("[data-open]",function(el){el.onclick=function(){
    var id=el.getAttribute("data-open");S.caseId=id;resetEncounter();nav("#/case/"+encodeURIComponent(id));};});
  all("[data-viewreport]",function(el){el.onclick=function(e){e.stopPropagation();
    nav("#/report/"+encodeURIComponent(el.getAttribute("data-viewreport"))+"/"+el.getAttribute("data-gidx"));};});
  all("[data-retry]",function(el){el.onclick=function(){
    var id=el.getAttribute("data-retry");S.caseId=id;resetEncounter();nav("#/case/"+encodeURIComponent(id));};});
  all("[data-ftab]",function(el){el.onclick=function(){S.facultyTab=el.getAttribute("data-ftab");S.reviewSel=null;
    nav("#/faculty?tab="+S.facultyTab);};});
  all("[data-rev]",function(el){el.onclick=function(){S.reviewSel=el.getAttribute("data-rev");route();};});
  /* encounter */
  all("[data-cap]",function(el){el.oninput=function(){
    var k=el.getAttribute("data-cap");if(k==="hyp1")S.hyp1=el.value;else S.hyp2=el.value;
    var btn=el.parentNode.querySelector("[data-adv]");
    if(btn)btn.disabled=!beatReady(caseById(S.caseId),S.beat);};});
  all("[data-adv]",function(el){el.onclick=function(){
    var cs=caseById(S.caseId);
    if(!beatReady(cs,S.beat))return;
    if(S.beat<cs.beats.length-1)S.beat++;
    route();};});
  all("[data-d1opt]",function(el){el.onclick=function(){S.interlock.d1.verdict=el.getAttribute("data-d1opt");route();};});
  all("[data-d2opt]",function(el){el.onclick=function(){S.interlock.d2.choice=el.getAttribute("data-d2opt");route();};});
  all("[data-d1chip]",function(el){el.onclick=function(){
    var id=el.getAttribute("data-d1chip"),a=S.interlock.d1.evidence,i=a.indexOf(id);
    if(i>=0)a.splice(i,1);else a.push(id);route();};});
  all("[data-d1why]",function(el){el.oninput=function(){S.interlock.d1.why=el.value;
    var b=document.querySelector("[data-adv]");if(b)b.disabled=!beatReady(caseById(S.caseId),S.beat);};});
  all("[data-d2why]",function(el){el.oninput=function(){S.interlock.d2.why=el.value;
    var b=document.querySelector("[data-adv]");if(b)b.disabled=!beatReady(caseById(S.caseId),S.beat);};});
  all("[data-lset]",function(el){el.onclick=function(){
    var p=el.getAttribute("data-lset").split("|");
    if(!S.ledger[p[0]])S.ledger[p[0]]={state:null,evidence:[]};
    S.ledger[p[0]].state=p[1];
    if(p[1]!=="dead")S.ledger[p[0]].evidence=[];
    route();};});
  all("[data-lev]",function(el){el.onclick=function(){
    var p=el.getAttribute("data-lev").split("|"),st=S.ledger[p[0]];
    if(!st)return;var i=st.evidence.indexOf(p[1]);
    if(i>=0)st.evidence.splice(i,1);else st.evidence.push(p[1]);route();};});
  var lc=document.getElementById("ledgerCommit");
  if(lc)lc.onclick=function(){if(ledgerReady(caseById(S.caseId))){S.ledgerCommitted=true;route();}};
  var af=document.getElementById("askFamily");
  if(af)af.onclick=function(){S.askedFamily=true;route();};
  /* questions */
  all("[data-q]",function(el){el.oninput=function(){S.qAnswers[el.getAttribute("data-q")]=el.value;};});
  all("[data-idk]",function(el){el.onclick=function(){var id=el.getAttribute("data-idk");
    S.declared[id]=true;S.qAnswers[id]="";route();};});
  all("[data-undeclare]",function(el){el.onclick=function(){delete S.declared[el.getAttribute("data-undeclare")];route();};});
  var sa=document.getElementById("submitAll");if(sa)sa.onclick=submitAttempt;
  all("[data-fx]",function(el){el.onclick=function(){
    var cs=caseById(S.caseId),k=el.getAttribute("data-fx"),d=cs.demo[k];
    S.hyp1=d.hyp1;S.hyp2=d.hyp2;S.interlock=JSON.parse(JSON.stringify(d.interlock));
    S.ledger=JSON.parse(JSON.stringify(d.ledger));S.ledgerCommitted=true;S.askedFamily=true;
    S.qAnswers=demoAnswers(cs,k);S.declared={};S.beat=cs.beats.length-1;route();};});
  /* report */
  all("[data-mech]",function(el){el.onclick=function(){
    var p=document.getElementById("mechPanel");if(!p)return;
    var mut=el.getAttribute("data-mech")==="mutant";
    p.classList.toggle("mutant",mut);
    all("[data-mech]",function(b){b.setAttribute("aria-selected",String((b.getAttribute("data-mech")==="mutant")===mut));});};});
  all("[data-adj]",function(el){el.onclick=function(){var p=el.getAttribute("data-adj").split("|");
    S.adjudication[p[0]]=p[1];route();};});
  all("[data-probeshow]",function(el){el.onclick=function(){
    var key=el.getAttribute("data-probeshow").replace("|","_");
    var inp=document.querySelector('[data-probe="'+el.getAttribute("data-probeshow")+'"]');
    S.probeAns[key]=inp&&inp.value?inp.value:"(left blank)";route();};});
  var ct=document.getElementById("codaText");if(ct)ct.oninput=function(){S.codaText=ct.value;};
  var cg=document.getElementById("codaGo");if(cg)cg.onclick=function(){S.codaRevealed=true;route();};
  var fr=document.getElementById("forgeRun");
  if(fr)fr.onclick=function(){var t=document.getElementById("forgeRaw");S.forgeRaw=t?t.value:"";route();};
  /* deterministic strike + loop animation: one class flip on the next frame */
  requestAnimationFrame(function(){
    all(".delim.struck",function(el){el.classList.add("go");});
    var cw=document.getElementById("codaWrong");if(cw)cw.classList.add("go");});
}

/* ============================================================
   BOOT
   ============================================================ */
app=document.getElementById("app");
try{SELFTEST=__selftest();}catch(e){SELFTEST={pass:0,total:1,fails:["exception: "+e.message]};
  if(window.console)console.error(e);}
if(SELFTEST.fails.length&&window.console)console.warn("self-test failures:",SELFTEST.fails);
window.__selftest=__selftest;
window.__grade=gradeQuestions;
window.__gradeQuestion=gradeQuestion;
window.__case=VHL;
window.__cohort=cohort;
window.addEventListener("hashchange",route);
draw();
</script>
