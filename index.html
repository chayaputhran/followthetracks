<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Follow the Tracks — Clinical Reasoning, Examined</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='13' cy='13' r='9' stroke='%230f5b56' stroke-width='2.2'/%3E%3Cpath d='M20 20 L28 28' stroke='%230f5b56' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M8 13 h2.4 l1.6 -4 l2.4 8 l1.8 -5 l1.2 3 h3' stroke='%238a2d1f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
<style>
:root{
  --paper:#f4efe4; --paper-2:#efe8da; --card:#fbf8f1; --line:#ddd4c2; --line-2:#ccc1a9;
  --ink:#26221b; --ink-soft:#55503f; --ink-faint:#8a8371;
  --accent:#0f5b56; --accent-soft:rgba(15,91,86,.12);
  --danger:#8a2d1f; --danger-soft:rgba(138,45,31,.10);
  --amber:#a06a12; --amber-soft:rgba(160,106,18,.14);
  --green:#3e6b34; --green-soft:rgba(62,107,52,.12);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --pad:20px; --rowh:44px;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"SF Mono","Cascadia Mono",Consolas,"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--font-body);line-height:1.55;font-size:15px;background:var(--paper);
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(15,91,86,.04),transparent 60%);overflow-x:hidden}
button{font-family:var(--font-body);cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700}
/* ---- the branding seam: serif is reserved for faculty-authored case content ---- */
.voice-case{font-family:var(--font-display)}
cite.src{display:block;font-family:var(--font-mono);font-style:normal;font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-faint);margin-top:8px}
blockquote.qt{margin:12px 0;padding:10px 0 10px 16px;border-left:2px solid var(--accent);font-family:var(--font-display);
  font-size:16px;line-height:1.6;color:var(--ink)}
blockquote.qt p{margin:2px 0}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;
  background:var(--card);border-bottom:1px solid var(--line-2)}
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.logo{width:32px;height:32px;flex:0 0 auto}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.wordmark small{display:block;font-family:var(--font-mono);font-weight:600;font-size:8px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-top:-1px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:5px;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--paper-2)}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:9px;font-size:12.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#f4efe4;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono)}
.rolebadge{font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:2px 7px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-faint)}
.linkbtn{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:0}
/* below 700px the fixed bottom tab bar carries navigation, so the inline nav
   is redundant — and it is what pushes the user chip off a 360px screen */
@media(max-width:700px){.appbar .nav{display:none}}
@media(max-width:560px){.appbar{padding:0 12px;gap:10px}.brandmark{gap:8px}.userchip{gap:7px}.userchip .small{display:none}}
@media(max-width:400px){.userchip .rolebadge{display:none}.wordmark small{display:none}}
/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:26px var(--pad) 110px}
.crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.crumbs a{color:var(--ink-faint);text-decoration:none;cursor:pointer}
.eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700;position:relative;padding-bottom:8px;margin-bottom:12px;display:inline-block}
.eyebrow:after{content:"";position:absolute;left:0;bottom:0;width:24px;height:2px;background:var(--accent)}
.pagetitle{font-size:clamp(24px,4vw,32px);margin:0 0 6px;line-height:1.1}
.pagesub{color:var(--ink-soft);font-size:15px;margin:0 0 22px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:22px 24px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink-faint);margin:22px 0 10px;font-weight:700}
.small{font-size:12.5px;color:var(--ink-faint)}
.kicker{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);font-weight:700}
.btn{font-size:13.5px;font-weight:600;border-radius:6px;padding:10px 18px;border:1px solid var(--ink-soft);background:transparent;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);color:#f4efe4;border-color:var(--accent)}
.btn.primary:hover{background:#0c4a46}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line-2);color:var(--ink-soft)}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
textarea{width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);
  font-family:var(--font-body);font-size:14.5px;line-height:1.55;color:var(--ink);resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.line{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);font-family:var(--font-body);font-size:14px;color:var(--ink)}
.prompt{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:8px}
.footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-faint);line-height:1.7}
.vbadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-faint);margin-top:8px}
.vbadge .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
.vbadge.bad{border-color:var(--danger);color:var(--danger)}.vbadge.bad .d{background:var(--danger)}
.disclaimer{font-size:11.5px;color:var(--ink-faint);line-height:1.6;font-style:italic}
/* landing */
.hero{padding:20px 0 8px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.02;margin:8px 0 14px;letter-spacing:-.5px}
.hero p.lede{font-size:clamp(16px,2.4vw,20px);color:var(--ink-soft);max-width:52ch;margin:0 0 26px;font-family:var(--font-display)}
.specimen{background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:22px 24px;max-width:640px;box-shadow:0 24px 60px -40px rgba(60,40,20,.6)}
.specimen .cap{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
.specimen .sent{font-family:var(--font-display);font-size:20px;line-height:1.55;min-height:2.6em}
.specimen .caret{border-right:2px solid var(--accent);animation:blink 1s step-end infinite}
@keyframes blink{50%{border-color:transparent}}
.spchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;opacity:0;transition:opacity .6s var(--ease)}
.spchips.show{opacity:1}
.spchip{font-size:12px;font-family:var(--font-mono);padding:5px 10px;border-radius:20px;border:1px solid var(--green);color:var(--green);background:var(--green-soft);font-weight:600}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;margin:30px 0}
.door{text-align:left;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:18px 20px;transition:.15s var(--ease)}
.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door .r{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.door .n{font-family:var(--font-display);font-size:18px;font-weight:700;margin:6px 0 3px}
.door .d{font-size:12.5px;color:var(--ink-faint)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0}
.step .no{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700}
.step .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin:4px 0 2px}
.step .x{font-size:12px;color:var(--ink-faint)}
.collegestrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.cbox{border:1px solid var(--line-2);border-radius:7px;padding:16px;background:var(--paper-2)}
.cbox .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:4px}
.cbox .x{font-size:12.5px;color:var(--ink-faint)}
@media(max-width:820px){.doors,.steps,.collegestrip{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.doors,.steps,.collegestrip{grid-template-columns:1fr}}
/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.casecard{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;transition:.15s var(--ease);cursor:pointer}
.casecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.casecard .sys{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700}
.casecard h3{font-family:var(--font-display);font-size:18px;margin:0}
.casecard .ol{font-size:13px;color:var(--ink-soft);flex:1}
.casecard .meta{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-faint);align-items:center;flex-wrap:wrap}
.dchip{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border:1px solid var(--line-2);border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.comp{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.donef{color:var(--green);font-weight:700;font-family:var(--font-mono);font-size:11px}
</style>

<style>
/* ================= ENCOUNTER: the rewinding spine ================= */
.enc{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
/* grid children default to min-width:auto and will not shrink below their
   content — which lets the spine push the whole page sideways on a phone */
.enc>*{min-width:0}
.railwrap{position:sticky;top:78px;min-width:0}
.spine{position:relative;padding-left:14px}
.railstep{display:flex;align-items:center;gap:11px;height:var(--rowh);font-size:13px;color:var(--ink-faint)}
.railstep .mk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-family:var(--font-mono);font-weight:700;flex:0 0 auto;background:var(--paper)}
.railstep .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.railstep.done{color:var(--ink-soft)}
.railstep.done .mk{background:var(--accent);border-color:var(--accent);color:#f4efe4}
.railstep.on{color:var(--accent)}
.railstep.on .mk{border-color:var(--accent);border-width:2px;color:var(--accent)}
.railstep.disrupt .mk{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.railstep.revised{padding-left:16px}
.railstep.superseded{opacity:.45}
.spine-loop{position:absolute;left:0;width:12px;border:1.5px dashed var(--accent);border-right:none;border-radius:9px 0 0 9px;
  opacity:0;transition:opacity .45s var(--ease);pointer-events:none}
.spine.looped .spine-loop{opacity:1}
@media(max-width:880px){
  .enc{grid-template-columns:1fr}
  .railwrap{position:static}
  .spine{display:flex;overflow-x:auto;padding:0 0 6px;gap:4px}
  .spine-loop{display:none}
  .railstep{height:auto;padding:6px 8px;flex:0 0 auto}
  .railstep .lb{display:none}
  .railstep.revised{padding-left:8px}
}
/* beat cards */
.beat{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:22px 24px;margin-bottom:16px}
.beat h2{font-size:20px;margin:4px 0 2px;font-family:var(--font-display)}
.beat .stagetok{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);font-weight:700}
.beat.locked{opacity:.85;background:var(--paper-2)}
.locked-recap{border-left:2px solid var(--accent);padding:8px 0 8px 14px;margin-top:10px;white-space:pre-wrap;font-family:var(--font-display);font-size:15px}
.locked-recap .lbl{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.dlg{margin:10px 0 4px;border-left:2px solid var(--line-2);padding-left:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:3px 0;align-items:baseline}
.dl .sp{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);white-space:nowrap}
.dl .tx{color:var(--ink);font-family:var(--font-display);font-size:15.5px}
.narr{font-family:var(--font-display);font-style:italic;color:var(--ink-soft);margin:10px 0}
@media(max-width:520px){.dl{grid-template-columns:1fr;gap:1px}}
.labtable{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.labtable caption{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);padding-bottom:6px;font-weight:700}
.labtable th{text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--line-2);padding:5px 8px 5px 0}
.labtable td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.flagpill{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--danger-soft);color:var(--danger)}
.findingrow{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.findingrow .lb{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700}
@media(max-width:560px){.findingrow{grid-template-columns:1fr;gap:2px}}
/* ================= the two inverted disruption bands ================= */
.disruptband{margin:22px calc(-1 * var(--pad));padding:26px var(--pad);background:var(--ink);color:var(--paper);border-radius:0}
.disruptband .eyebrow{color:var(--paper);opacity:.75}
.disruptband .eyebrow:after{background:var(--paper);opacity:.5}
.disruptband h2{color:var(--paper)}
.disruptband .small{color:rgba(244,239,228,.65)}
.disruptband .dlg{border-left-color:rgba(244,239,228,.28)}
.disruptband .dl .sp{color:rgba(244,239,228,.6)}
.disruptband .dl .tx{color:var(--paper)}
.disruptband .narr{color:rgba(244,239,228,.7)}
.disruptband .datum{font-family:var(--font-mono);font-size:clamp(19px,4.6vw,28px);font-weight:700;line-height:1.35;margin:12px 0}
.disruptband .findingrow{border-bottom-color:rgba(244,239,228,.18)}
.disruptband .findingrow .lb{color:rgba(244,239,228,.6)}
.disruptband textarea,.disruptband input.line{background:rgba(244,239,228,.07);border-color:rgba(244,239,228,.3);color:var(--paper)}
.disruptband .btn{border-color:rgba(244,239,228,.5);color:var(--paper)}
.disruptband .btn:hover{background:rgba(244,239,228,.12)}
.disruptband .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.disruptband blockquote.qt{border-left-color:rgba(244,239,228,.5);color:var(--paper)}
.disruptband cite.src{color:rgba(244,239,228,.5)}
.yourwords{border:1px dashed rgba(244,239,228,.4);border-radius:6px;padding:12px 14px;margin:12px 0;font-family:var(--font-display);font-size:15.5px}
.yourwords .lbl{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-bottom:5px}
.verdictset{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.vopt{flex:1 1 150px;text-align:left;background:transparent;border:1px solid rgba(244,239,228,.35);border-radius:6px;padding:12px 14px;color:var(--paper)}
.vopt:hover{background:rgba(244,239,228,.1)}
.vopt.sel{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.vopt .vt{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block}
.vopt .vx{font-size:12px;opacity:.75;display:block;margin-top:3px}
.chipset{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.echip{background:transparent;border:1px solid rgba(244,239,228,.35);border-radius:20px;padding:6px 13px;color:var(--paper);font-size:12.5px;font-family:var(--font-mono)}
.echip.sel{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
/* ================= differential elimination ledger ================= */
.delim{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.delim .dx{position:relative;font-family:var(--font-display);font-size:16px;font-weight:700;display:inline-block}
.delim .dx::after{content:'';position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--danger);
  transition:width .45s var(--ease);transition-delay:calc(var(--i) * 90ms)}
.delim.struck.go .dx::after{width:100%}
.delim.unlikely{opacity:.72}
.states{display:flex;gap:5px}
.sbtn{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  padding:5px 9px;border-radius:4px;border:1px solid var(--line-2);background:transparent;color:var(--ink-faint)}
.sbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sbtn.on[data-st="dead"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.sbtn.on[data-st="unlikely"]{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.evpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.evb{font-size:11px;font-family:var(--font-mono);padding:3px 9px;border-radius:20px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-faint)}
.evb.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.delim .verdictline{font-family:var(--font-display);font-size:14px;color:var(--ink-soft);margin-top:6px;font-style:italic}
.warnline{color:var(--danger);font-size:12.5px;margin-top:6px;font-weight:600}
@media(max-width:560px){.delim{grid-template-columns:1fr}}
/* ================= hypothesis board ================= */
.hboard{margin-bottom:16px}
.hcard{border:1px solid var(--line-2);border-radius:7px;padding:14px 16px;background:var(--card);position:relative;margin-bottom:10px}
.hcard .hl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.hcard .ht{font-family:var(--font-display);font-size:15px;margin-top:5px;white-space:pre-wrap}
.hcard.retired{filter:grayscale(1);opacity:.72;transition:opacity .4s var(--ease),filter .4s var(--ease)}

/* ============================================================

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){

/* ---------------- tokenizer (raw offsets preserved) ---------------- */

var Q_CONN_EXTRA=[["increases"],["increase"],["stimulates"],["stimulate"],["releases"],["release"],
 ["response"],["responds"],["drives"],["drive"],["produces"],["produce"],["promotes"],["promote"],
 ["activates"],["activate"],["leads"],["lead"],["results"],["result"],["makes"],["make"],["means"],
 ["binds"],["bind"],["permits"],["permit"],["allows"],["allow"],["escapes"],["escape"],
 ["prevents"],["prevent"],["recognises"],["recognizes"],["recognise"],["recognize"],
 ["attaches"],["attach"],["destroys"],["destroy"],["marks"],["mark"],["targets"],["target"],
 ["therefore"],["hence"],["because"],["since"],["so"],["unless"],["thus"],["whereas"]];
var Q_CONN=CONN_CUES.concat(Q_CONN_EXTRA);
function cueAt(toks,k){for(var q=0;q<Q_CONN.length;q++){var cu=Q_CONN[q];if(k+cu.length>toks.length)continue;
  var ok=true;for(var j=0;j<cu.length;j++){if(toks[k+j].norm!==cu[j]){ok=false;break;}}if(ok)return true;}return false;}
function connNearQ(toks,hit,win){var c=hit.clause,lo=Math.max(0,hit.tokenStart-win),hi=Math.min(toks.length-1,hit.tokenEnd+win);
  for(var k=lo;k<=hi;k++){if(toks[k].clause!==c)continue;if(cueAt(toks,k))return true;}return false;}

var HONESTY_RE=/(not come across|have not come across|haven'?t (met|come across|encountered|seen)|never (heard|came across|met)|fails my memory|escapes me|don'?t know|do not know|not sure|unsure|can'?t recall|cannot recall|could not recall|unfamiliar|no idea|blanking|new to me|not met this)/i;

function qConcept(id,syns){return {id:id,synonyms:syns,_syn:syns.map(synStruct)};}
function analyseAnswer(rawText,concepts){
 var toks=tokenize(rawText);assignClauses(rawText,toks);
 var neg=findCues(toks,NEG_CUES),con=findCues(toks,CON_CUES);var by={};
 concepts.forEach(function(c){var m=mergeHits(matchConcept(toks,c));m.forEach(function(h){
   h.conceptId=c.id;h.clause=toks[h.tokenStart].clause;
   h.negated=cueNear(neg,h,5,true);h.considered=cueNear(con,h,5,false);
   h.rawStart=toks[h.tokenStart].start;h.rawEnd=toks[h.tokenEnd].end;
   h.reasoned=connNearQ(toks,h,12);});
   if(m.length)by[c.id]=m;});
 return {toks:toks,byConcept:by};
}
function cleanHit(by,id){var hs=by[id]||[];return hs.some(function(h){return !h.negated&&!h.considered;});}
function contentTokenCount(toks){var n=0;toks.forEach(function(t){if(!STOP[t.norm])n++;});return n;}

/* Does any single clause hold two distinct core concepts AND a causal cue?
   That is the difference between a chain and a pile. */
function hasLinkedClause(toks,by,coreIds){
  var perClause={};
  coreIds.forEach(function(cid){(by[cid]||[]).forEach(function(h){
    if(h.negated||h.considered)return;
    if(!perClause[h.clause])perClause[h.clause]={};
    perClause[h.clause][cid]=1;});});
  for(var cl in perClause){
    var n=0;for(var k in perClause[cl])n++;
    if(n<2)continue;
    for(var i=0;i<toks.length;i++){if(toks[i].clause!==Number(cl))continue;if(cueAt(toks,i))return true;}
  }
  return false;
}

var GAP_CREDIT=0.65;   /* solved, not fitted: 72 + 20g = 85  =>  g = 0.65 */

var STATUS_GLYPH={
  correct:"green", extend:"green",
  refine:"amber", newConcept:"amber", asserted:"amber",
  factGap:"red", wrongFact:"red", contradicts:"red", insufficient:"red",
  unattempted:"mute"
};
var STATUS_FALLBACK={
  correct:"Correct", extend:"Correct mechanism", refine:"Correct idea, mechanism needs refinement",
  newConcept:"New concept met", asserted:"Named without reasoning", factGap:"Gap declared",
  wrongFact:"Not this one", contradicts:"Contradicts the evidence",
  insufficient:"Too little to grade", unattempted:"Not attempted"
};

function gradeQuestion(item,answer,declared){
  answer=String(answer==null?"":answer);
  var out={id:item.id,kind:item.recall?"recall":"reasoning",w:item.w,status:null,conduct:null,
    stars:null,frac:0,distinction:false,hits:{},feedback:"",extendText:null,refineChain:null,suspectStuffing:false,label:""};

  function done(status,conduct,stars,frac,fb){
    out.status=status;out.conduct=conduct;out.stars=stars;out.frac=frac;
    out.feedback=fb||"";
    out.label=(item.labels&&item.labels[status])||STATUS_FALLBACK[status]||status;
    return out;
  }

  /* 0 — nothing written and nothing declared. No row on the scorecard; still in
         the denominator. A DECLARED gap also has an empty textarea, so the
         declaration has to be tested first or honesty reads as silence. */
  if(!answer.trim()&&!declared)return done("unattempted","silent",null,0,"");

  var pool=(item.core||[]).slice();
  if(item.refine)pool.push(item.refine);
  if(item.exclude)pool.push(item.exclude);
  (item.pivot||[]).forEach(function(c){pool.push(c);});
  (item.contra||[]).forEach(function(c){pool.push(c);});
  (item.extendConcepts||[]).forEach(function(c){pool.push(c);});

  var an=analyseAnswer(answer,pool),by=an.byConcept,toks=an.toks;
  Object.keys(by).forEach(function(k){out.hits[k]=true;});

  var coreIds=(item.core||[]).map(function(c){return c.id;});
  var coreHits=(item.core||[]).filter(function(c){return cleanHit(by,c.id);});
  var coreHit=coreHits.length>0;
  var wrongAssertion=(item.contra||[]).some(function(c){return cleanHit(by,c.id);});
  var declaredGap=!!declared||HONESTY_RE.test(answer);

  /* 1 — substance floor. A punctuation mark or a shrug is not an answer.
         Reasoning questions only: a recall answer is legitimately one word,
         so "belzutifan" must pass and "sunitinib" must be graded as a wrong
         fact rather than dismissed as noise. */
  if(!item.recall && contentTokenCount(toks)<4 && !coreHit && !declaredGap && !wrongAssertion)
    return done("insufficient","silent",null,0,"Too little here to grade. Nothing was read as an attempt at the mechanism.");

  /* 2 — honest gap. Declared or written; never punished, never confused with stuffing. */
  if(declaredGap && !coreHit && !wrongAssertion){
    return done(item.recall?"factGap":"newConcept","honest",null,GAP_CREDIT,
      item.feedbackGap||"A concept you had not met. It is now on the record.");
  }

  /* 3 — recall questions. Three ways to answer, and guessing wrong is not honesty. */
  if(item.recall){
    if(coreHit)return done("correct","reasoned",null,1,item.feedback5);
    return done("wrongFact","asserted",null,0,item.feedbackWrong||"Not this one.");
  }

  /* 4 — reasoning questions. */
  if(wrongAssertion)
    return done("contradicts","asserted",0,0,item.feedbackContra||"This runs against the evidence in the case.");

  var reasoned=(item.core||[]).some(function(c){var hs=by[c.id]||[];
    return hs.some(function(h){return !h.negated&&!h.considered&&h.reasoned;});});

  /* 4a — Q2 is an exclusion question: naming the normal investigations IS the answer.
          Must run before the force-assert rule, or the correct list gets punished. */
  if(item.special==="exclusion"){
    var nInv=(item.core||[]).filter(function(c){return (by[c.id]||[]).length>0;}).length;
    var exHit=item.exclude?cleanHit(by,item.exclude.id):false;
    if(nInv>=1&&exHit)return done("correct","reasoned",5,1,item.feedback5);
    if(nInv>=2)return done("refine","reasoned",4,0.8,item.feedback4);
  }

  /* 4b — Q3 rewards seeing the contradiction itself. */
  if(item.special==="contradiction"){
    var epoHit=cleanHit(by,"epo");
    var pivotHit=(item.pivot||[]).some(function(c){return cleanHit(by,c.id);});
    if(epoHit&&pivotHit&&reasoned){out.distinction=!!item.pivotQuestion;
      return done("correct","reasoned",5,1,item.feedback5);}
  }

  /* 4c — force-assert. Four or more concepts and not one clause links two of them
          with a causal cue: that is a keyword pile wearing a sentence's clothes. */
  if(coreHits.length>=4 && !hasLinkedClause(toks,by,coreIds)){
    out.suspectStuffing=true;
    return done("asserted","asserted",2,0.4,"The right concepts are all here, but nothing links them. Say what causes what.");
  }

  /* 4d — the ladder. */
  if(!coreHit)
    return done("asserted","asserted",1,0.2,"Only a tangential idea appears — name the core mechanism.");
  if(!reasoned)
    return done("asserted","asserted",2,0.4,"Concepts named without linking them — state the reason.");

  var refineHit=item.refine?cleanHit(by,item.refine.id):false;
  if(item.refine&&!refineHit){
    out.refineChain=item.refine.chain||null;
    return done("refine","reasoned",4,0.8,item.feedback4||item.feedback5);
  }
  var enough=((item.core||[]).length<=1)||coreHits.length>=2;
  if(!enough)return done("refine","reasoned",3,0.6,item.feedback4||item.feedback5);

  /* Nothing is wrong; the scope is simply narrower than the full answer.
     Doc 4 gives five stars and then adds to it — so extend must not cap. */
  if(item.extend){
    var allExt=(item.extendConcepts||[]).every(function(c){return cleanHit(by,c.id);});
    if(!allExt){out.extendText=item.extend.text;
      return done("extend","reasoned",5,1,item.feedback5);}
  }
  if(item.pivotQuestion)out.distinction=true;
  return done("correct","reasoned",5,1,item.feedback5);
}

function greatestStrength(caseObj,res){
  var best=null;
  (caseObj.questions||[]).forEach(function(it){
    var r=res[it.id];if(!r)return;
    if(r.status!=="correct"&&r.status!=="extend")return;
    if(r.conduct!=="reasoned")return;
    var score=it.w+(it.pivotQuestion?100:0);
    if(!best||score>best.score)best={id:it.id,q:it.qtext,score:score,note:it.strengthNote||""};
  });
  return best;
}

function gradeQuestions(caseObj,ans,state){
  ans=ans||{};state=state||{};
  var declared=state.declared||{};
  var qs=caseObj.questions||[],res={},reasonEarned=0,recallEarned=0,earned100=0;
  var assertionCount=0,honestGapCount=0,honestGapMarks=0,attemptedCount=0,suspectCount=0;
  qs.forEach(function(item){
    var r=gradeQuestion(item,ans[item.id]||"",declared[item.id]);
    res[item.id]=r;
    var pts=r.frac*item.w;earned100+=pts;
    if(item.recall)recallEarned+=pts;else reasonEarned+=pts;
    if(r.status!=="unattempted")attemptedCount++;
    if(r.conduct==="asserted"&&!item.recall)assertionCount++;
    if(r.status==="newConcept"||r.status==="factGap"){honestGapCount++;honestGapMarks+=GAP_CREDIT*item.w;}
    if(r.suspectStuffing)suspectCount++;
  });
  var d1=state.interlock&&state.interlock.d1?state.interlock.d1:null;
  var d2=state.interlock&&state.interlock.d2?state.interlock.d2:null;
  var killers=(caseObj.disruptions&&caseObj.disruptions[0].killers)||[];
  var nKill=d1&&d1.evidence?d1.evidence.filter(function(e){return killers.indexOf(e)>=0;}).length:0;
  var flags={
    anchored: !!(d1&&d1.verdict&&d1.verdict!=="dead"),
    cleanRevision: !!(d1&&d1.verdict==="dead"&&nKill>=3&&d2&&d2.choice==="sensing"),
    assertionCapped: assertionCount>=3
  };
  return {q:res,earned100:earned100,overall10:Math.round(earned100)/10,
    reasoningPct:Math.round(reasonEarned/90*100),recallPct:Math.round(recallEarned/10*100),
    assertionCount:assertionCount,honestGapCount:honestGapCount,
    honestGapMarks:honestGapMarks/10,attemptedCount:attemptedCount,suspectCount:suspectCount,
    flags:flags,strength:greatestStrength(caseObj,res)};
}

function lintCase(c){
  var errors=[],warnings=[];
  var wsum=(c.questions||[]).reduce(function(s,q){return s+(q.w||0);},0);
  if(wsum!==100)errors.push("Question weights sum to "+wsum+", not 100.");
  var reasoning=(c.questions||[]).reduce(function(s,q){return s+(q.recall?0:q.w);},0);
  var recall=(c.questions||[]).reduce(function(s,q){return s+(q.recall?q.w:0);},0);
  if(reasoning!==90||recall!==10)errors.push("Reasoning/recall split is "+reasoning+"/"+recall+", not 90/10.");
  (c.questions||[]).forEach(function(q){
    if(!q.model||!q.model.lines||!q.model.lines.length)errors.push(q.id+" has no model answer.");
    if(!q.feedbackGap)errors.push(q.id+" has no gap feedback.");
    if(q.recall&&!q.feedbackWrong)errors.push(q.id+" is a recall question with no wrong-answer feedback.");
    if(q.recall&&q.feedbackWrong&&/honest|admit|uncertain/i.test(q.feedbackWrong))
      errors.push(q.id+" praises honesty in its WRONG-answer feedback.");
    (q.chain||[]).forEach(function(l){
      var known=(q.core||[]).some(function(cc){return cc.id===l.conceptId;})||(q.refine&&q.refine.id===l.conceptId);
      if(!known)errors.push(q.id+" chain link references unknown concept '"+l.conceptId+"'.");});
  });
  var evIds={};(c.ledger.evidence||[]).forEach(function(e){evIds[e.id]=1;});
  (c.ledger.rows||[]).forEach(function(r){(r.killedBy||[]).forEach(function(e){
    if(!evIds[e])errors.push("Ledger row "+r.id+" cites unknown evidence '"+e+"'.");});});
  var chipIds={};(c.disruptions[0].chips||[]).forEach(function(ch){chipIds[ch.id]=1;});
  (c.disruptions[0].killers||[]).forEach(function(k){if(!chipIds[k])errors.push("d1 killer '"+k+"' is not a chip.");});
  if(!chipIds[c.disruptions[0].decoy])errors.push("d1 decoy is not a chip.");
  return {errors:errors,warnings:warnings,weightSum:wsum};
}

function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function cohort(caseObj){
  var rnd=mulberry32(hashStr(caseObj.id)),N=60,students=[];
  var tiers=["strong","saba","gamed","weak"];
  for(var i=0;i<N;i++){
    var r=rnd(),tier=r<0.22?"strong":r<0.60?"saba":r<0.76?"gamed":"weak";
    var ans=demoAnswers(caseObj,tier),st=demoState(caseObj,tier);
    var declared={};
    /* deterministic per-student variation: drop or declare some answers */
    (caseObj.questions||[]).forEach(function(it){
      var d=rnd();
      if(d<0.10)ans[it.id]="";
      else if(d<0.18){ans[it.id]="I have not met this one.";declared[it.id]=true;}
    });
    var g=gradeQuestions(caseObj,ans,{declared:declared,interlock:st.interlock,ledger:st.ledger});
    students.push({name:NAMES[i%NAMES.length]+" "+(Math.floor(i/NAMES.length)+1),tier:tier,g:g});
  }
  var perQ={};(caseObj.questions||[]).forEach(function(it){
    var miss=0,gap=0,stuff=0;
    students.forEach(function(s){var r=s.g.q[it.id];
      if(r.frac<0.5)miss++;
      if(r.status==="newConcept"||r.status==="factGap")gap++;
      if(r.suspectStuffing)stuff++;});
    perQ[it.id]={miss:Math.round(miss/N*100),gap:Math.round(gap/N*100),stuff:stuff,qtext:it.qtext,w:it.w};});
  var mean=students.reduce(function(s,x){return s+x.g.overall10;},0)/N;
  var anchored=students.filter(function(s){return s.g.flags.anchored;}).length;
  var honest=students.filter(function(s){return s.g.honestGapCount>0;}).length;
  var suspect=students.filter(function(s){return s.g.suspectCount>0;}).length;
  return {students:students,N:N,perQ:perQ,mean:mean,anchored:anchored,honest:honest,suspect:suspect,tiers:tiers};
}

  ok("ANCHOR saba earned100 === 85.00 (got "+saba.earned100.toFixed(2)+")",Math.abs(saba.earned100-85)<1e-9);
  ok("ANCHOR saba overall === 8.5",saba.overall10===8.5);
  eq("ANCHOR saba fracs",QIDS.map(function(i){return saba.q[i].frac;}),[1,1,1,0.65,0.8,1,0.65,0]);
  eq("ANCHOR saba stars",QIDS.map(function(i){return saba.q[i].stars;}),[5,5,5,null,4,5,null,null]);
  eq("ANCHOR saba statuses",QIDS.map(function(i){return saba.q[i].status;}),
     ["correct","correct","correct","newConcept","refine","extend","factGap","unattempted"]);
  ok("ANCHOR saba q3 carries the distinction",saba.q.q3.distinction===true);
  ok("ANCHOR saba attempted 7 of 8",saba.attemptedCount===7);
  ok("ANCHOR saba greatest strength is the pivot question",saba.strength&&saba.strength.id==="q3");

  /* ---- the denominator: honesty must beat silence, end to end ---- */
  var blank=saba.overall10;
  var honest=gradeDemo(cs,"saba",{q8:"I cannot recall which discovery it was."}).overall10;
  var right=gradeDemo(cs,"saba",{q8:"The 2019 Nobel Prize to Kaelin, Ratcliffe and Semenza."}).overall10;
  ok("silence 8.5 (got "+blank+")",blank===8.5);
  ok("honesty 8.8 (got "+honest+")",honest===8.8);
  ok("correct 9.0 (got "+right+")",right===9.0);
  ok("ORDERING silence < honesty < correct",blank<honest&&honest<right);
  ok("GAP constant centred: 72 + 20*0.65 === 85",Math.abs(72+20*GAP_CREDIT-85)<1e-9);

  /* ---- honest gap outranks assertion outranks wrong/silent, on every question ---- */
  var orderOK=true;
  cs.questions.forEach(function(it){
    if(GAP_CREDIT<=0.4||0.4<=0)orderOK=false;
    var g=gradeQuestion(it,"I have not come across this before.");
    if(!(g.frac===GAP_CREDIT))orderOK=false;
    var w=gradeQuestion(it,"");
    if(!(w.frac===0&&w.status==="unattempted"))orderOK=false;});
  ok("ORDERING honest 0.65 > asserted 0.40 > wrong 0 === silent 0",orderOK);

  /* ---- the DECLARE button clears the textarea, so a declaration must never
         be mistaken for silence. Same mark either way. ---- */
  var byButton=gradeQuestions(cs,
    {q1:cs.demo.saba.q1,q2:cs.demo.saba.q2,q3:cs.demo.saba.q3,q4:"",q5:cs.demo.saba.q5,
     q6:cs.demo.saba.q6,q7:"",q8:""},
    {declared:{q4:true,q7:true},interlock:cs.demo.saba.interlock,ledger:cs.demo.saba.ledger});
  ok("DECLARED button reproduces the same 8.5 as the typed admission (got "+byButton.overall10+")",
     byButton.overall10===8.5);
  ok("DECLARED button yields two honest gaps, not two silences",byButton.honestGapCount===2);
  ok("DECLARED q4 is a new concept, not unattempted",byButton.q.q4.status==="newConcept");
  ok("DECLARED q7 is a fact gap, not unattempted",byButton.q.q7.status==="factGap");
  ok("DECLARED honest marks total 1.3 of 10",Math.abs(byButton.honestGapMarks-1.3)<1e-9);

  /* ---- the five defects that were live in the previous engine ---- */
  var d1=gradeQuestion(qById(cs,"q7"),"sunitinib");
  ok("DEFECT 1 wrong guess is not scored as honesty",
     d1.status==="wrongFact"&&d1.frac===0&&!/honest|admit|uncertain/i.test(d1.feedback));
  var d2=gradeQuestion(qById(cs,"q5"),"VHL destroys HIF only when oxygen is absent");
  ok("DEFECT 2 inverted mechanism on the pivot is caught",d2.status==="contradicts"&&d2.frac===0);
  ok("DEFECT 3a a punctuation mark scores nothing",gradeQuestion(qById(cs,"q4"),"?").frac===0);
  ok("DEFECT 3b a shrug scores nothing",gradeQuestion(qById(cs,"q4"),"hmm").frac===0);
  ok("DEFECT 3c but a declared gap still earns credit",gradeQuestion(qById(cs,"q4"),"not sure").frac===GAP_CREDIT);
  var narrow=gradeQuestion(qById(cs,"q6"),"If VHL is mutated, more HIF is available and tissues sense hypoxia and promote survival genes.");
  ok("DEFECT 4 correct-but-narrow earns 5 stars and an addition, not a cap",
     narrow.stars===5&&narrow.frac===1&&narrow.status==="extend"&&!!narrow.extendText);
  var d5=gradeQuestion(qById(cs,"q1"),"hypoxia to erythropoietin to bone marrow to red cells to haemoglobin");
  ok("DEFECT 5 a chain of bare prepositions is a keyword pile (got "+d5.frac+")",
     d5.frac===0.4&&d5.status==="asserted"&&d5.suspectStuffing===true);

  /* ---- refine vs extend are different instruments ---- */
  ok("q5 refines (something is wrong), q6 extends (nothing is wrong)",
     !!qById(cs,"q5").refine&&!qById(cs,"q5").extend&&!!qById(cs,"q6").extend&&!qById(cs,"q6").refine);
  ok("REFINE the hydroxylation step lifts 4 to 5",
     gradeQuestion(qById(cs,"q5"),"prolyl hydroxylases hydroxylate HIF so VHL binds the hydroxylated HIF for proteasomal degradation").stars===5);
  ok("REFINE regression: the student's own q5 still sits at 4",saba.q.q5.stars===4);

  /* ---- gaming wears a gap's clothes ---- */
  var stuffedGap=gradeQuestion(qById(cs,"q4"),"I don't know, but: false hypoxia oxygen sensing pathway");
  ok("a stuffed answer wearing a gap's clothes is not a gap",
     stuffedGap.status==="asserted"&&stuffedGap.frac===0.4);
  ok("RECALL FLOOR a terse correct recall survives the substance floor",
     gradeQuestion(qById(cs,"q7"),"belzutifan").frac===1);

  /* ---- the exclusion question must not be punished for listing correctly ---- */
  ok("the model list of normal investigations is credited, not force-asserted",
     gradeQuestion(qById(cs,"q2"),"pulse oximetry arterial blood gas chest x-ray pulmonary function echocardiogram normal").frac>=0.8);

  /* ---- the other fixtures ---- */
  var strong=gradeDemo(cs,"strong"),gamed=gradeDemo(cs,"gamed"),weak=gradeDemo(cs,"weak");
  ok("strong >= 9.5 (got "+strong.overall10+")",strong.overall10>=9.5);
  ok("gamed <= 5.0 (got "+gamed.overall10+")",gamed.overall10<=5.0);
  ok("gamed is flagged as suspect",gamed.suspectCount>=1);
  ok("gamed is never read as honest",gamed.honestGapCount===0);
  ok("weak <= 3.0 (got "+weak.overall10+")",weak.overall10<=3.0);

  /* ---- interlock flags now measure what the documents describe ---- */
  ok("saba revised cleanly",saba.flags.cleanRevision===true&&saba.flags.anchored===false);
  ok("the gamed fixture holds a dead hypothesis and is flagged anchored",gamed.flags.anchored===true);

  /* ---- provenance must stay visible, because it moves the headline ---- */
  var alt=gradeDemo(cs,"saba",{q6:"VHL binds to HIF in presence of oxygen??"});
  ok("PROVENANCE the disputed q6 text moves the mark by 1.2 (got "+alt.overall10+")",alt.overall10===7.3);
  ok("PROVENANCE the divergence is recorded on the fixture",!!cs.demo.saba._provenance);

  /* ---- determinism ---- */
  ok("grading is deterministic",JSON.stringify(gradeDemo(cs,"saba").q)===JSON.stringify(gradeDemo(cs,"saba").q));
  ok("the cohort is deterministic",JSON.stringify(cohort(cs).perQ)===JSON.stringify(cohort(cs).perQ));

  /* ---- completeness: every document beat has somewhere to live ---- */
  var blob=JSON.stringify(cs);
  ["clear cell renal cell carcinoma","retinal angiomas","hemangioblastomas","pancreatic neuroendocrine",
   "GLUT-1","within minutes","emergency alarm","William G. Kaelin Jr.","Sir Peter J. Ratcliffe","Gregg L. Semenza",
   "next victim","never comfortably coexist","met a stranger","invents certainty","biological rule has been broken",
   "quietly whispers","picked up his violin","questioning the instrument","merely the consequence",
   "Congenital cyanotic heart disease","Obstructive sleep apnea","The physicians remained puzzled",
   "That should settle it","A renal cell carcinoma?","radiologist"].forEach(function(s){
    ok("doc beat present: "+s,blob.indexOf(s)>=0||blob.toLowerCase().indexOf(s.toLowerCase())>=0);});
  ok("the fabricated vitals strip is gone",blob.indexOf("SpO2 99% RA")<0);
  ok("the reveal does not leak into beat 1",JSON.stringify(cs.beats[0]).indexOf("99%")<0);
  ok("q2 asks what forced Holmes, not what forced you",qById(cs,"q2").qtext.indexOf("Holmes")>0);
  ok("the coda names four specialists",cs.coda.specialists.length===4);
  ok("the spine rewinds: stage 4 and stage 5 each occur twice",
     cs.beats.filter(function(b){return b.n==="4";}).length===2&&
     cs.beats.filter(function(b){return b.n==="5";}).length===2);
  ok("both disruptions are labelled as the client labels them",
     cs.beats.filter(function(b){return b.disruption;}).length===2);
  ok("all five differentials are gradeable rows",cs.ledger.rows.length===5);
  ok("sleep apnoea is the trap: unlikely, with no killing evidence",
     cs.ledger.rows[4].correct==="unlikely"&&cs.ledger.rows[4].killedBy.length===0);
  ok("every question carries a model answer",cs.questions.every(function(q){return q.model.lines.length>0;}));

  return {pass:pass,total:A.length,fails:A.filter(function(a){return !a.ok;}).map(function(a){return a.name;}),all:A};
}

   Nothing ahead of the student is in the DOM. That is what makes the
   commitment real and the contradiction land.

function beatLabel(b){
  if(b.kind==="rewind")return "Rewind";
  if(b.kind==="questions")return "Questions";
  if(b.disruption)return "Disruption";
  return "Stage "+b.n+(b.revised?" ′":"");
}
function beatReady(cs,i){
  var b=cs.beats[i];
  if(b.capture==="hyp1")return words(S.hyp1)>=5;
  if(b.capture==="hyp2")return words(S.hyp2)>=5;
  if(b.interlock==="d1")return !!S.interlock.d1.verdict&&S.interlock.d1.evidence.length>=1&&words(S.interlock.d1.why)>=2;
  if(b.interlock==="d2")return !!S.interlock.d2.choice&&words(S.interlock.d2.why)>=2;
  if(b.ledger)return S.ledgerCommitted;
  if(b.askFamily)return S.askedFamily;
  return true;
}
function spineHTML(cs){
  var looped=S.beat>=6;
  var h='<div class="spine'+(looped?" looped":"")+'">';
  /* the loop bracket spans stage 4 and stage 5 back up from the rewind — pure index
     arithmetic against a fixed row height, so nothing is measured at runtime */
  h+='<span class="spine-loop" style="top:calc(var(--rowh)*3);height:calc(var(--rowh)*4)"></span>';
  cs.beats.forEach(function(b,i){
    var cls=i<S.beat?"done":(i===S.beat?"on":"");
    if(b.disruption)cls+=" disrupt";
    if(b.revised)cls+=" revised";
    if(looped&&(i===3||i===4))cls+=" superseded";
    var mk=b.disruption?"!":(b.kind==="rewind"?"↺":(b.kind==="questions"?"?":b.n));
    h+='<div class="railstep '+cls+'"><span class="mk">'+esc(mk)+'</span>'
      +'<span class="lb">'+esc(beatLabel(b))+'</span></div>';});
  return h+'</div>';
}

    if(id==="d1"){
      h+='<div class="small" style="color:rgba(244,239,228,.75);margin-top:6px">Which findings did it? Name them — saying a hypothesis is dead without naming the evidence is an outcome, not a method.</div>';
      h+='<div class="chipset">'+d.chips.map(function(c){
        return '<button class="echip'+(st.evidence.indexOf(c.id)>=0?" sel":"")+'" data-d1chip="'+esc(c.id)+'">'
          +esc(c.label)+'</button>';}).join("")+'</div>';
    }
    h+='<div style="margin-top:12px"><div class="small" style="color:rgba(244,239,228,.75);margin-bottom:5px">'
      +esc(d.whyPrompt)+'</div>'

    h+='<div class="row"><button class="btn primary" data-adv="1"'+(beatReady(cs,S.beat)?"":" disabled")+'>Commit and see what happened →</button></div>';
  }else{
    var mine=id==="d1"?st.verdict:st.choice;
    var opt=d.options.filter(function(o){return o.id===mine;})[0];
    if(opt)h+='<div class="yourwords"><span class="lbl">Your call</span>'+esc(opt.t)+' — '+esc(st.why)+'</div>';
    if(id==="d1"&&st.evidence.indexOf(d.decoy)>=0)
      h+='<div class="small" style="color:rgba(244,239,228,.8);margin:8px 0">'+esc(d.decoyNote)+'</div>';
    if(id==="d2"&&d.defensible.indexOf(mine)>=0)
      h+='<div class="small" style="color:rgba(244,239,228,.8);margin:8px 0">'+esc(d.defensibleNote)+'</div>';
    h+=dlgHTML(d.resolve.dialogue);
    h+=quoteHTML(d.resolve.quote,"From the case");
    h+='<div class="row"><button class="btn primary" data-adv="1">Continue →</button></div>';
  }
  return h+'</div>';
}
/* ---- differential elimination ledger ---- */
function ledgerHTML(cs){
  var L=cs.ledger,committed=S.ledgerCommitted;
  var h='<div class="delimwrap">';
  L.rows.forEach(function(r,i){
    var st=S.ledger[r.id]||{state:null,evidence:[]};
    var cls="delim";
    if(st.state==="dead")cls+=" struck";
    if(st.state==="unlikely")cls+=" unlikely";
    h+='<div class="'+cls+'" style="--i:'+i+'" data-lrow="'+esc(r.id)+'">';
    h+='<div><span class="dx">'+esc(r.dx)+'</span>';
    if(!committed&&st.state==="dead"){
      h+='<div class="evpick">'+L.evidence.map(function(e){
        return '<button class="evb'+(st.evidence.indexOf(e.id)>=0?" on":"")+'" data-lev="'+esc(r.id)+'|'+esc(e.id)+'">'
          +esc(e.label)+'</button>';}).join("")+'</div>';
      if(!st.evidence.length)h+='<div class="warnline">Mark it dead only with the evidence that killed it.</div>';}
    if(committed){
      if(st.evidence&&st.evidence.length)h+='<div class="small" style="margin-top:5px">Killed by: '
        +esc(st.evidence.map(function(e){var f=L.evidence.filter(function(x){return x.id===e;})[0];return f?f.label:e;}).join(", "))+'</div>';
      if(r.id===L.trap&&st.state==="dead")h+='<div class="warnline">'+esc(L.trapNote)+'</div>';
      h+='<div class="verdictline voice-case">Holmes: “'+esc(r.holmes)+'”</div>';}
    h+='</div>';
    if(!committed)h+='<div class="states">'
      +['alive','unlikely','dead'].map(function(s){
        return '<button class="sbtn'+(st.state===s?" on":"")+'" data-st="'+s+'" data-lset="'+esc(r.id)+'|'+s+'">'+s+'</button>';}).join("")
      +'</div>';
    h+='</div>';});
  h+='</div>';
  if(committed)h+=quoteHTML(L.close,"From the case answer key");
  return h;
}
function ledgerReady(cs){
  var rows=cs.ledger.rows,ok=true;
  rows.forEach(function(r){var st=S.ledger[r.id];
    if(!st||!st.state)ok=false;
    else if(st.state==="dead"&&(!st.evidence||!st.evidence.length))ok=false;});
  return ok;
}
/* ---- pedigree ---- */
function pedigreeHTML(cs){

    return '<div class="ped-node'+(p.affected?" affected":"")+(p.proband?" proband":"")+'">'

      +(p.proband?'<span class="tag">Proband</span>':"")+'</div>';}).join("")+'</div>'
    +'<div class="ped-note">'+esc(f.note)+'</div>';
}
/* ---- HIF / VHL mechanism, two states ---- */
function mechHTML(cs,hits){
  var m=cs.mechanism;
  function boxes(list,extra){
    return list.map(function(n,i){
      var got=hits?!!hits[n.id]:true;
      return (i?'<span class="mech-arrow"></span>':"")
        +'<div class="mech-box'+(got?"":" dashed")+' '+extra+'" data-node="'+esc(n.node||n.id)+'">'
        +'<b>'+esc(n.t)+'</b>'+esc(n.d)+'</div>';}).join("");
  }
  var h='<div class="mechwrap"><div class="mechtabs" role="tablist">'
    +'<button role="tab" aria-selected="true" data-mech="intact">VHL intact</button>'
    +'<button role="tab" aria-selected="false" data-mech="mutant">VHL defective</button></div>';
  h+='<div class="mech" id="mechPanel">'+boxes(m.intact,"mech-intact")
    +'<span class="mech-arrow mech-out"></span>'+boxes(m.mutant,"mech-out")+'</div>';
  h+='<div class="belzbadge">'+esc(m.belzutifan)+'</div>';
  h+=quoteHTML(m.analogy,"From the case answer key");
  if(hits)h+='<div class="mechlegend">'+esc(m.legend)+'</div>';
  return h+'</div>';
}
/* ---- the eight questions ---- */
function questionsHTML(cs){
