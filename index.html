// build a coherent authored case: cloned STRUCTURE from a base, but retargeted to the drafted diagnosis
// and with every stage reveal derived from the drafted text (never another disease's labs).
function buildAuthoredCase(raw,order,dx){
  var tgt=dx[0].id;
  var base=CASES.filter(function(c){return c.target===tgt;})[0]
        || CASES.filter(function(c){return c.concepts.some(function(x){return x.id===tgt;});})[0]
        || CASES[0];
  var nc=JSON.parse(JSON.stringify(base));
  delete nc._map;delete nc.conceptById;nc.concepts.forEach(function(con){delete con._syn;});
  var firstLine=(raw.split("\n")[0]||"Authored case").slice(0,60);
  nc.id="AUTH-"+(hashStr(raw)%9000+1000);
  nc.title=firstLine;nc.oneLiner=firstLine;nc._authored=true;nc.target=tgt;
  // retarget rubric + revision + bedside to the drafted diagnosis
  nc.rubric.forEach(function(it){
    if(it.dim==="diagnostic")it.concepts=[tgt];
    if(it.id==="danger-order")it.target=tgt;
    if(it.id==="killers"&&it.concepts)it.concepts=it.concepts.filter(function(c){return c!==tgt;});
    // management/differential concepts cannot be derived from free text — don't assert the base
    // disease's treatments as safety-critical against an authored case's (unknown) correct plan.
    delete it.critical;delete it.safety;delete it.cantMiss;delete it.probe;
  });
  if(nc.revision)nc.revision.target=tgt;
  nc.bedside.slots.forEach(function(sl){if(sl.id==="what")sl.concepts=[tgt];});
  // reveals derived from the drafted note
  var split=splitWard(raw);
  nc.stages[0].reveal.history=split.history||raw;
  if(split.exam)nc.stages[1].reveal.exam=split.exam;
  nc.stages[2].reveal={narrative:split.investigations?("Investigations as authored:\n"+split.investigations):"Investigations were not itemised in the source note.",tables:[],findings:[]};
  return nc;
}
function draftFromText(raw){
  var found={},order=[];
  CASES.forEach(function(c){var an=analyseStage(c,raw);c.concepts.forEach(function(con){if(found[con.id])return;if((an.byConcept[con.id]||[]).length){found[con.id]={id:con.id,label:con.label,cat:con.cat};order.push(found[con.id]);}});});
  var dx=order.filter(function(c){return c.cat==="dx";});
  var split=splitWard(raw);
  var lint=[];
  lint.push(order.length+" concept"+(order.length===1?"":"s")+" detected across the deterministic lexicon.");
  lint.push(dx.length?("Target diagnosis: "+dx[0].label+" — grading will require committing to this.")
                     :"No diagnosis concept detected — add one before publishing.");
  lint.push(split.exam?"Examination section detected on ‘O/E’ — split into the workup stage.":"No ‘O/E’ header — the whole note stays in the history stage.");
  lint.push(split.investigations?"Investigations section detected — split into the results stage.":"No ‘Investigations’ header found — results stage left for you to fill.");
  if(dx.length){var l=lintCase(finalizeCase(buildAuthoredCase(raw,order,dx)));
    l.errors.forEach(function(e){lint.push("ERROR: "+e);});
    l.warnings.slice(0,3).forEach(function(w){lint.push("Warning: "+w);});
    lint.push(l.weightSum===100?"Rubric weights sum to 100.":("Rubric weights sum to "+l.weightSum+", not 100 — fix before publishing."));
  }
  return {raw:raw,concepts:order,dx:dx,lint:lint};
}
function publishDraft(){
  var d=S.authoredDraft;if(!d||!d.dx.length)return;
  var nc=finalizeCase(buildAuthoredCase(d.raw,d.concepts,d.dx));
  var auth=lsGet(K_AUTH)||[];
  var stored=JSON.parse(JSON.stringify(nc));delete stored._map;delete stored.conceptById;stored.concepts.forEach(function(con){delete con._syn;});
  auth.push(stored);lsSet(K_AUTH,auth);
  S.authoredDraft=null;nav("#/cases");
}

/* ============ GUIDED DEMO ============ */
var DEMO_STEPS=[
  {cap:"The landing card writes itself — the product in one sentence. Watch ‘Clot in the lung’ resolve to Pulmonary embolism.",run:function(){nav("#/");}},
  {cap:"Open the PE case with a strong note pre-loaded across all five stages. The tracks ledger lights as the machine reads meaning.",run:function(){var cs=caseById("PE-014");S.caseId="PE-014";S._encCaseId="PE-014";S._submittedCase=null;S.stageIndex=0;S.stageTexts={};STK.forEach(function(k){S.stageTexts[k]=cs.demo.strong[k];});S.gradingActive=false;nav("#/case/PE-014");}},
  {cap:"The report. The Tracks Timeline turns ‘we grade thinking order’ into a picture — and ‘excluded a dissection’ is credited in the student’s own sentence.",run:function(){demoReport("PE-014","strong");}},
  {cap:"Now a keyword-stuffed answer. The verdict lands ‘assertions without reasoning — capped’ — concepts without a reason earn half credit.",run:function(){demoReport("PE-014","gamed");}},
  {cap:"One question. The student left the danger-signs line out at the bedside; asked directly, they recover it — that row turns amber ‘recovered on questioning’ and credit is restored.",run:function(){demoReport("PE-014","strong-recover",{asked:"recovered",recovered:true});}},
  {cap:"The college view. See how much of the batch missed each danger before the reveal; the quadrant scatter is the money slide; Export prints to PDF.",run:function(){S.role="faculty";S.facultyTab="cohort";S.facultyCase="PE-014";nav("#/faculty?tab=cohort");}},
  {cap:"Case Forge. Paste a ward case, draft it with the same tokenizer, publish — it appears in the student library, fully playable.",run:function(){S.role="faculty";S.facultyTab="author";S.authoredDraft=null;nav("#/faculty?tab=author");}},
  {cap:"Any student can name the disease to an examiner. The ones who understand it can explain it to the man in the bed.  ·  Read the case, follow the tracks.",run:function(){nav("#/");}}
];
function demoReport(id,which,followUp){var cs=caseById(id);var texts={};STK.forEach(function(k){texts[k]=cs.demo[which][k];});
  if(which==="strong-recover"){STK.forEach(function(k){texts[k]=cs.demo.strong[k];});texts.bedside=cs.demo.strong.bedside.replace(/If you.*$/,"").trim();}
  var g=gradeAttempt(cs,texts);var rec={caseId:id,startedAt:Date.now(),stages:{},grade:{pct:g.pct,verdict:g.verdict.t},followUp:followUp||null,demo:true};STK.forEach(function(k){rec.stages[k]={text:texts[k],committedAt:Date.now()};});var arr=loadAttempts();arr.push(rec);lsSet(K_ATT,arr);nav("#/report/"+encodeURIComponent(id)+"/"+(arr.length-1));}
function demoView(){if(S.demoStep<0)S.demoStep=0;DEMO_STEPS[S.demoStep].run();return "";}
function maybeDemo(){
  document.querySelectorAll(".demobar").forEach(function(b){b.remove();});
  if(S.demoStep<0||S.demoStep==null)return;
  var st=DEMO_STEPS[S.demoStep];
  var bar='<div class="demobar"><span class="st">Step '+(S.demoStep+1)+'/'+DEMO_STEPS.length+'</span><span class="cap">'+esc(st.cap)+'</span>'
    +'<button id="demoPrev" '+(S.demoStep===0?"disabled":"")+'>‹ Prev</button>'
    +'<button id="demoNext" '+(S.demoStep===DEMO_STEPS.length-1?"disabled":"")+'>Next ›</button>'
    +'<button class="x" id="demoExit">Exit demo</button></div>';
  document.body.insertAdjacentHTML("beforeend",bar);
  document.getElementById("demoPrev").onclick=function(){if(S.demoStep>0){S.demoStep--;DEMO_STEPS[S.demoStep].run();}};
  document.getElementById("demoNext").onclick=function(){if(S.demoStep<DEMO_STEPS.length-1){S.demoStep++;DEMO_STEPS[S.demoStep].run();}};
  document.getElementById("demoExit").onclick=function(){S.demoStep=-1;var b=document.querySelector(".demobar");if(b)b.remove();nav("#/");};
}

/* ============ ROUTER ============ */
function ensureRole(r){if(!S.role)S.role=r;}
function draw(){
  var hash=location.hash||"#/";var h,m;
  if(hash==="#/"||hash==="#"||hash===""){h=landingView();app.innerHTML=h;wire();runSpecimen();if(S.demoStep>=0)maybeDemo();return;}
  if(hash.indexOf("#/demo")===0){demoView();return;}
  if(hash.indexOf("#/cases")===0){ensureRole("student");h=libraryView();}
  else if((m=hash.match(/^#\/case\/(.+)$/))){var cid=decodeURIComponent(m[1]);ensureRole("student");
    // arriving at an encounter we didn't start (e.g. browser Back, or a different case): reset stage state
    // rather than showing another case's stage index / a submitted-and-locked stage as editable.
    if(!S.gradingActive && S._encCaseId!==cid){S.caseId=cid;S._encCaseId=cid;S.stageIndex=0;S.stageTexts={};S.grade=null;}
    else S.caseId=cid;
    // if this attempt was just graded, send Back to the report instead of the re-editable stage
    if(!S.gradingActive && S._submittedCase===cid){var gi=lastAttemptIndex(cid);if(gi>=0){location.replace("#/report/"+encodeURIComponent(cid)+"/"+gi);return;}}
    h=S.gradingActive?gradingView():encounterView();}
  else if((m=hash.match(/^#\/report\/([^/]+)\/(\d+)$/))){ensureRole("student");h=reportView(decodeURIComponent(m[1]),parseInt(m[2],10));}
  else if(hash.indexOf("#/faculty")===0){ensureRole("faculty");parseFacultyTab(hash);h=facultyView();}
  else {h=landingView();}
  app.innerHTML=h;wire();
  if(hash.indexOf("#/case/")===0&&!S.gradingActive&&S.stageIndex<=1)updateLedger();
  if(S.demoStep>=0)maybeDemo();
}
function route(){draw();window.scrollTo(0,0);}

/* ============ WIRING ============ */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(function(el){el.onclick=function(e){e.preventDefault();var d=el.getAttribute("data-nav");if(d==="#/"){S.demoStep=-1;var b=document.querySelector(".demobar");if(b)b.remove();}nav(d);};});
  document.querySelectorAll("[data-door]").forEach(function(el){el.onclick=function(){S.role=el.getAttribute("data-door");nav(S.role==="faculty"?"#/faculty?tab=cohort":"#/cases");};});
  document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){startCase(el.getAttribute("data-open"));};});
  document.querySelectorAll("[data-viewreport]").forEach(function(el){el.onclick=function(e){e.stopPropagation();var id=el.getAttribute("data-viewreport");var gi=el.getAttribute("data-gidx");nav("#/report/"+encodeURIComponent(id)+"/"+gi);};});
  document.querySelectorAll("[data-fcase]").forEach(function(el){el.onclick=function(){S.facultyCase=el.getAttribute("data-fcase");S.reviewSel=null;draw();};});
  document.querySelectorAll("[data-ftab]").forEach(function(el){el.onclick=function(){S.facultyTab=el.getAttribute("data-ftab");S.reviewSel=null;nav("#/faculty?tab="+S.facultyTab);};});
  document.querySelectorAll("[data-review]").forEach(function(el){el.onclick=function(){S.reviewSel=parseInt(el.getAttribute("data-review"),10);draw();};});
  document.querySelectorAll("[data-demo]").forEach(function(el){el.onclick=function(){var cs=caseById(S.caseId);var which=el.getAttribute("data-demo");S.stageTexts[STK[S.stageIndex]]=cs.demo[which][STK[S.stageIndex]];draw();};});
  document.querySelectorAll("[data-revise]").forEach(function(el){el.onclick=function(){var id=el.getAttribute("data-revise");var texts={};STK.forEach(function(k){texts[k]=S._reportRec?S._reportRec.rec.stages[k].text:"";});startCase(id,texts);};});
  document.querySelectorAll("[data-finding]").forEach(function(el){el.onclick=function(){var cs=caseById(S.caseId);var f=cs.stages[2].reveal.findings[parseInt(el.getAttribute("data-finding"),10)];openModal('<h2>'+esc(f.label)+'</h2><p class="serif">'+esc(f.text)+'</p><div class="row"><button class="btn primary" id="modalClose">Close</button></div>');};});
  // textarea
  var ta=document.getElementById("ans");
  if(ta)ta.oninput=function(e){S.stageTexts[STK[S.stageIndex]]=e.target.value;var wc=(e.target.value.trim().match(/\S+/g)||[]).length;var w=document.getElementById("wc");if(w)w.textContent=wc+" words";var cs2=caseById(S.caseId);var okAdv=canAdvance(cs2,STK[S.stageIndex],e.target.value);var c=document.getElementById("commit");if(c)c.disabled=!okAdv;var fh=document.getElementById("floorHint");if(fh)fh.style.display=okAdv?"none":"";if(S.stageIndex<=1)updateLedger();if(S.stageIndex===4)updateJargonMeter();};
  var commit=document.getElementById("commit");
  if(commit)commit.onclick=function(){var cs2=caseById(S.caseId);if(!canAdvance(cs2,STK[S.stageIndex],S.stageTexts[STK[S.stageIndex]]||""))return;if(S.stageIndex<4){S.stageIndex++;draw();window.scrollTo(0,0);}else{runGrade();}};
  // followup
  var fs=document.getElementById("followSubmit");
  if(fs)fs.onclick=function(){var cs=S._reportRec.cs;var g=S.grade;var txt=document.getElementById("followReply").value;var okr=gradeReply(cs,g.followup.concepts,txt);var rec=S._reportRec.rec;rec.followUp={asked:g.followup.q,replyText:txt,recovered:okr};var arr=loadAttempts();arr[S._reportRec.gidx]=rec;lsSet(K_ATT,arr);draw();window.scrollTo(0,document.body.scrollHeight/2);};
  // override
  var ovs=document.getElementById("ovSlider");if(ovs)ovs.oninput=function(){document.getElementById("ovVal").textContent=ovs.value;};
  var ovsave=document.getElementById("ovSave");if(ovsave)ovsave.onclick=function(){
    var note=(document.getElementById("ovNote").value||"").trim();
    var warn=document.getElementById("ovWarn");
    if(!note){if(warn)warn.textContent="A one-line reason is required.";return;}
    var score=parseInt(document.getElementById("ovSlider").value,10);
    var cs2=caseById(S.facultyCase);var q=reviewQueue(cs2);var row=q[S.reviewSel];
    if(row&&row.live&&row.attemptIndex>=0){var arr=loadAttempts();if(arr[row.attemptIndex]){arr[row.attemptIndex].override={score:score,note:note,at:Date.now()};lsSet(K_ATT,arr);}}
    openModal('<h2>Override recorded</h2><p class="serif">Grade adjusted to '+esc(String(score))+'. Your note — “'+esc(note)+'” — is attached to the attempt record'+(row&&row.live?' and now shows on the student report':'')+'.</p><div class="row"><button class="btn primary" id="modalClose">Close</button></div>');
    if(row&&row.live){draw();}
  };
  // export
  var ex=document.getElementById("exportBtn");if(ex)ex.onclick=function(){window.print();};
  // forge
  var fsam=document.getElementById("forgeSample");if(fsam)fsam.onclick=function(){document.getElementById("forgeText").value=window.__forgeSample;};
  var fdr=document.getElementById("forgeDraft");if(fdr)fdr.onclick=function(){var t=document.getElementById("forgeText").value;if(t.trim().length<20)return;S.authoredDraft=draftFromText(t);draw();};
  var fpub=document.getElementById("forgePublish");if(fpub)fpub.onclick=publishDraft;
  // ---- narrative case (VHL-003) wiring ----
  document.querySelectorAll("[data-ndemo]").forEach(function(el){el.onclick=function(){var cs=caseById(S.caseId);if(!cs)return;var w=el.getAttribute("data-ndemo");
    S.qAnswers=S.qAnswers||{};
    ["patient","workup","results"].forEach(function(k){S.stageTexts[k]=cs.demo[w][k];});
    cs.questions.forEach(function(it){S.qAnswers[it.id]=cs.demo[w][it.id];});draw();};});
  document.querySelectorAll("[data-nans]").forEach(function(el){el.oninput=function(){S.stageTexts[el.getAttribute("data-nans")]=el.value;};});
  document.querySelectorAll("[data-nq]").forEach(function(el){el.oninput=function(){S.qAnswers=S.qAnswers||{};S.qAnswers[el.getAttribute("data-nq")]=el.value;};});
  var ns=document.getElementById("nsubmit");if(ns)ns.onclick=runGradeNarrative;
}
function openModal(inner){var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="modalcard">'+inner+'</div>';document.body.appendChild(m);m.onclick=function(e){if(e.target===m||e.target.id==="modalClose")m.remove();};}

/* ============ BOOT ============ */
window.__grade=function(id,stageTexts){return gradeAttempt(caseById(id),stageTexts||{});};
window.__gradeQuestions=function(id,ans){return gradeQuestions(caseById(id),ans||{});};
window.__cases=CASES;
window.__selftest=__selftest;
window.__cohort=cohort;
(function boot(){
  var st=document.createElement("style");st.textContent=EXTRA_CSS;document.head.appendChild(st);
  try{SELFTEST=__selftest();}catch(e){SELFTEST={pass:0,total:1,fails:["exception: "+e.message]};console.error(e);}
  console.log("[Follow the Tracks] self-test "+SELFTEST.pass+"/"+SELFTEST.total+(SELFTEST.fails.length?" FAILS: "+SELFTEST.fails.join(", "):" — all green"));
  window.addEventListener("hashchange",route);
  draw();
})();

</script>
