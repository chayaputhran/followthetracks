<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Follow the Tracks — Clinical Reasoning, Examined</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='13' cy='13' r='9' stroke='%230f5b56' stroke-width='2.2'/%3E%3Cpath d='M20 20 L28 28' stroke='%230f5b56' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M8 13 h2.4 l1.6 -4 l2.4 8 l1.8 -5 l1.2 3 h3' stroke='%238a2d1f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
<style>
:root{
  color-scheme:only light;
  /* ---- ground: three tones, zero shadows. Separation is a hairline, never elevation. ---- */
  --paper:#ffffff; --paper-2:#f4f5f7; --card:#ffffff;
  /* ---- three rule weights, one job each ---- */
  --line:#e6e8ea; --line-2:#d7dbdf; --line-3:#b9c0c7;
  /* ---- ink. --ink-faint moved off #8a8371, which is 3.9:1 on white and fails AA ---- */
  --ink:#101418; --ink-soft:#454b54; --ink-faint:#656c75;
  /* ---- colour demoted to pure signal ---- */
  --accent:#0b4f4a; --accent-soft:#e8f0ef;
  --danger:#8a2d1f; --danger-soft:#fbeae6;
  --amber:#8a5a08;  --amber-soft:#fbf1dd;
  --green:#2f6a3c;  --green-soft:#e9f2e7;
  /* ---- the inverted disruption band, tuned off pure black: 18px serif in #fff on #000
         halates badly across the ~40 dialogue lines that live inside these two bands ---- */
  --band:#12171d; --band-ink:#eef1f4; --band-soft:#9aa3ae; --band-faint:#838d99;
  --band-line:#39414c; --band-field:#1a2028; --band-edge:#5a636e;
  --band-accent:#7fd6c9; --band-amber:#e8b661; --band-danger:#f0907c; --band-green:#86c98d;
  /* ---- geometry: one radius, no pills, no lifts ---- */
  --r:3px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --pad:20px; --rowh:44px;
  /* ONE container width for the entire app. The app bar, the demo bar and the
     page body all align to this single value, so the brand can never sit 375px
     to the left of the content it labels — which is what a full-bleed bar over
     a capped, centred body produced on a wide screen.
     Widening this is safe: every block of prose is capped separately in ch
     units (62–74ch), so the extra width is spent on structure — the rail and
     the case file — and never on line length. */
  /* No pixel cap. A hard max in px is not responsive — it just decides in
     advance that anything past N is waste, which is how a 3840 screen ended up
     with 930px of white down each side. The page fills the window at every
     width; what keeps it readable is that each PIECE is capped, not the page:
     prose in ch, the dialogue track at --measure, and the case file reflows
     into more columns instead of stretching. */
  --shell:96vw;
  /* ONE source of truth for the dialogue measure (including the 92px speaker
     gutter). Both .scene's cap and the scene grid track read it, so a
     breakpoint can never move one without the other — which is how 290px of
     dead air opened up down the middle of the desk on a wide monitor. */
  --measure:38rem;
  --beatpad:24px;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"SF Mono","Cascadia Mono",Consolas,"IBM Plex Mono",monospace;
}
/* the same three values .scene used to carry inline — relocated, not retuned */
@media(min-width:760px){:root{--measure:calc(38rem + 92px)}}
@media(min-width:1500px){:root{--measure:calc(44rem + 92px)}}
*{box-sizing:border-box}
html,body{margin:0}
/* overflow-x lives on html, and is CLIP not HIDDEN: `hidden` on body forces
   overflow-y:auto, which makes body a second scroll container on top of html's.
   `clip` guards against stray horizontal overflow without creating a scroller. */
html{background:var(--paper);overflow-x:clip}
body{color:var(--ink);font-family:var(--font-body);line-height:1.55;font-size:15px;
  background:var(--paper);background-image:none}
/* When the page does scroll, the scrollbar must not read as a grey slab down the
   edge of a white page — that is what makes the white look broken. */
/* Windows Chrome always paints the bar, so the thumb is kept close to the page
   tone and only darkens under the pointer — visible when you reach for it,
   almost absent when you are reading. */
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html:hover{scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}
/* one radius everywhere; the two exceptions stay circular because they are MARKS, not containers */
.card,.beat,.casecard,.hcard,.qcard,.specimen,.stat,.mech-box,.peerbox,.link,.cbox,.ped-node,
.modelans,.extendbox,.probe,.provnote,.verdictband,.btn,textarea,input.line,.vbadge,.spchip,
.echip,.evb,.sbtn,.adjset button,.delta,.vopt,.hboard-m,.belzbadge{border-radius:var(--r)}
.avatar,.railstep .mk,.vbadge .d,.ic{border-radius:50%}
/* white cards on a white page: a hairline edge, never a shadow */
.card,.beat,.casecard,.hcard,.qcard,.specimen{background:var(--card);border:1px solid var(--line-2);box-shadow:none}
textarea,input.line,.stat,.mech-box,.peerbox,.link,.cbox,.ped-node,.modelans{background:var(--paper-2)}
/* in forced-colors a band defined only by its fill disappears; a border survives */
@media(forced-colors:active){
  .disruptband{border:2px solid CanvasText;background:Canvas;color:CanvasText;forced-color-adjust:none}
  .card,.beat,.casecard{border:1px solid CanvasText}
}
button{font-family:var(--font-body);cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700}
/* ---- the branding seam: serif is reserved for faculty-authored case content ---- */
.voice-case{font-family:var(--font-display)}
cite.src{display:block;font-family:var(--font-mono);font-style:normal;font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-faint);margin-top:8px}
blockquote.qt{margin:12px 0;padding:10px 0 10px 16px;border-left:2px solid var(--accent);font-family:var(--font-display);
  font-size:16px;line-height:1.6;color:var(--ink)}
blockquote.qt p{margin:2px 0}
/* app bar */
/* The bar's BACKGROUND is full-bleed (a sticky bar that stopped short of the
   window edges would look broken), but its CONTENTS sit in a shell-width row so
   the brand lines up with the page content underneath it. Previously the flex
   row was the bar itself, which is why the brand hugged x=20 while the content
   started at x=395 on a wide screen. */
.appbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line-2)}
.barinner{display:flex;align-items:center;gap:16px;height:58px;
  width:var(--shell);margin:0 auto;padding:0 var(--pad)}
/* flex items default to min-width:auto, which pinned .barinner at a ~278px
   min-content width and made the bar the narrowest thing on the page */
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);min-width:0}
.logo{width:32px;height:32px;flex:0 0 auto}
/* the wordmark must be allowed to ellipsis, or it sets a floor the bar cannot go under */
.wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.wordmark small{display:block;font-family:var(--font-mono);font-weight:600;font-size:8px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-top:-1px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:5px;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--paper-2)}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:9px;font-size:12.5px}
.avatar{width:30px;height:30px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono)}
.rolebadge{font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:2px 7px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-faint)}
.linkbtn{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:0}
/* below 700px the fixed bottom tab bar carries navigation, so the inline nav
   is redundant — and it is what pushes the user chip off a 360px screen */
@media(max-width:700px){.appbar .nav{display:none}}
/* the bar and the body must tighten together, or the brand sits 8px off the
   content edge on a phone — the same misalignment, just smaller */
@media(max-width:560px){:root{--pad:12px}.barinner{gap:10px}.brandmark{gap:8px}.userchip{gap:7px}.userchip .small{display:none}}
@media(max-width:400px){.userchip .rolebadge{display:none}.wordmark small{display:none}}
/* layout */
/* the deep bottom padding exists ONLY to clear the fixed mobile tab bar. Above the
   breakpoint where that bar exists it is dead space — and 110px of dead space is
   enough on its own to put a scrollbar on a page that otherwise fits the screen. */
/* FLUID, not a fixed cap. A hard max-width in pixels means the larger the
   monitor the more dead margin you get — at 1920 the old 1280 cap used 67% of
   the screen and left 640px empty. Percentage-first with a generous ceiling. */
.wrap{width:var(--shell);margin:0 auto;padding:20px var(--pad) 22px}
/* The encounter used to be wider than every other page. That made the app bar
   jump horizontally as you moved between routes, because the bar aligned to one
   width and the body to another. One shell width for every route instead. */
.wrap.wide{width:var(--shell)}
@media(max-width:700px){.wrap{padding-bottom:110px}}
.crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.crumbs a{color:var(--ink-faint);text-decoration:none;cursor:pointer}
.eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700;position:relative;padding-bottom:8px;margin-bottom:12px;display:inline-block}
.eyebrow:after{content:"";position:absolute;left:0;bottom:0;width:24px;height:2px;background:var(--accent)}
.pagetitle{font-size:clamp(24px,4vw,32px);margin:0 0 6px;line-height:1.1}
.pagesub{color:var(--ink-soft);font-size:15px;margin:0 0 22px;max-width:70ch}
.card{padding:22px 24px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink-faint);margin:22px 0 10px;font-weight:700}
.small{font-size:12.5px;color:var(--ink-faint)}
.kicker{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);font-weight:700}
/* 44px is the touch-target floor; buttons were landing at 38-39px */
.btn{font-size:13.5px;font-weight:600;border-radius:6px;padding:10px 18px;border:1px solid var(--ink-soft);
  background:transparent;color:var(--ink);min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#083b37}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line-2);color:var(--ink-soft)}
.btn.sm{padding:6px 12px;font-size:12px;min-height:34px}
@media(max-width:520px){.btn.sm{min-height:40px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
textarea{width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);
  font-family:var(--font-body);font-size:14.5px;line-height:1.55;color:var(--ink);resize:vertical}
/* on white a 0-offset ring reads as part of the control */
textarea:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.disruptband *:focus-visible{outline-color:var(--band-accent)}
input.line{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);font-family:var(--font-body);font-size:14px;color:var(--ink)}
.prompt{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:8px}
.footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--ink-faint);line-height:1.5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.footer .fnote{max-width:74ch}
/* shrinkable pill, unsquashable dot — once the bar can shrink, this footer
   badge is the next thing that refuses to and pushes past the right edge */
.vbadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;
  padding:4px 10px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-faint);
  flex:0 1 auto;min-width:0;max-width:100%}
.vbadge>*{flex:0 0 auto}
.vbadge .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
.vbadge.bad{border-color:var(--danger);color:var(--danger)}.vbadge.bad .d{background:var(--danger)}
.disclaimer{font-size:11.5px;color:var(--ink-faint);line-height:1.6;font-style:italic}
/* landing */
.hero{padding:20px 0 8px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.02;margin:8px 0 14px;letter-spacing:-.5px}
.hero p.lede{font-size:clamp(16px,2.4vw,20px);color:var(--ink-soft);max-width:52ch;margin:0 0 16px;font-family:var(--font-display)}
.hero p.lede2{font-size:15px;color:var(--ink-soft);max-width:60ch;margin:0 0 8px;line-height:1.65}
/* hero as two columns: what it is, and the proof of it */
/* the left column's text is measure-capped, so giving it the larger share just
   opened a 300px gutter mid-hero — the proof card takes the surplus instead */
.herogrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
  gap:clamp(32px,3vw,60px);align-items:start;margin-bottom:36px}
@media(max-width:960px){.herogrid{grid-template-columns:1fr;gap:28px}}
.specimen{padding:22px 24px;position:sticky;top:78px}
@media(max-width:960px){.specimen{position:static}}
.speclab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;margin-bottom:8px}
.specnote{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.specimen .cap{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
.specimen .sent{font-family:var(--font-display);font-size:20px;line-height:1.55;min-height:2.6em}
.specimen .caret{border-right:2px solid var(--accent);animation:blink 1s step-end infinite}
@keyframes blink{50%{border-color:transparent}}
.spchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;opacity:0;transition:opacity .6s var(--ease)}
.spchips.show{opacity:1}
.spchip{font-size:12px;font-family:var(--font-mono);padding:5px 10px;border-radius:20px;border:1px solid var(--green);color:var(--green);background:var(--green-soft);font-weight:600}
/* the specimen highlight was rendering browser-default yellow — an unstyled <mark> */
mark{background:none;color:inherit;box-shadow:inset 0 -.55em 0 var(--accent-soft);
  border-bottom:1.5px solid var(--accent);padding:0 1px}
/* one obvious way in */
.startbox{margin:30px 0 34px;max-width:640px}
.btn.lg{font-size:16px;padding:15px 30px}
.startmeta{font-size:13.5px;color:var(--ink-soft);margin-top:14px;max-width:56ch;line-height:1.6}
.startalt{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.startalt .sep{color:var(--ink-faint)}
.linkish{background:none;border:0;padding:0;font-size:13px;color:var(--accent);
  text-decoration:underline;text-underline-offset:3px;font-family:var(--font-body)}
.linkish:hover{color:var(--ink)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;margin:30px 0}
/* hover is a border state, not a lift — the lift is what reads as consumer SaaS */
.door{text-align:left;border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:18px 20px;transition:border-color .15s var(--ease)}
.door:hover{border-color:var(--ink)}
.door .r{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.door .n{font-family:var(--font-display);font-size:18px;font-weight:700;margin:6px 0 3px}
.door .d{font-size:12.5px;color:var(--ink-faint)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0}
.step .no{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700}
.step .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin:4px 0 2px}
.step .x{font-size:12px;color:var(--ink-faint)}
.collegestrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.cbox{border:1px solid var(--line-2);border-radius:7px;padding:16px;background:var(--paper-2)}
.cbox .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:4px}
.cbox .x{font-size:12.5px;color:var(--ink-faint)}
@media(max-width:820px){.doors,.steps,.collegestrip{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.doors,.steps,.collegestrip{grid-template-columns:1fr}}
/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.casecard{padding:18px 20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s var(--ease);cursor:pointer}
.casecard:hover{border-color:var(--ink)}
.casecard .sys{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700}
.casecard h3{font-family:var(--font-display);font-size:18px;margin:0}
.casecard .ol{font-size:13px;color:var(--ink-soft);flex:1}
.casecard .meta{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-faint);align-items:center;flex-wrap:wrap}
.dchip{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border:1px solid var(--line-2);border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.comp{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.donef{color:var(--green);font-weight:700;font-family:var(--font-mono);font-size:11px}
</style>

<style>
/* ================= ENCOUNTER: the rewinding spine ================= */
/* The desk: where you are | the scene | what you have learned.
   The scene column stays measure-bound (~45–70 characters) because widening the
   dialogue to fill a monitor would use the space and make the case harder to read.
   The width is spent on structure instead. */
/* the side columns take a SHARE of the width rather than a fixed pixel size, so
   a bigger monitor gives you a bigger case file instead of bigger empty margins */
/* The scene track is capped at EXACTLY the prose cap plus the beat's own
   padding, so it can never absorb surplus width; the case file is the residual
   (1fr) and takes all of it. Before this, 1fr sat on the scene — the one column
   that has agreed not to grow — so at 3390px the tracks were 249/1086/480 with
   .scene only 796px wide, and 290px went blank down the middle of the desk.
   Cap with a maximum, never by raising a minimum: the minimums must stay
   198/0/330 or the narrow end of the three-column band overflows. */
.enc{display:grid;
  grid-template-columns:minmax(198px,min(13%,300px))
                        minmax(0,calc(var(--measure) + 2 * var(--beatpad)))
                        minmax(400px,1fr);
  gap:clamp(28px,3vw,52px);align-items:start}
/* grid children default to min-width:auto and will not shrink below their
   content — which lets the spine push the whole page sideways on a phone */
.enc>*{min-width:0}
.railwrap{position:sticky;top:78px;min-width:0}
.filewrap{position:sticky;top:78px;min-width:0}
/* A pinned column taller than the window is a column with an unreachable
   bottom. Populated, .filewrap measures ~1058px, so on any window under about
   1150px tall the EXCLUDED section — the one Q2 asks the student about — sits
   below the fold for the entire encounter, with no way to scroll to it.
   overflow-x is declared explicitly: overflow-y:auto alone would make
   overflow-x compute to auto, and the RIGHT EDGE self-test would then treat
   everything inside the case file as "reachable by scrolling" and stop
   catching real overflow there. No overscroll-behavior — `contain` would turn
   a full-height column into a wheel dead-zone over most of the page. */
.railwrap,.filewrap{max-height:calc(100vh - 92px);overflow-x:clip;overflow-y:auto}
/* The right column holds two panels — the working hypothesis and the case file.
   Stacked, a wide screen leaves each one mostly empty. auto-fit puts them side
   by side exactly when there is room for both and stacks them when there is
   not, with no breakpoint to keep in sync. */
.filewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:14px;align-content:start}
/* TWO-COLUMN FALLBACK. Shared by the width query and the measured .narrow
   guard, so there is one definition of "not enough room" and it cannot drift.
   The case file goes ABOVE the rail, not below it: the rail is ~660px tall, so
   putting the file after it pushes the single most-consulted panel off the
   bottom of the screen — which reads as "the case file has vanished". The file
   is reference, the rail is navigation; reference wins the top slot. */
@media(max-width:1272px){
  .enc{grid-template-columns:minmax(240px,300px) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:26px}
  .enc > .filewrap{grid-column:1;grid-row:1;position:static}
  .enc > .railwrap{grid-column:1;grid-row:2;position:static}
  .enc > .scenecol{grid-column:2;grid-row:1 / span 3}
  /* wherever the columns go static they must also be un-capped, or they keep a
     scrollbar and a height limit while sitting in normal flow */

#app textarea:hover,#app input.line:hover{border-color:var(--ink-faint)}

/* THE TWO DELIBERATE EXCEPTIONS — both are marks or the drama, not background:
   1. the inverted disruption bands, which are the whole point of the case's two
      turning moments and are scoped under .disruptband
   2. small solid marks that must read as filled: the avatar, the spine's
      done/current/disruption discs, and primary buttons */
#app .railstep.done .mk{background:var(--accent);border-color:var(--accent);color:#fff}
#app .railstep.disrupt .mk{background:var(--ink);border-color:var(--ink);color:#fff}
#app .avatar{background:var(--accent);color:#fff}
#app .btn.primary{background:var(--accent);color:#fff}
#app .adv.act{background:var(--accent);color:#fff}
#app .ic.ok{background:#fff;border:1px solid var(--green);color:var(--green)}

/* The blanket white above would otherwise bleach the controls that live INSIDE
   the inverted band. Restore them, scoped to the band only. */
#app .disruptband textarea,#app .disruptband input.line{background:var(--band-field);
  border-color:var(--band-edge);color:var(--band-ink)}
#app .disruptband .vopt,#app .disruptband .echip{background:transparent;color:var(--band-ink);
  border-color:var(--band-edge)}
#app .disruptband .vopt.sel,#app .disruptband .echip.sel{background:var(--band-ink);
  color:var(--band);border-color:var(--band-ink)}
#app .disruptband .adv.act{background:var(--band-ink);color:var(--band)}
#app .disruptband .btn.primary{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}

/* ================= motion + print discipline ================= */
/* zeroing DURATIONS alone left the ledger strike still waiting up to 900ms on its
   transition-delay. Delays must be zeroed too, and the 44vh hold is page movement
   a reduced-motion user has explicitly asked us not to do. */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-delay:0ms !important;
    transition-duration:.01ms !important;transition-delay:0ms !important}
  .cue.fresh .ln,.cue.fresh .dir,.cue.fresh .findingrow{animation:none}
  .cue.hold{min-height:0 !important}
  .delim.struck .dx::after{width:100%}
  .coda-q.wrong::after{width:100%}
  .spine.looped .spine-loop{opacity:1}
}
/* print = everything expanded. Flipping the TOKENS rather than listing band selectors
   means new band children can never be forgotten here. */
@page{margin:16mm}
@media print{
  :root{--band:#fff;--band-ink:#000;--band-soft:#444;--band-faint:#555;--band-line:#999;
    --band-field:#fff;--band-edge:#000;--band-accent:#000;--paper-2:#fff;--line:#bbb;--line-2:#999}
  body{background:#fff}
  .appbar,.mobtab,.demobar,.tabs,.btn,.adv,.modeswitch,textarea,.states,.evpick,.mechtabs,.demorow{display:none !important}
  .disruptband{background:#fff !important;color:#000 !important;border:0 !important;
    border-top:2px solid #000 !important;border-bottom:2px solid #000 !important;padding:22px 0;margin:24px 0}
  .cue,.ln,.dir,.beat,.card{opacity:1 !important;transform:none !important;animation:none !important}
  .cue.hold{min-height:0 !important}
  .cue.fresh::before{display:none}
  .ln.land{break-after:avoid}
  .cue,.card,.beat{break-inside:avoid}
  .spine-loop{border-style:solid}
  .mech .mech-out{display:flex !important}
  .hcard.retired{filter:none;opacity:1}
  .stat,.mech-box,.peerbox,.link,.cbox,.ped-node,.modelans,.beat.locked{background:#fff !important;border:1px solid #999 !important}
  .card,.beat{border-color:#999}
}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Follow the Tracks — clinical reasoning, examined.
   Single file. No network. Deterministic. ES2019.
   The case narrative, dialogue and model answers are FACULTY-AUTHORED
   CONTENT and render as written. Platform chrome, grader voice and
   metric names are ours and stay neutral.
   ============================================================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var K_ATT="ftt.attempts.v3";
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------------- tokenizer (raw offsets preserved) ---------------- */
function stemWord(w){var suf=["ing","ed","es","s"];for(var i=0;i<suf.length;i++){var s=suf[i];
  if(w.length-s.length>=3 && w.slice(-s.length)===s)return w.slice(0,w.length-s.length);}return w;}
function tokenize(raw){raw=String(raw==null?"":raw);var toks=[],re=/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g,m;
  while((m=re.exec(raw))){var text=m[0],start=m.index,norm=text.toLowerCase().replace(/['’]/g,"");
    toks.push({text:text,norm:norm,stem:stemWord(norm),start:start,end:start+text.length});}return toks;}
var STOP={a:1,an:1,the:1,of:1,in:1,on:1,to:1,his:1,her:1,their:1,my:1,is:1,and:1,with:1,into:1,at:1,from:1,
  for:1,he:1,she:1,it:1,this:1,that:1,as:1,be:1,i:1,would:1,was:1,are:1,were:1,but:1,or:1,up:1,we:1,you:1,not:1};
function synStruct(str){var t=tokenize(str);return {raw:str,toks:t.map(function(x){return {norm:x.norm,stem:x.stem};})};}
var BREAKW={but:1,however:1,although:1,though:1,whereas:1};
function assignClauses(raw,toks){var cid=0;for(var i=0;i<toks.length;i++){if(i>0){
  var gap=raw.slice(toks[i-1].end,toks[i].start);
  if(/[.;:!?\n]/.test(gap))cid++;else if(BREAKW[toks[i].norm])cid++;}toks[i].clause=cid;}}
var NEG_CUES=[["no"],["not"],["without"],["denies"],["denied"],["deny"],["unlikely"],["doubt"],["never"],["negative"],
  ["cannot","be"],["can","not"],["isnt"],["wasnt"],["arent"],["absence"],["absent"],["nil"]];
var CON_CUES=[["rule","out"],["ruled","out"],["rules","out"],["ruling","out"],["exclude"],["excluded"],["excluding"],
  ["consider"],["considered"],["considering"],["differential"],["differentials"],["ddx"],["versus"],["vs"]];
var CONN_CUES=[["because"],["given"],["since"],["suggests"],["suggest"],["suggested"],["points"],["therefore"],["due"],
  ["consistent"],["indicates"],["indicate"],["hence"],["explains"],["classic"],["typical"],["fits"],["fit"],
  ["cause"],["causes"],["caused"],["reason"]];
function findCues(toks,cues){var out=[];for(var i=0;i<toks.length;i++){for(var c=0;c<cues.length;c++){var cu=cues[c];
  if(i+cu.length>toks.length)continue;var ok=true;for(var j=0;j<cu.length;j++){if(toks[i+j].norm!==cu[j]){ok=false;break;}}
  if(ok)out.push({start:i,end:i+cu.length-1,clause:toks[i].clause});}}return out;}
function cueNear(occs,hit,win,forward){for(var i=0;i<occs.length;i++){var o=occs[i];if(o.clause!==hit.clause)continue;
  var d=hit.tokenStart-o.end;if(forward){if(d>=1&&d<=win)return true;}else{if(d>=-win&&d<=win)return true;}}return false;}
/* ---------------- matcher ---------------- */
function findWindow(posLists,win){for(var a=0;a<posLists[0].length;a++){var anchor=posLists[0][a],mn=anchor,mx=anchor,ok=true;
  for(var k=1;k<posLists.length;k++){var best=-1,bd=1e9;for(var p=0;p<posLists[k].length;p++){
    var d=Math.abs(posLists[k][p]-anchor);if(d<bd){bd=d;best=posLists[k][p];}}
    if(best<0){ok=false;break;}if(best<mn)mn=best;if(best>mx)mx=best;}
  if(ok&&mx-mn<=win)return [mn,mx];}return null;}
function matchConcept(toks,con){var hits=[];con._syn.forEach(function(st){
  if(st.toks.length===1){var s=st.toks[0];for(var i=0;i<toks.length;i++){
    if(toks[i].norm===s.norm||(toks[i].norm.length>=4&&s.stem.length>=4&&toks[i].stem===s.stem)){
      hits.push({tokenStart:i,tokenEnd:i,synonym:st.raw,quality:toks[i].norm===s.norm?"exact":"stem"});}}}
  else{var n=st.toks.length;for(var i2=0;i2+n<=toks.length;i2++){var ok=true;
      for(var j=0;j<n;j++){if(toks[i2+j].norm!==st.toks[j].norm){ok=false;break;}}
      if(ok)hits.push({tokenStart:i2,tokenEnd:i2+n-1,synonym:st.raw,quality:"exact"});}
    var content=st.toks.filter(function(t){return !STOP[t.norm];});
    if(content.length>=2){var posLists=content.map(function(t){var arr=[];
        for(var k=0;k<toks.length;k++){if(toks[k].stem===t.stem||toks[k].norm===t.norm)arr.push(k);}return arr;});
      if(posLists.every(function(a){return a.length;})){var w=findWindow(posLists,6);
        if(w)hits.push({tokenStart:w[0],tokenEnd:w[1],synonym:st.raw,quality:"proximity"});}}}});
  return hits;}
function mergeHits(hits){if(!hits.length)return [];
  hits=hits.slice().sort(function(a,b){return a.tokenStart-b.tokenStart||b.tokenEnd-a.tokenEnd;});
  var out=[hits[0]];for(var i=1;i<hits.length;i++){var last=out[out.length-1],h=hits[i];
    if(h.tokenStart<=last.tokenEnd){if(h.tokenEnd>last.tokenEnd)last.tokenEnd=h.tokenEnd;
      var rank={exact:3,proximity:2,stem:1};
      if(rank[h.quality]>rank[last.quality]){last.quality=h.quality;last.synonym=h.synonym;}}
    else out.push(h);}return out;}


/* ============================================================
   QUESTION GRADER
   Two independent channels — STATUS (what kind of answer) and
   CONDUCT (how it was arrived at) — plus optional STARS.
   The client's own scorecard needs all three: a 4-star refinement
   and a no-star honest gap share an amber glyph; a 5-star complete
   answer and a 5-star answer with something to add share a green one.
   ============================================================ */

/* Reasoning cues. Bare function words (to / as / if / when / which / into)
   are deliberately NOT here: "hypoxia to erythropoietin to marrow" is a
   keyword list, not a chain, and one token is all that separates them. */
var Q_CONN_EXTRA=[["increases"],["increase"],["stimulates"],["stimulate"],["releases"],["release"],
 ["response"],["responds"],["drives"],["drive"],["produces"],["produce"],["promotes"],["promote"],
 ["activates"],["activate"],["leads"],["lead"],["results"],["result"],["makes"],["make"],["means"],
 ["binds"],["bind"],["permits"],["permit"],["allows"],["allow"],["escapes"],["escape"],
 ["prevents"],["prevent"],["recognises"],["recognizes"],["recognise"],["recognize"],
 ["attaches"],["attach"],["destroys"],["destroy"],["marks"],["mark"],["targets"],["target"],
 ["therefore"],["hence"],["because"],["since"],["so"],["unless"],["thus"],["whereas"]];
var Q_CONN=CONN_CUES.concat(Q_CONN_EXTRA);
function cueAt(toks,k){for(var q=0;q<Q_CONN.length;q++){var cu=Q_CONN[q];if(k+cu.length>toks.length)continue;
  var ok=true;for(var j=0;j<cu.length;j++){if(toks[k+j].norm!==cu[j]){ok=false;break;}}if(ok)return true;}return false;}
function connNearQ(toks,hit,win){var c=hit.clause,lo=Math.max(0,hit.tokenStart-win),hi=Math.min(toks.length-1,hit.tokenEnd+win);
  for(var k=lo;k<=hi;k++){if(toks[k].clause!==c)continue;if(cueAt(toks,k))return true;}return false;}

var HONESTY_RE=/(not come across|have not come across|haven'?t (met|come across|encountered|seen)|never (heard|came across|met)|fails my memory|escapes me|don'?t know|do not know|not sure|unsure|can'?t recall|cannot recall|could not recall|unfamiliar|no idea|blanking|new to me|not met this)/i;

function qConcept(id,syns){return {id:id,synonyms:syns,_syn:syns.map(synStruct)};}
function analyseAnswer(rawText,concepts){
 var toks=tokenize(rawText);assignClauses(rawText,toks);
 var neg=findCues(toks,NEG_CUES),con=findCues(toks,CON_CUES);var by={};
 concepts.forEach(function(c){var m=mergeHits(matchConcept(toks,c));m.forEach(function(h){
   h.conceptId=c.id;h.clause=toks[h.tokenStart].clause;
   h.negated=cueNear(neg,h,5,true);h.considered=cueNear(con,h,5,false);
   h.rawStart=toks[h.tokenStart].start;h.rawEnd=toks[h.tokenEnd].end;
   h.reasoned=connNearQ(toks,h,12);});
   if(m.length)by[c.id]=m;});
 return {toks:toks,byConcept:by};
}
function cleanHit(by,id){var hs=by[id]||[];return hs.some(function(h){return !h.negated&&!h.considered;});}
function contentTokenCount(toks){var n=0;toks.forEach(function(t){if(!STOP[t.norm])n++;});return n;}

/* Does any single clause hold two distinct core concepts AND a causal cue?
   That is the difference between a chain and a pile. */
function hasLinkedClause(toks,by,coreIds){
  var perClause={};
  coreIds.forEach(function(cid){(by[cid]||[]).forEach(function(h){
    if(h.negated||h.considered)return;
    if(!perClause[h.clause])perClause[h.clause]={};
    perClause[h.clause][cid]=1;});});
  for(var cl in perClause){
    var n=0;for(var k in perClause[cl])n++;
    if(n<2)continue;
    for(var i=0;i<toks.length;i++){if(toks[i].clause!==Number(cl))continue;if(cueAt(toks,i))return true;}
  }
  return false;
}

var GAP_CREDIT=0.65;   /* solved, not fitted: 72 + 20g = 85  =>  g = 0.65 */

var STATUS_GLYPH={
  correct:"green", extend:"green",
  refine:"amber", newConcept:"amber", asserted:"amber",
  factGap:"red", wrongFact:"red", contradicts:"red", insufficient:"red",
  unattempted:"mute"
};
var STATUS_FALLBACK={
  correct:"Correct", extend:"Correct mechanism", refine:"Correct idea, mechanism needs refinement",
  newConcept:"New concept met", asserted:"Named without reasoning", factGap:"Gap declared",
  wrongFact:"Not this one", contradicts:"Contradicts the evidence",
  insufficient:"Too little to grade", unattempted:"Not attempted"
};

function gradeQuestion(item,answer,declared){
  answer=String(answer==null?"":answer);
  var out={id:item.id,kind:item.recall?"recall":"reasoning",w:item.w,status:null,conduct:null,
    stars:null,frac:0,distinction:false,hits:{},feedback:"",extendText:null,refineChain:null,suspectStuffing:false,label:""};

  function done(status,conduct,stars,frac,fb){
    out.status=status;out.conduct=conduct;out.stars=stars;out.frac=frac;
    out.feedback=fb||"";
    out.label=(item.labels&&item.labels[status])||STATUS_FALLBACK[status]||status;
    return out;
  }

  /* 0 — nothing written and nothing declared. No row on the scorecard; still in
         the denominator. A DECLARED gap also has an empty textarea, so the
         declaration has to be tested first or honesty reads as silence. */
  if(!answer.trim()&&!declared)return done("unattempted","silent",null,0,"");

  var pool=(item.core||[]).slice();
  if(item.refine)pool.push(item.refine);
  if(item.exclude)pool.push(item.exclude);
  (item.pivot||[]).forEach(function(c){pool.push(c);});
  (item.contra||[]).forEach(function(c){pool.push(c);});
  (item.extendConcepts||[]).forEach(function(c){pool.push(c);});

  var an=analyseAnswer(answer,pool),by=an.byConcept,toks=an.toks;
  Object.keys(by).forEach(function(k){out.hits[k]=true;});

  var coreIds=(item.core||[]).map(function(c){return c.id;});
  var coreHits=(item.core||[]).filter(function(c){return cleanHit(by,c.id);});
  var coreHit=coreHits.length>0;
  var wrongAssertion=(item.contra||[]).some(function(c){return cleanHit(by,c.id);});
  var declaredGap=!!declared||HONESTY_RE.test(answer);

  /* 1 — substance floor. A punctuation mark or a shrug is not an answer.
         Reasoning questions only: a recall answer is legitimately one word,
         so "belzutifan" must pass and "sunitinib" must be graded as a wrong
         fact rather than dismissed as noise. */
  if(!item.recall && contentTokenCount(toks)<4 && !coreHit && !declaredGap && !wrongAssertion)
    return done("insufficient","silent",null,0,"Too little here to grade. Nothing was read as an attempt at the mechanism.");

  /* 2 — honest gap. Declared or written; never punished, never confused with stuffing. */
  if(declaredGap && !coreHit && !wrongAssertion){
    return done(item.recall?"factGap":"newConcept","honest",null,GAP_CREDIT,
      item.feedbackGap||"A concept you had not met. It is now on the record.");
  }

  /* 3 — recall questions. Three ways to answer, and guessing wrong is not honesty. */
  if(item.recall){
    if(coreHit)return done("correct","reasoned",null,1,item.feedback5);
    return done("wrongFact","asserted",null,0,item.feedbackWrong||"Not this one.");
  }

  /* 4 — reasoning questions. */
  if(wrongAssertion)
    return done("contradicts","asserted",0,0,item.feedbackContra||"This runs against the evidence in the case.");

  var reasoned=(item.core||[]).some(function(c){var hs=by[c.id]||[];
    return hs.some(function(h){return !h.negated&&!h.considered&&h.reasoned;});});

  /* 4a — Q2 is an exclusion question: naming the normal investigations IS the answer.
          Must run before the force-assert rule, or the correct list gets punished. */
  if(item.special==="exclusion"){
    var nInv=(item.core||[]).filter(function(c){return (by[c.id]||[]).length>0;}).length;
    var exHit=item.exclude?cleanHit(by,item.exclude.id):false;
    if(nInv>=1&&exHit)return done("correct","reasoned",5,1,item.feedback5);
    if(nInv>=2)return done("refine","reasoned",4,0.8,item.feedback4);
  }

  /* 4b — Q3 rewards seeing the contradiction itself. */
  if(item.special==="contradiction"){
    var epoHit=cleanHit(by,"epo");
    var pivotHit=(item.pivot||[]).some(function(c){return cleanHit(by,c.id);});
    if(epoHit&&pivotHit&&reasoned){out.distinction=!!item.pivotQuestion;
      return done("correct","reasoned",5,1,item.feedback5);}
  }

  /* 4c — force-assert. Four or more concepts and not one clause links two of them
          with a causal cue: that is a keyword pile wearing a sentence's clothes. */
  if(coreHits.length>=4 && !hasLinkedClause(toks,by,coreIds)){
    out.suspectStuffing=true;
    return done("asserted","asserted",2,0.4,"The right concepts are all here, but nothing links them. Say what causes what.");
  }

  /* 4d — the ladder. */
  if(!coreHit)
    return done("asserted","asserted",1,0.2,"Only a tangential idea appears — name the core mechanism.");
  if(!reasoned)
    return done("asserted","asserted",2,0.4,"Concepts named without linking them — state the reason.");

  var refineHit=item.refine?cleanHit(by,item.refine.id):false;
  if(item.refine&&!refineHit){
    out.refineChain=item.refine.chain||null;
    return done("refine","reasoned",4,0.8,item.feedback4||item.feedback5);
  }
  var enough=((item.core||[]).length<=1)||coreHits.length>=2;
  if(!enough)return done("refine","reasoned",3,0.6,item.feedback4||item.feedback5);

  /* Nothing is wrong; the scope is simply narrower than the full answer.
     Doc 4 gives five stars and then adds to it — so extend must not cap. */
  if(item.extend){
    var allExt=(item.extendConcepts||[]).every(function(c){return cleanHit(by,c.id);});
    if(!allExt){out.extendText=item.extend.text;
      return done("extend","reasoned",5,1,item.feedback5);}
  }
  if(item.pivotQuestion)out.distinction=true;
  return done("correct","reasoned",5,1,item.feedback5);
}

function greatestStrength(caseObj,res){
  var best=null;
  (caseObj.questions||[]).forEach(function(it){
    var r=res[it.id];if(!r)return;
    if(r.status!=="correct"&&r.status!=="extend")return;
    if(r.conduct!=="reasoned")return;
    var score=it.w+(it.pivotQuestion?100:0);
    if(!best||score>best.score)best={id:it.id,q:it.qtext,score:score,note:it.strengthNote||""};
  });
  return best;
}

function gradeQuestions(caseObj,ans,state){
  ans=ans||{};state=state||{};
  var declared=state.declared||{};
  var qs=caseObj.questions||[],res={},reasonEarned=0,recallEarned=0,earned100=0;
  var assertionCount=0,honestGapCount=0,honestGapMarks=0,attemptedCount=0,suspectCount=0;
  qs.forEach(function(item){
    var r=gradeQuestion(item,ans[item.id]||"",declared[item.id]);
    res[item.id]=r;
    var pts=r.frac*item.w;earned100+=pts;
    if(item.recall)recallEarned+=pts;else reasonEarned+=pts;
    if(r.status!=="unattempted")attemptedCount++;
    if(r.conduct==="asserted"&&!item.recall)assertionCount++;
    if(r.status==="newConcept"||r.status==="factGap"){honestGapCount++;honestGapMarks+=GAP_CREDIT*item.w;}
    if(r.suspectStuffing)suspectCount++;
  });
  var d1=state.interlock&&state.interlock.d1?state.interlock.d1:null;
  var d2=state.interlock&&state.interlock.d2?state.interlock.d2:null;
  var killers=(caseObj.disruptions&&caseObj.disruptions[0].killers)||[];
  var nKill=d1&&d1.evidence?d1.evidence.filter(function(e){return killers.indexOf(e)>=0;}).length:0;
  var flags={
    anchored: !!(d1&&d1.verdict&&d1.verdict!=="dead"),
    cleanRevision: !!(d1&&d1.verdict==="dead"&&nKill>=3&&d2&&d2.choice==="sensing"),
    assertionCapped: assertionCount>=3
  };
  return {q:res,earned100:earned100,overall10:Math.round(earned100)/10,
    reasoningPct:Math.round(reasonEarned/90*100),recallPct:Math.round(recallEarned/10*100),
    assertionCount:assertionCount,honestGapCount:honestGapCount,
    honestGapMarks:honestGapMarks/10,attemptedCount:attemptedCount,suspectCount:suspectCount,
    flags:flags,strength:greatestStrength(caseObj,res)};
}


/* ============================================================
   CASE DATA — VHL-003
   Narrative, dialogue, model answers and verdict wording are the
   faculty's, reproduced from the case documents. Structure is ours.
   ============================================================ */
var VHL={
 id:"VHL-003",
 title:"Case of the Man Who Was Never Short of Oxygen",
 specialty:"Internal Medicine / Molecular",difficulty:"Hard",minutes:25,
 oneLiner:"A software engineer, headaches and too many red cells, whose oxygen is perfectly normal.",
 competency:{code:"IM 5.12",text:"Reason from a contradiction to a molecular diagnosis"},

 place:"St. Bartholomew's Hospital, London · Medical ward",

 /* ---- the document's own eight-beat spine, which rewinds ----
    c:1 starts a new cue (one press). w:"land" breaks the line out of the speech
    column; w:"hold" additionally gives it half an empty screen. Six holds in the
    whole case — used sixteen times it would be a scroll marathon. ---- */
 beats:[
  {n:"1",kind:"stage",title:"Patient",move:"observe",
   predict:{id:"p1",after:"Weight loss?",
     ask:"He has heard three months of headaches, no fatigue, no breathlessness. What does he ask next?",

function lintCase(c){
  var errors=[],warnings=[];
  var wsum=(c.questions||[]).reduce(function(s,q){return s+(q.w||0);},0);
  if(wsum!==100)errors.push("Question weights sum to "+wsum+", not 100.");
  var reasoning=(c.questions||[]).reduce(function(s,q){return s+(q.recall?0:q.w);},0);
  var recall=(c.questions||[]).reduce(function(s,q){return s+(q.recall?q.w:0);},0);
  if(reasoning!==90||recall!==10)errors.push("Reasoning/recall split is "+reasoning+"/"+recall+", not 90/10.");
  (c.questions||[]).forEach(function(q){
    if(!q.model||!q.model.lines||!q.model.lines.length)errors.push(q.id+" has no model answer.");
    if(!q.feedbackGap)errors.push(q.id+" has no gap feedback.");
    if(q.recall&&!q.feedbackWrong)errors.push(q.id+" is a recall question with no wrong-answer feedback.");
    if(q.recall&&q.feedbackWrong&&/honest|admit|uncertain/i.test(q.feedbackWrong))
      errors.push(q.id+" praises honesty in its WRONG-answer feedback.");
    (q.chain||[]).forEach(function(l){
      var known=(q.core||[]).some(function(cc){return cc.id===l.conceptId;})||(q.refine&&q.refine.id===l.conceptId);
      if(!known)errors.push(q.id+" chain link references unknown concept '"+l.conceptId+"'.");});
  });
  var evIds={};(c.ledger.evidence||[]).forEach(function(e){evIds[e.id]=1;});
  (c.ledger.rows||[]).forEach(function(r){(r.killedBy||[]).forEach(function(e){
    if(!evIds[e])errors.push("Ledger row "+r.id+" cites unknown evidence '"+e+"'.");});});
  var chipIds={};(c.disruptions[0].chips||[]).forEach(function(ch){chipIds[ch.id]=1;});
  (c.disruptions[0].killers||[]).forEach(function(k){if(!chipIds[k])errors.push("d1 killer '"+k+"' is not a chip.");});
  if(!chipIds[c.disruptions[0].decoy])errors.push("d1 decoy is not a chip.");
  return {errors:errors,warnings:warnings,weightSum:wsum};
}

function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function cohort(caseObj){
  var rnd=mulberry32(hashStr(caseObj.id)),N=60,students=[];
  var tiers=["strong","saba","gamed","weak"];
  for(var i=0;i<N;i++){
    var r=rnd(),tier=r<0.22?"strong":r<0.60?"saba":r<0.76?"gamed":"weak";
    var ans=demoAnswers(caseObj,tier),st=demoState(caseObj,tier);
    var declared={};
    /* deterministic per-student variation: drop or declare some answers */
    (caseObj.questions||[]).forEach(function(it){

    });

    students.push({name:NAMES[i%NAMES.length]+" "+(Math.floor(i/NAMES.length)+1),tier:tier,g:g});
  }
  var perQ={};(caseObj.questions||[]).forEach(function(it){
    var miss=0,gap=0,stuff=0;
    students.forEach(function(s){var r=s.g.q[it.id];
      if(r.frac<0.5)miss++;
      if(r.status==="newConcept"||r.status==="factGap")gap++;
      if(r.suspectStuffing)stuff++;});
    perQ[it.id]={miss:Math.round(miss/N*100),gap:Math.round(gap/N*100),stuff:stuff,qtext:it.qtext,w:it.w};});
  var mean=students.reduce(function(s,x){return s+x.g.overall10;},0)/N;
  var anchored=students.filter(function(s){return s.g.flags.anchored;}).length;
  var honest=students.filter(function(s){return s.g.honestGapCount>0;}).length;
  var suspect=students.filter(function(s){return s.g.suspectCount>0;}).length;
  return {students:students,N:N,perQ:perQ,mean:mean,anchored:anchored,honest:honest,suspect:suspect,tiers:tiers};
}

    S.beat=2;S.cue=1;
    var d1html=sceneOf(cs,2).slice(0,S.cue+1).map(function(c){return c.inner;}).join("");
    ok("SCENE d1 resolve is not emitted before the student has judged the evidence",
       d1html.indexOf("Our first hypothesis is dead.")<0);
    S.beat=5;S.cue=2;
    var d2html=sceneOf(cs,5).slice(0,S.cue+1).map(function(c){return c.inner;}).join("");
    ok("SCENE d2 resolve is not emitted before the student has chosen the locus",
       d2html.indexOf("The cell merely refuses to believe it.")<0);

    /* a volley must read as a volley: the negatives collapse to two speaker marks */
    S.beat=0;S.cue=1;
    var neg=sceneOf(cs,0)[1].inner;
    var marks=(neg.match(/class="sp"/g)||[]).length-(neg.match(/class="ln [^"]*cont/g)||[]).length;
    ok("SCENE the four-negative volley is one cue, not four presses",
       neg.indexOf("Oddly, no.")>=0&&neg.indexOf("None.")>=0);

    /* the prediction is ungraded and must be invisible to the grader */
    var recProbe=JSON.stringify({answers:demoAnswers(cs,"saba"),state:{declared:{},
      interlock:S.interlock,ledger:S.ledger}});
    ok("SCENE the prediction never reaches the attempt record",recProbe.indexOf("predict")<0);

    /* character names live in faculty content only, never in our renderer */
    ok("SCENE voices are assigned by order of appearance, not by character name",
       voiceCls([],"Anyone")==="vA"&&voiceCls(["X"],"Y")==="vB");

    ok("SCENE sceneOf is deterministic",
       JSON.stringify(sceneOf(cs,1))===JSON.stringify(sceneOf(cs,1)));

    var st=JSON.parse(save);
    S.beat=st.b;S.cue=st.c;S.hyp1=st.h1;S.hyp2=st.h2;S.interlock=st.il;S.ledger=st.lg;
    S.ledgerCommitted=st.lc;S.askedFamily=st.af;S.predict=st.pr;S.readAll=st.ra;
  }
  /* ---- NO DEAD ENDS: from any beat, in either pacing mode, there is always a way
         forward. "Show the whole stage" once rendered one beat with no control and
         only a Submit button, and the preference persisted across sessions. ---- */
  if(typeof ctrlCueIdx==="function"){
    var sv=JSON.stringify({b:S.beat,c:S.cue,ra:S.readAll,lc:S.ledgerCommitted,af:S.askedFamily,
      h1:S.hyp1,h2:S.hyp2,il:S.interlock,lg:S.ledger,pr:S.predict});
    var stuck=[];
    [false,true].forEach(function(mode){
      S.readAll=mode;
      cs.beats.forEach(function(b,i){
        /* fresh student: nothing committed anywhere */
        S.beat=i;S.cue=0;S.ledgerCommitted=false;S.askedFamily=false;
        S.hyp1="";S.hyp2="";S.predict={};
        S.interlock={d1:{verdict:null,evidence:[],why:""},d2:{choice:null,why:""}};
        S.ledger={};
        var cues=sceneOf(cs,i);
        var lastIdx=mode?cues.length-1:0;
        var k=ctrlCueIdx(cs,cues,lastIdx);
        var c=cues[k];
        /* a way forward exists if the controlling cue is reachable: either it is
           ungated, or it carries a gate the student can satisfy by writing something */
        var hasControl=!!c;
        var gated=c&&c.gate;
        if(!hasControl)stuck.push((mode?"all":"step")+" beat "+i+": no control");
        else if(!gated&&k>=cues.length-1&&i===cs.beats.length-1&&b.kind!=="questions")
          stuck.push((mode?"all":"step")+" beat "+i+": terminal with no exit");
      });
    });
    ok("NO DEAD END: every beat offers a control in both pacing modes ("+stuck.join("; ")+")",stuck.length===0);
    /* and the last beat must be the questions beat, which offers Submit */
    S.readAll=true;S.beat=cs.beats.length-1;S.cue=0;
    ok("NO DEAD END: the final beat is the questions beat and can submit",
       cs.beats[cs.beats.length-1].kind==="questions");
    var r=JSON.parse(sv);
    S.beat=r.b;S.cue=r.c;S.readAll=r.ra;S.ledgerCommitted=r.lc;S.askedFamily=r.af;
    S.hyp1=r.h1;S.hyp2=r.h2;S.interlock=r.il;S.ledger=r.lg;S.predict=r.pr;
  }
  /* ---- NOTHING OFF THE RIGHT EDGE. This was shipped broken twice because the
     earlier check compared scrollWidth to innerWidth — and html{overflow-x:clip}
     clips rather than scrolls, so scrollWidth never grows and the test passed
     while the case file was being cut off. Measure real edges instead. ---- */
  if(typeof document!=="undefined"&&document.querySelector(".enc")){
    var _vw=document.documentElement.clientWidth,_off=[];
    /* Content inside a horizontal scroller (the phone spine strip) is REACHABLE
       even when it sits past the window, so it is not a defect. Only content
       with no scrollable ancestor is genuinely lost. */
    var _scrollable=function(el){
      for(var p=el.parentElement;p&&p!==document.body;p=p.parentElement){
        var ox=getComputedStyle(p).overflowX;
        if(ox==="auto"||ox==="scroll")return true;
      }
      return false;
    };
    Array.prototype.forEach.call(document.querySelectorAll(".enc *"),function(el){
      var r=el.getBoundingClientRect();
      if(r.width>0&&r.right>_vw+1&&!_scrollable(el))_off.push(el.className||el.tagName);
    });
    ok("RIGHT EDGE: nothing in the desk extends past the window ("+_off.slice(0,3).join(", ")+")",_off.length===0);
    var _fw=document.querySelector(".filewrap");
    ok("RIGHT EDGE: the case file is fully on screen",
       !_fw||_fw.getBoundingClientRect().right<=_vw+1);
    /* and the guard itself must be reachable, or the two above are luck */
    ok("RIGHT EDGE: fitDesk exists to collapse the desk when it will not fit",
       typeof fitDesk==="function");
    /* ---- DEAD AIR. The scene column is measure-capped, so if 1fr ever moves
       back onto it the surplus width pools in a hole down the middle of the
       desk instead of reaching the case file. 290px of it did exactly that. ---- */
    var _enc=document.querySelector(".enc"),_sc=document.querySelector(".scene");
    var _tracks=getComputedStyle(_enc).gridTemplateColumns.trim().split(/\s+/);
    if(_tracks.length===3&&_sc){
      var _gap=parseFloat(getComputedStyle(_enc).columnGap)||0,
          _pad=2*(parseFloat(getComputedStyle(document.documentElement)
                 .getPropertyValue("--beatpad"))||24),
          _slack=parseFloat(_tracks[1])-_sc.getBoundingClientRect().width-_pad;
      /* <=0 means the track is fully spent; >0 means width is pooling unused */
      ok("DEAD AIR: the scene track holds no unused width (got "+Math.round(_slack)+"px)",_slack<=1);
      ok("DEAD AIR: the case file, not the scene, is the residual track",
         /fr|px/.test(_tracks[2])&&parseFloat(_tracks[2])>=330);
      if(_gap<0)ok("gap sane",false);
    }
    /* ---- A PINNED COLUMN TALLER THAN THE WINDOW HAS AN UNREACHABLE BOTTOM ---- */
    var _fwt=document.querySelector(".filewrap");
    if(_fwt&&getComputedStyle(_fwt).position==="sticky"){
      ok("CASE FILE: a pinned case file never exceeds the window height",
         _fwt.getBoundingClientRect().height<=window.innerHeight+1);
    }
    /* the retired stamp is rendered by the markup; a CSS ::after that also
       carries the word made the card read "RETIRED RETIRED" */
    var _ret=document.querySelector(".hcard.retired .hl");
    if(_ret){
      ok("STAMP: the word RETIRED appears exactly once on a retired hypothesis",
         (_ret.textContent.match(/retired/gi)||[]).length===1);
    }
  }
  ok("every beat names the reasoning move it performs",cs.beats.every(function(b){return !!b.move;}));
  ok("the answer-key frame is staged, not dead data",!!cs.answerFrameDlg&&cs.answerFrameDlg.length===9);
  ok("the scene carries a place",!!cs.place);

  return {pass:pass,total:A.length,fails:A.filter(function(a){return !a.ok;}).map(function(a){return a.name;}),all:A};
}

/* ============================================================

   identical height and 13 lines of screenplay read as a 13-row spreadsheet.

function cueGroups(lines){

  if(!s)return "";

  if(d.w==="land"||d.w==="hold")cls+=" land";

/* ============================================================
   ENCOUNTER — the document's rewinding spine, walked cue by cue.
   Un-revealed cues are NOT EMITTED — not hidden — because the resolve
   dialogue lives in the same beat as the ask, and `hidden` would leave
   "Our first hypothesis is dead." findable by Ctrl-F before the student
   has judged the evidence for themselves.
   ============================================================ */
var MOVE={observe:"Observe",hypothesise:"Hypothesise",contradiction:"Contradiction",
  test:"Test",revise:"Revise",explain:"Explain"};
function beatLabel(b){return MOVE[b.move]||b.title;}

function gateReady(cs,gate){
  if(!gate)return true;
  if(gate==="hyp1")return words(S.hyp1)>=5;
  if(gate==="hyp2")return words(S.hyp2)>=5;
  if(gate==="d1")return !!S.interlock.d1.verdict&&S.interlock.d1.evidence.length>=1&&words(S.interlock.d1.why)>=2;
  if(gate==="d2")return !!S.interlock.d2.choice&&words(S.interlock.d2.why)>=2;
  if(gate==="ledger")return ledgerReady(cs);
  if(gate==="pred1")return words(S.predict.p1)>=1;
  return true;
}
function spineHTML(cs){
  var looped=S.beat>=6;
  /* the rail was an unlabelled column of abstract words — nothing said whether it
     was a menu, navigation, or where you had got to */
  var h='<div class="railhead">The investigation'
    +'<span>Each step is a move in the reasoning. You are on the highlighted one.</span></div>';
  h+='<div class="spine'+(looped?" looped":"")+'">';
  h+='<span class="spine-loop" style="top:calc(var(--rowh)*3);height:calc(var(--rowh)*4)"></span>';
  cs.beats.forEach(function(b,i){
    var cls=i<S.beat?"done":(i===S.beat?"on":"");
    if(b.disruption)cls+=" disrupt";
    if(b.revised)cls+=" revised";
    if(looped&&(i===3||i===4))cls+=" superseded";
    var mk=b.disruption?"!":(b.kind==="rewind"?"↺":(b.kind==="questions"?"?":b.n+(b.revised?"′":"")));
    h+='<div class="railstep '+cls+'"><span class="mk">'+esc(mk)+'</span>'
      +'<span class="lb">'+esc(beatLabel(b))+'</span></div>';});
  return h+'</div>';
}
/* the hypothesis board moved into the case file — it is the thing all that
   evidence is being weighed against, so it belongs beside it, not under the spine */
/* ============================================================
   THE CASE FILE — evidence pinned as it accumulates.
   Gated by the same rule as the scene, so it can never show a finding the
   student has not reached. It lags the scene by at most one press; it never
   leads it.
   ============================================================ */
function beatReached(i){
  if(S.revealAll||S.readAll)return true;
  if(i<S.beat)return true;
  return i===S.beat&&S.cue>=1;
}
function cfRow(k,v,cls){
  return '<div class="cf-row '+(cls||"")+'"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';
}
function cfSection(title,rows){
  if(!rows)return "";
  return '<div class="cf-sec"><div class="t">'+esc(title)+'</div>'+rows+'</div>';
}
function caseFileHTML(cs){
  var body="",any=false;

  /* the working hypothesis lives here now — it is the thing the evidence is against */
  var retired=S.beat>=3&&S.hyp1;
  var live=(S.beat>=7&&S.hyp2)?S.hyp2:(retired?null:S.hyp1);
  var hyp="";
  if(live)hyp+='<div class="hcard"><div class="hl">Working hypothesis</div><div class="ht">'+esc(live)+'</div></div>';
  if(retired)hyp+='<div class="hcard retired" style="margin-top:10px"><div class="hl">Retired</div>'
    +'<div class="ht">'+esc(S.hyp1)+'</div><div class="epitaph">'+esc(cs.epitaph)+'</div></div>';
  if(!hyp)hyp='<div class="cf-empty">Nothing committed yet.</div>';

  /* bloods — beat 1's table */
  if(beatReached(1)){
    var t=cs.beats[1].reveal.tables[0],rows="";
    t.rows.forEach(function(r){rows+=cfRow(r.test,r.value,r.flag?"hi":"");});
    body+=cfSection("Bloods",rows);any=true;
  }
  /* the five normals that killed the first hypothesis — the ones Q2 asks about */
  if(beatReached(2)){
    var rows2="";
    cs.disruptions[0].data.forEach(function(f){rows2+=cfRow(f.label,f.short||f.text,"norm");});
    body+=cfSection("Oxygenation",rows2);any=true;
  }
  /* the quiet pass */
  if(beatReached(4)){
    var rows4="";
    cs.beats[4].reveal.findings.forEach(function(f){rows4+=cfRow(f.label,f.short||f.text,"norm");});
    body+=cfSection("Renal · hepatic",rows4);any=true;
  }
  /* the result that broke it open */
  if(beatReached(5)){
    body+=cfSection("Key result",cfRow("Serum erythropoietin","Markedly elevated","hi"));any=true;
  }
  /* imaging */
  if(beatReached(8)){
    body+=cfSection("Imaging",cfRow("CT abdomen","2.8 cm renal mass","hi"));any=true;
  }
  /* the family tree — only once the student has chosen to ask */
  if(S.askedFamily){
    var rowsF="";
    cs.family.pedigree.forEach(function(p){if(!p.proband)rowsF+=cfRow(p.who,p.what.split(",")[0],"hi");});
    body+=cfSection("Family",rowsF);any=true;
  }
  /* differentials disposed of */
  if(S.ledgerCommitted){
    var dead="";
    cs.ledger.rows.forEach(function(r){
      var st=S.ledger[r.id];
      if(st&&st.state==="dead")dead+='<div class="cf-dead">'+esc(r.dx)+'</div>';
      else if(st&&st.state==="unlikely")dead+='<div class="cf-row norm"><span class="k">'+esc(r.dx)+'</span><span class="v">unlikely</span></div>';
    });
    body+=cfSection("Excluded",dead);any=true;
  }
  return '<div class="cfile"><div class="h">Working hypothesis</div>'+hyp+'</div>'
    +'<div class="cfile evidence"><div class="h">The case file</div>'
    +(any?body:'<div class="cf-empty">Evidence will collect here as it arrives.</div>')+'</div>';
}

function ledgerReady(cs){

function answeredCount(cs){

    if((S.qAnswers[it.id]||"").trim()||S.declared[it.id])n++;});

function answerHint(cs,n){
  var total=(cs.questions||[]).length;
  if(!n)return "Answer at least one question — or mark one as a gap — before submitting.";
  if(n<total)return n+" of "+total+" answered. Unanswered questions score zero, so it is worth "
    +"marking the ones you have not met.";

}
function questionsHTML(cs){
  var h='<div class="small" style="margin-bottom:14px">'+esc(cs.beats[9].kicker)+'</div>';
  (cs.questions||[]).forEach(function(it,n){

      +'<div class="prompt voice-case" style="margin:4px 0 8px">'+esc(it.qtext)+'</div>';
    if(dec){
      h+='<span class="glyph g-amber"><span class="g">◑</span>Gap declared</span>'

        +'<div class="row"><button class="btn ghost sm" data-undeclare="'+esc(it.id)+'">Actually, let me try</button></div>';

      h+='<textarea data-q="'+esc(it.id)+'" placeholder="In your own words …">'+esc(v)+'</textarea>'
        +'<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-idk="'+esc(it.id)+'">I have not met this one</button>'
        +'<span class="small">Declaring a gap keeps most of the marks. Guessing wrong keeps none.</span></div>';}
    h+='</div>';});

/* ============================================================
   sceneOf(case, beatIndex) -> ordered cue list.
   A cue is an authored VOLLEY, never a single line. The eight-line negatives
   run arrives as ONE drumbeat, because four negatives in a row is the joke
   and the clue, and splitting them across four clicks kills the metronome.
   ============================================================ */
function sceneOf(cs,i){
  var b=cs.beats[i],cues=[],order=[],prev=null;
  function push(inner,say,o){o=o||{};
    cues.push({inner:inner,say:say||"",cls:o.cls||"",gate:o.gate||null,commit:o.commit||null,
      advLabel:o.advLabel||"Continue"});}
  function dlg(lines,opts){
    opts=opts||{};
    var gs=cueGroups(lines);
    gs.forEach(function(g,gi){
      var hold=g.some(function(d){return d.w==="hold";});
      var h="";
      g.forEach(function(d,n){h+=lineHTML(d,prev,order,n);prev=d;});
      var last=(gi===gs.length-1);
      var mark=(opts.gateAt===gi)||(last&&opts.gateLast);
      if(mark&&opts.tail)h+=opts.tail;
      push(h,sayOf(g),{cls:hold?"hold":"",gate:mark?opts.gate:null,
        advLabel:mark?(opts.gateLabel||"Continue"):"Continue"});
    });
  }
  function findings(list){
    cueGroups(list).forEach(function(g){
      push(g.map(function(f){
        return '<div class="findingrow"><span class="lb">'+esc(f.label)+'</span><span>'+esc(f.text)+'</span></div>';
      }).join(""),g.map(function(f){return f.label+": "+f.text;}).join("  "));
    });
  }
  function tables(list){
    return (list||[]).map(function(t){
      return '<div style="overflow-x:auto"><table class="labtable"><caption>'+esc(t.title)+'</caption>'
        +'<thead><tr><th>Test</th><th>Value</th><th>Reference</th><th></th></tr></thead><tbody>'
        +t.rows.map(function(r){return '<tr><td>'+esc(r.test)+'</td><td>'+esc(r.value)+'</td><td>'+esc(r.ref)+'</td>'
          +'<td>'+(r.flag?'<span class="flagpill">'+esc(r.flag)+'</span>':"")+'</td></tr>';}).join("")
        +'</tbody></table></div>';}).join("");
  }

  /* ---------- Stage 1: the negatives volley, and the one prediction stop ---------- */
  if(b.predict){
    var answered=words(S.predict.p1)>=1;
    var lines=(b.reveal.dialogue||[]).slice();
    if(answered){
      /* the student's own sentence is typeset into the ASKING slot, in the same face as
         everyone else — no tick, no cross. The juxtaposition is the whole feedback, and
         the next line is itself a QUESTION, so adjacency can never read as endorsement. */
      var at=-1;
      lines.forEach(function(d,n){if(d.t===b.predict.after)at=n;});
      if(at>=0)lines.splice(at,0,{s:"You",t:S.predict.p1,you:true,c:1});
    }
    var tailHTML=answered?"":('<div style="margin-top:16px"><div class="prompt">'+esc(b.predict.ask)+'</div>'
      +'<input class="line" data-pred="p1" placeholder="'+esc(b.predict.ph)+'" value="'+esc(S.predict.p1||"")+'"/>'
      +'<div class="small" style="margin-top:6px">Ungraded, and never scored. Guess freely — that is the point.</div></div>');
    dlg(lines,{gateAt:answered?-1:1,gate:"pred1",gateLabel:"Ask it →",tail:tailHTML});
  }
  /* ---------- commit a hypothesis before the contradiction exists ---------- */
  else if(b.capture){
    var cap='<div style="margin-top:16px"><div class="prompt">'+esc(b.prompt)+'</div>'
      +'<textarea data-cap="'+esc(b.capture)+'" placeholder="'+esc(b.placeholder||"")+'">'
      +esc(b.capture==="hyp1"?S.hyp1:S.hyp2)+'</textarea>'
      +'<div class="small" style="margin-top:6px">This locks when you commit. Nothing further down the case exists yet.</div></div>';
    dlg(b.reveal.dialogue||[],{gateLast:true,gate:b.capture,gateLabel:"Commit →",tail:cap});
    if(b.reveal.tables&&cues.length>1)cues[1].inner+=tables(b.reveal.tables);
  }
  /* ---------- the two disruptions ---------- */
  else if(b.interlock){
    var d=cs.disruptions[b.interlock==="d1"?0:1],st=S.interlock[b.interlock],id=b.interlock;
    dlg(d.open||[]);
    if(d.datum)push('<div class="datum voice-case">'+esc(d.datum)+'</div>',d.datum,{cls:"hold"});
    var ask="";
    if(d.data)ask+=d.data.map(function(f){
      return '<div class="findingrow"><span class="lb">'+esc(f.label)+'</span><span>'+esc(f.text)+'</span></div>';}).join("");
    if(id==="d1"&&S.hyp1)ask+='<div class="yourwords"><span class="lbl">You wrote, one step ago</span>'+esc(S.hyp1)+'</div>';
    ask+='<h2 style="margin:16px 0 4px;font-size:18px">'+esc(d.ask)+'</h2>';
    ask+='<div class="verdictset">'+d.options.map(function(o){
      return '<button class="vopt'+((st.verdict===o.id||st.choice===o.id)?" sel":"")+'" data-'+id+'opt="'+esc(o.id)+'">'
        +'<span class="vt">'+esc(o.t)+'</span><span class="vx">'+esc(o.x)+'</span></button>';}).join("")+'</div>';
    if(id==="d1"){
      ask+='<div class="small" style="color:var(--band-soft);margin-top:6px">Which findings did it? Name them — calling a hypothesis dead without naming the evidence is an outcome, not a method.</div>';
      ask+='<div class="chipset">'+d.chips.map(function(c){
        return '<button class="echip'+(st.evidence.indexOf(c.id)>=0?" sel":"")+'" data-d1chip="'+esc(c.id)+'">'
          +esc(c.label)+'</button>';}).join("")+'</div>';}
    ask+='<div style="margin-top:12px"><div class="small" style="color:var(--band-soft);margin-bottom:5px">'+esc(d.whyPrompt)+'</div>'
      +'<input class="line" data-'+id+'why="1" placeholder="'+esc(d.whyPlaceholder)+'" value="'+esc(st.why)+'"/></div>';
    push(ask,d.ask,{gate:id,advLabel:"Commit and see what happened →"});
    var mine=(id==="d1")?st.verdict:st.choice,note="";
    if(id==="d1"&&st.evidence.indexOf(d.decoy)>=0)
      note='<div class="small" style="color:var(--band-soft)">'+esc(d.decoyNote)+'</div>';
    if(id==="d2"&&d.defensible.indexOf(mine)>=0)
      note='<div class="small" style="color:var(--band-soft)">'+esc(d.defensibleNote)+'</div>';
    dlg(d.resolve.dialogue);
    /* the aphorism rides with the held line rather than costing its own press */
    var tailCue=cues[cues.length-1];
    tailCue.inner+=note+quoteHTML(d.resolve.quote,"From the case");
    if(tailCue.cls==="hold")tailCue.cls="hold withq";
  }
  /* ---------- the differential ledger ---------- */
  else if(b.ledger){
    push(ledgerRowsHTML(cs),"Five differentials to dispose of.",
      {gate:"ledger",commit:"ledger",advLabel:"Commit the differential →"});
    if(S.ledgerCommitted)push(ledgerCloseHTML(cs),cs.ledger.close.join(" "));
  }
  /* ---------- the family-history gate: the only click-to-reveal in the product ---------- */
  else if(b.askFamily){
    dlg(b.reveal.dialogue||[]);
    if(!S.askedFamily){
      cues[cues.length-1].advLabel="Ask the patient about family history →";
      cues[cues.length-1].commit="family";
    }else{
      dlg(cs.family.dialogue);
      cues[cues.length-1].inner+=pedigreeHTML(cs);
      if(cues[cues.length-1].cls==="hold")cues[cues.length-1].cls="hold withq";
    }
  }
  /* ---------- the rewind interstitial ---------- */
  else if(b.kind==="rewind"){
    push('<div class="small" style="max-width:46ch">The evidence changed, so the hypothesis step reopens. '
      +'This is the method working, not failing — nothing here is a correction of you.</div>',
      "The investigation returns to Stage 4.",{advLabel:"Return to Stage 4 →"});
  }
  /* ---------- the questions ---------- */
  else if(b.kind==="questions"){
    dlg(cs.answerFrameDlg||[]);
    push(questionsHTML(cs),"Eight questions.");
  }
  /* ---------- plain evidence beats ---------- */
  else{
    if(b.reveal&&b.reveal.dialogue)dlg(b.reveal.dialogue);
    if(b.reveal&&b.reveal.findings)findings(b.reveal.findings);
    if(b.reveal&&b.reveal.narrative)push('<div class="dir">'+esc(b.reveal.narrative)+'</div>',b.reveal.narrative);
  }
  if(!cues.length)push("","");
  return cues;
}

function encounterView(){
  var cs=caseById(S.caseId);
  if(!cs)return shell("cases",'<div class="card">Case not found.</div>');
  var body='<div class="crumbs"><a data-nav="#/cases">Case</a> › '+esc(cs.title)+'</div>';
  body+='<div class="enc"><div class="railwrap">'+spineHTML(cs)+'</div><div class="scenecol">';
  var paceHTML='<div class="modeswitch" role="group" aria-label="How much of the conversation to show at once">'
    +'<span class="mslabel">Show me</span>'
    +'<button aria-pressed="'+(!S.readAll)+'" data-pace="scene" title="Reveal the conversation a few lines at a time">a few lines</button>'
    +'<button aria-pressed="'+(!!S.readAll)+'" data-pace="full" title="Show the whole conversation for this stage at once">the whole stage</button></div>';
  /* orientation on first arrival: what this is and what is being asked of you.
     Dismissed for the session once read. */
  if(S.beat===0&&S.cue===0&&!S.oriented){
    body+='<div class="orient"><div class="oh">Before you start</div>'
      +'<p>You are the clinician on this case. It arrives one step at a time and '
      +'<b>you cannot see ahead</b> — that is deliberate.</p>'
      +'<p>You will be asked to commit a working diagnosis early, on purpose, before you '
      +'have enough. Later the evidence will contradict it. Changing your mind at that point '
      +'is the skill being measured, not a mistake.</p>'
      +'<p>At the end there are eight questions in your own words. Reasoning is worth nine times '
      +'recall, and saying <i>"I have not met this one"</i> keeps most of the marks — guessing '
      +'wrongly keeps none.</p>'
      +'<div class="row"><button class="btn primary" data-orient="1">Begin →</button>'
      +'<span class="small">About 20 minutes.</span></div></div>';
  }
  body+='<div class="slugrow"><div class="slug">'+esc(cs.place)+'</div>'+paceHTML+'</div>';
  body+='<p aria-live="polite" class="vh" id="sceneLive"></p>';

  var upto=S.revealAll?cs.beats.length-1:S.beat;
  for(var i=0;i<=upto&&i<cs.beats.length;i++){
    var b=cs.beats[i];
    /* readAll ungates CUES, never BEATS. Suppressing the advance control here was
       a hard dead end: one beat rendered, nothing to press, and the only offered
       action was to submit an empty attempt. */
    var live=(i===S.beat)&&!S.revealAll;
    var cues=sceneOf(cs,i);
    var lastIdx=(live&&!S.readAll)?Math.min(S.cue,cues.length-1):cues.length-1;
    var isForm=!!(b.ledger||b.capture||b.kind==="questions");
    var inner="";
    for(var k=0;k<=lastIdx;k++){
      var c=cues[k];
      if(!c.inner)continue;
      inner+='<div class="cue '+esc(c.cls)+((live&&k===lastIdx&&k>0)?" fresh":"")+'">'+c.inner+'</div>';
    }
    var sceneCls="scene voice-case"+(live?" live":" past");
    var head='<div class="stagetok">'
      +esc(b.n?("Stage "+b.n+(b.revised?" · Revised":"")):(b.kind==="rewind"?"Rewind":"Understanding"))+'</div>'
      +'<h2 class="voice-case">'+esc(b.title)+'</h2>'
      +(b.kicker?'<div class="small" style="margin:4px 0 8px">'+esc(b.kicker)+'</div>':"");

    if(b.interlock){
      body+='<div class="disruptband"><div class="eyebrow">Diagnostic Disruption</div>'
        +'<div class="'+sceneCls+'">'+inner+'</div>'
        +(live?advHTML(cs,i,cues,lastIdx):"")+'</div>';
    }else{
      body+='<div class="beat'+(isForm?"":" scenebeat")+(live?"":" locked")+'">'+head
        +'<div class="'+sceneCls+'">'+inner+'</div>'
        +(live?advHTML(cs,i,cues,lastIdx):"")+'</div>';
    }
  }
  /* no separate submit here — the questions beat now offers it, and the student
     can always reach that beat in either pacing mode */
  /* These used to read "Load a worked attempt: Model / Real student / Keyword-stuffed"
     with no explanation, and silently jumped you to the end with someone else's
     answers in the boxes. Now they say what they do before you press them. */
  body+='<details class="shortcut"><summary>Short on time? Skip to a finished attempt</summary>'
    +'<div class="shortcut-in"><p class="small">This fills the whole case in with somebody else\'s '
    +'answers and takes you straight to the marked scorecard, so you can see how it grades. '
    +'It replaces anything you have written.</p>'
    +'<div class="row">'
    +'<button class="btn ghost sm" data-fx="saba">A real student\'s answers — scores 8.5</button>'
    +'<button class="btn ghost sm" data-fx="strong">A model answer — scores 10</button>'
    +'<button class="btn ghost sm" data-fx="gamed">Right words, no reasoning — scores 4.2</button>'
    +'</div></div></details>';

}

/* The ONE control. A quiet strip that morphs IN PLACE into the beat's terminal verb.
   Same DOM node throughout, so keyboard focus survives the handover and assistive
   technology announces the changed accessible name at exactly the moment it matters.
   Never position:fixed — a fixed bar covers the last revealed line, which is the one
   they are meant to be reading, and it fights the on-screen keyboard. */
/* Which cue owns the control right now. When every cue is on screen at once we
   must still honour the FIRST unsatisfied gate or commit, not simply the last
   cue — otherwise "show it all" would let a student walk past the ledger. */
function ctrlCueIdx(cs,cues,lastIdx){
  for(var k=0;k<=lastIdx&&k<cues.length;k++){
    var c=cues[k];
    if(c.commit==="ledger"&&!S.ledgerCommitted)return k;
    if(c.commit==="family"&&!S.askedFamily)return k;
    if(c.gate&&!gateReady(cs,c.gate))return k;
  }
  return Math.min(lastIdx,cues.length-1);
}
function advHTML(cs,i,cues,lastIdx){
  var b=cs.beats[i];
  var ctrl=ctrlCueIdx(cs,cues,lastIdx);
  var atEnd=(lastIdx>=cues.length-1)&&(ctrl>=cues.length-1);
  if(b.kind==="questions"&&atEnd){
    /* you could previously submit eight blank answers and be handed 0.0/10 with
       no warning. Say where you are, and refuse an entirely empty attempt. */
    var answered=answeredCount(cs);
    return '<div class="row"><button class="btn primary" id="submitAll"'+(answered?"":" disabled")+'>'
      +'Submit for grading →</button>'
      +'<span class="small" id="ansCount">'+answerHint(cs,answered)+'</span></div>';
  }
  var c=cues[ctrl];
  var label,act;
  if(!atEnd||c.gate||c.commit){label=c.advLabel||"Continue";act=!!(c.gate||c.commit);}
  else{
    var nxt=cs.beats[i+1];
    label=nxt&&nxt.kind==="questions"?"Continue to the questions →":"Continue →";
    act=true;
  }
  if(atEnd&&i>=cs.beats.length-1)return "";
  var ready=gateReady(cs,c.gate);
  var remaining=Math.max(0,cues.length-1-lastIdx);
  var dots="";
  for(var k=0;k<Math.min(remaining,6);k++)dots+='<i></i>';
  /* the dots were unlabelled — a user has no way to know they mean "more to come
     in this stage", so the count is now said in words beside them */
  var left=remaining?'<span class="adv-left">'+remaining+' more in this stage</span>':"";
  return '<button class="adv'+(act?" act":"")+'" id="adv" data-adv="1"'+(ready?"":" disabled")
    +' title="'+esc(label)+'">'
    +'<span class="adv-l">'+esc(label)+'</span>'
    +(act?"":'<span class="adv-c">↓</span>'+left+'<span class="adv-dots" aria-hidden="true">'+dots+'</span>')
    +'</button>';
}

  secCoda+='</div>';

      +esc(queue.filter(function(q){return q.key===sel;})[0].note)+'</div>';}
