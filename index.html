<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Follow the Tracks — Clinical Reasoning, Examined</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='13' cy='13' r='9' stroke='%230f5b56' stroke-width='2.2'/%3E%3Cpath d='M20 20 L28 28' stroke='%230f5b56' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M8 13 h2.4 l1.6 -4 l2.4 8 l1.8 -5 l1.2 3 h3' stroke='%238a2d1f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
<style>
:root{
  --paper:#f4efe4; --paper-2:#efe8da; --card:#fbf8f1; --line:#ddd4c2; --line-2:#ccc1a9;
  --ink:#26221b; --ink-soft:#55503f; --ink-faint:#8a8371;
  --accent:#0f5b56; --accent-soft:rgba(15,91,86,.12);
  --danger:#8a2d1f; --danger-soft:rgba(138,45,31,.10);
  --amber:#a06a12; --amber-soft:rgba(160,106,18,.14);
  --green:#3e6b34; --green-soft:rgba(62,107,52,.12);
  --blue:#3a5f7a;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"SF Mono","Cascadia Mono",Consolas,"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--font-body);line-height:1.55;font-size:15px;
  background:var(--paper);
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(15,91,86,.04),transparent 60%);}
.mono{font-family:var(--font-mono)}
.serif{font-family:var(--font-display)}
button{font-family:var(--font-body);cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;
  background:var(--card);border-bottom:1px solid var(--line-2)}
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.logo{width:32px;height:32px;flex:0 0 auto}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.wordmark small{display:block;font-family:var(--font-mono);font-weight:600;font-size:8px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-top:-1px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:5px;font-weight:600}
.nav a:hover{background:var(--paper-2)}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:9px;font-size:12.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#f4efe4;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono)}
.rolebadge{font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:2px 7px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-faint)}
.linkbtn{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:0}
/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 110px}
.narrow{max-width:820px}
.crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.crumbs a{color:var(--ink-faint);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700;position:relative;padding-bottom:8px;margin-bottom:12px;display:inline-block}
.eyebrow:after{content:"";position:absolute;left:0;bottom:0;width:24px;height:2px;background:var(--accent)}
.pagetitle{font-size:clamp(24px,4vw,32px);margin:0 0 6px;line-height:1.1}
.pagesub{color:var(--ink-soft);font-size:15px;margin:0 0 22px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:22px 24px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink-faint);margin:22px 0 10px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.small{font-size:12.5px;color:var(--ink-faint)}
.kicker{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);font-weight:700}
/* buttons */
.btn{font-size:13.5px;font-weight:600;border-radius:6px;padding:10px 18px;border:1px solid var(--ink-soft);background:transparent;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);color:#f4efe4;border-color:var(--accent)}
.btn.primary:hover{background:#0c4a46}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line-2);color:var(--ink-soft)}
.btn.block{width:100%;text-align:center;display:block}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
/* landing */
.hero{padding:20px 0 8px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.02;margin:8px 0 14px;letter-spacing:-.5px}
.hero p.lede{font-size:clamp(16px,2.4vw,20px);color:var(--ink-soft);max-width:52ch;margin:0 0 26px;font-family:var(--font-display)}
.specimen{background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:22px 24px;max-width:640px;box-shadow:0 24px 60px -40px rgba(60,40,20,.6)}
.specimen .cap{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
.specimen .sent{font-family:var(--font-display);font-size:20px;line-height:1.55;min-height:2.6em}
.specimen .caret{border-right:2px solid var(--accent);animation:blink 1s step-end infinite}
@keyframes blink{50%{border-color:transparent}}
.spchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;opacity:0;transition:opacity .6s var(--ease)}
.spchips.show{opacity:1}
.spchip{font-size:12px;font-family:var(--font-mono);padding:5px 10px;border-radius:20px;border:1px solid var(--green);color:var(--green);background:var(--green-soft);font-weight:600}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;margin:30px 0}
.door{text-align:left;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:18px 20px;transition:.15s var(--ease)}
.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door .r{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.door .n{font-family:var(--font-display);font-size:18px;font-weight:700;margin:6px 0 3px}
.door .d{font-size:12.5px;color:var(--ink-faint)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0}
.step .no{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:700}
.step .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin:4px 0 2px}
.step .x{font-size:12px;color:var(--ink-faint)}
.collegestrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.cbox{border:1px solid var(--line-2);border-radius:7px;padding:16px;background:var(--paper-2)}
.cbox .t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:4px}
.cbox .x{font-size:12.5px;color:var(--ink-faint)}
.vbadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-faint)}
.vbadge .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
.vbadge.bad{border-color:var(--danger);color:var(--danger)}.vbadge.bad .d{background:var(--danger)}
/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.casecard{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;transition:.15s var(--ease);cursor:pointer}
.casecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.casecard .sys{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700}
.casecard h3{font-family:var(--font-display);font-size:18px;margin:0}
.casecard .ol{font-size:13px;color:var(--ink-soft);flex:1}
.casecard .meta{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-faint);align-items:center;flex-wrap:wrap}
.dchip{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border:1px solid var(--line-2);border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.comp{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.donef{color:var(--green);font-weight:700;font-family:var(--font-mono);font-size:11px}
.emptycase{border:1px dashed var(--line-2);border-radius:7px;padding:30px;text-align:center;color:var(--ink-faint);font-family:var(--font-display);font-style:italic}
/* encounter */
.enc{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.rail{position:sticky;top:78px}
.railstep{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13px;color:var(--ink-faint)}
.railstep .mk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--font-mono);flex:0 0 auto;background:var(--paper)}
.railstep.done{color:var(--ink-soft)}.railstep.done .mk{background:var(--accent);border-color:var(--accent);color:#f4efe4}
.railstep.cur{color:var(--ink);font-weight:700}.railstep.cur .mk{border-color:var(--accent);color:var(--accent)}
.railstep.locked .mk{opacity:.6}
.stagebody{min-width:0}
.reveal{background:var(--paper-2);border-left:3px solid var(--accent);padding:16px 18px;border-radius:0 6px 6px 0;font-family:var(--font-display);font-size:15.5px;line-height:1.68;white-space:pre-wrap}
.vitals{display:flex;flex-wrap:wrap;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.vitile{padding:9px 20px 9px 0;margin-right:16px;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:13px}
.vitile b{display:block;font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;font-weight:700}
.locked-recap{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:12px 15px;margin-bottom:14px;position:relative}
.locked-recap .lh{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.locked-recap .lt{font-family:var(--font-display);font-size:14px;white-space:pre-wrap;color:var(--ink-soft)}
.prompt{font-family:var(--font-display);font-size:18px;font-weight:700;margin:18px 0 12px;line-height:1.35}
textarea{width:100%;min-height:150px;background:#fffdf7;border:1px solid var(--line-2);border-radius:6px;color:var(--ink);padding:14px;font-size:15px;font-family:var(--font-display);resize:vertical;line-height:1.7}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tacount{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
.lockwarn{color:var(--amber);font-family:var(--font-mono);font-size:11px}
.demorow{display:flex;gap:8px;margin-top:10px;font-family:var(--font-mono);font-size:11px;align-items:center;color:var(--ink-faint);flex-wrap:wrap}
.demorow button{font-family:var(--font-mono);font-size:11px;background:none;border:1px solid var(--line-2);border-radius:4px;padding:4px 9px;color:var(--ink-soft)}
.demorow button:hover{border-color:var(--accent);color:var(--accent)}
/* tracks ledger */
.ledger{background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:14px 16px}
.ledger h4{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px;font-weight:700}
.track{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;margin-bottom:7px;font-size:12.5px;transition:.3s var(--ease);opacity:.62}
.track.lit{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.track .tk{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);display:block;font-weight:700}
.track .ck{margin-left:auto;color:var(--accent);font-weight:700}
.ledger .cap{font-family:var(--font-display);font-style:italic;font-size:11.5px;color:var(--ink-faint);margin-top:6px}
.labtable{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px;margin:8px 0}
.labtable caption{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:8px 0 4px}
.labtable th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);border-bottom:1px solid var(--line-2);padding:5px 8px}
.labtable td{padding:6px 8px;border-bottom:1px solid var(--line)}
.flagpill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px}
.flagpill.H{background:var(--danger-soft);color:var(--danger)}
.flagpill.L{background:var(--blue);color:#fff;background:rgba(58,95,122,.15);color:var(--blue)}
.ordered{color:var(--accent);font-weight:700}
.notreq{color:var(--ink-faint);font-style:italic;font-family:var(--font-display)}
.findingrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:5px;margin-bottom:7px;cursor:pointer;font-size:13px}
.findingrow:hover{border-color:var(--accent)}
.findingrow .lb{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent)}
.patientcard{background:linear-gradient(180deg,var(--paper-2),var(--card));border:1px solid var(--line-2);border-radius:9px;padding:22px 24px;text-align:center;margin-bottom:16px}
.patientcard .who{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.patientcard .say{font-family:var(--font-display);font-size:21px;line-height:1.5;font-style:italic;margin:12px auto;max-width:34ch}
/* grading interstitial */
.layer{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);opacity:.4;transition:.4s var(--ease);margin-bottom:10px}
.layer.on{opacity:1;border-color:var(--accent)}.layer.ok{opacity:1}
.layer .tk{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.layer.ok .tk{background:var(--green);color:#fff;border-color:var(--green)}
.layer.on .tk{background:var(--accent);color:#fff;border-color:var(--accent)}
.layer .t{font-family:var(--font-display);font-size:15px;font-weight:700}.layer .d{font-size:12px;color:var(--ink-faint)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* report */
.verdictband{border-radius:8px;padding:20px 24px;border:1px solid;position:relative}
.verdictband h2{font-size:24px;margin:0 0 4px}
.verdictband .sm{font-size:14px;font-family:var(--font-display)}
.scorechip{position:absolute;top:18px;right:22px;font-family:var(--font-mono);font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--paper);border:1px solid var(--line-2)}
.vb-safe{background:var(--green-soft);border-color:var(--green);color:#2f5127}
.vb-risky{background:var(--amber-soft);border-color:var(--amber);color:#7a5210}
.vb-hollow{background:var(--accent-soft);border-color:var(--accent);color:#0c4a46}
.vb-unsafe{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.metric{margin:12px 0}
.metric .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.metric .top b{font-weight:600}.metric .top span{font-family:var(--font-mono);font-size:12px}
.bar{height:8px;background:rgba(38,34,27,.09);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;transition:width .8s var(--ease)}
.dangerrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dangerrow:last-child{border:none}
.dangerrow .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px}
.ic.ok{background:var(--green)}.ic.no{background:var(--danger)}.ic.rec{background:var(--amber)}
.capsule{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-display);font-style:italic;margin-top:3px}
.evidence{background:#fffdf7;border:1px solid var(--line);border-radius:6px;padding:15px;font-family:var(--font-display);font-size:14.5px;line-height:1.9;white-space:normal}
.evstage{margin-bottom:14px}
.evstage .eh{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
mark{padding:1px 3px;border-radius:3px;background:transparent;cursor:help}
mark.dx{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
mark.ddx{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
mark.inv{background:rgba(58,95,122,.14);box-shadow:inset 0 -2px 0 var(--blue)}
mark.rx{background:var(--green-soft);box-shadow:inset 0 -2px 0 var(--green)}
mark.trk{background:rgba(138,131,113,.16);box-shadow:inset 0 -2px 0 var(--ink-faint)}
mark.neg{opacity:.65;text-decoration:line-through;text-decoration-color:var(--danger);box-shadow:none;background:var(--danger-soft)}
mark.assert{background:transparent;box-shadow:none;border-bottom:2px dotted var(--amber)}
mark.jarg{background:var(--danger-soft);box-shadow:inset 0 -2px 0 var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono)}
.legend span{display:flex;align-items:center;gap:5px}
.lgd{width:11px;height:11px;border-radius:2px;display:inline-block}
.narr .blk{padding:12px 15px;border-radius:5px;margin-bottom:10px;font-size:14px;border-left:3px solid var(--line-2);background:var(--paper-2);font-family:var(--font-display)}
.narr .win{border-left-color:var(--green)}.narr .gap{border-left-color:var(--amber)}
.narr b{display:block;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;color:var(--ink-faint);font-weight:700}
.profprose{font-family:var(--font-display);font-size:15px;line-height:1.7}
.profprose p{margin:0 0 11px}
.disclaimer{font-size:11.5px;color:var(--ink-faint);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:11px 14px;margin-top:10px}
.walked{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wchip{font-size:12px;font-family:var(--font-mono);padding:5px 11px;border-radius:20px;border:1px solid var(--danger);color:var(--danger);background:var(--danger-soft)}
.followbox{border:1px solid var(--accent);border-radius:7px;padding:16px 18px;background:var(--accent-soft)}
.followbox .q{font-family:var(--font-display);font-size:16px;font-style:italic;margin-bottom:10px}
.recovered{color:var(--amber);font-weight:700;font-family:var(--font-mono);font-size:11px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--card);border:1px solid var(--line-2);border-radius:7px;padding:16px 18px}
.tile .v{font-family:var(--font-mono);font-size:28px;font-weight:700;line-height:1;letter-spacing:-1px}
.tile .k{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);margin-top:5px;font-weight:700}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar .lbl{flex:0 0 44%;color:var(--ink-soft)}
.hbar .lbl .comp{margin-left:5px}
.hbar .track2{flex:1;height:16px;background:rgba(38,34,27,.07);border-radius:20px;overflow:hidden}
.hbar .track2>i{display:block;height:100%;background:var(--danger);border-radius:20px}
.hbar .num{flex:0 0 42px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--ink-faint)}
.histo{display:flex;align-items:stretch;gap:6px;height:130px;margin-top:12px}
.histo .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.histo .col>i{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.histo .col .cl{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint)}
.scatterwrap{position:relative;width:100%;max-width:560px;margin:12px auto}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:20px;flex-wrap:wrap}
.tabbar button{background:none;border:none;padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
.reviewrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:13px}
.reviewrow:hover{border-color:var(--accent)}
.reviewrow.live{border-color:var(--accent);background:var(--accent-soft)}
.roll{font-family:var(--font-mono);font-weight:700;flex:0 0 90px}
.slider{width:100%}
.footer{color:var(--ink-faint);font-size:11.5px;text-align:center;margin-top:34px;padding-top:18px;border-top:1px solid var(--line-2)}
.footer .vbadge{margin-top:8px}
/* demo overlay */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:14px;padding:12px 18px;box-shadow:0 -10px 30px -18px rgba(0,0,0,.6)}
.demobar .cap{flex:1;font-family:var(--font-display);font-size:14px}
.demobar .st{font-family:var(--font-mono);font-size:11px;opacity:.7}
.demobar button{background:var(--paper);color:var(--ink);border:none;border-radius:5px;padding:7px 14px;font-weight:700;font-size:13px}
.demobar button:disabled{opacity:.4}
.demobar .x{background:none;color:var(--paper);text-decoration:underline;font-weight:400}
.modal{position:fixed;inset:0;z-index:70;background:rgba(38,34,27,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modalcard{background:var(--card);border-radius:9px;padding:24px;max-width:460px;width:100%}
.mobtab{display:none}
@media(max-width:820px){
  .grid2,.grid3,.doors,.steps,.collegestrip{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .enc{grid-template-columns:1fr}
  .rail{position:static;display:flex;overflow-x:auto;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
  .railstep{padding:4px 0;white-space:nowrap;font-size:12px}
  .nav{display:none}
  .appbar{height:52px}
  .wrap{padding-bottom:76px}
  .mobtab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line-2)}
  .mobtab a{flex:1;text-align:center;padding:11px 4px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);text-decoration:none;font-weight:700}
  .mobtab a.on{color:var(--accent)}
  .scorechip{position:static;display:inline-block;margin-top:8px}
}
@media(max-width:560px){
  .appbar{padding:0 12px;gap:10px}
  .brandmark{gap:8px}
  .userchip{gap:7px}
  .userchip .small{display:none}
}
@media(max-width:400px){
  .userchip .rolebadge{display:none}
  .wordmark small{display:none}
}
@media print{
  .appbar,.mobtab,.demobar,.tabbar,.btn,.footer .vbadge,.row{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ccc}
}

<body>
<div id="app"></div>
<script>
"use strict";
/* ==================================================================
   FOLLOW THE TRACKS — POC v2 (single-file, vanilla, deterministic)
   The grading engine is a deterministic in-browser stand-in for the
   production language examiner. No network, no libraries.
   ================================================================== */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}


/* ---------------- persistence (sandbox-safe) ---------------- */
var MEM={};
var LS=(function(){try{var k="__ftt_probe__";window.localStorage.setItem(k,"1");window.localStorage.removeItem(k);return window.localStorage;}catch(e){return null;}})();
function lsGet(key){try{if(LS){var v=LS.getItem(key);return v==null?null:JSON.parse(v);}}catch(e){}return MEM[key]!=null?MEM[key]:null;}
function lsSet(key,val){MEM[key]=val;try{if(LS)LS.setItem(key,JSON.stringify(val));}catch(e){}}
var K_ATT="ftt.attempts.v2", K_AUTH="ftt.authored.v1";

/* ---------------- global jargon lexicon (plain equivalents) ---------------- */
var JARGON={
 "embolism":"a blood clot that travelled","embolus":"a travelling blood clot","emboli":"travelling blood clots",
 "thrombus":"a blood clot","thrombosis":"a blood clot forming","thromboembolism":"a travelling blood clot",
 "anticoagulation":"blood-thinning medicine","anticoagulant":"blood-thinning medicine","anticoagulants":"blood-thinning medicine",
 "hypoxia":"low oxygen in the blood","hypoxic":"short of oxygen","hypoxaemia":"low oxygen in the blood",
 "tachycardia":"a fast heart rate","tachypnoea":"fast breathing","tachypnea":"fast breathing",
 "infarction":"tissue dying from lack of blood","infarct":"an area of dead tissue",
 "ischaemia":"not enough blood supply","ischemia":"not enough blood supply","ischaemic":"starved of blood",
 "myocardial":"of the heart muscle","pleuritic":"pain worse on breathing in",
 "petechiae":"tiny red spots from bleeding under the skin","petechial":"tiny red spots under the skin",
 "meningitis":"swelling of the lining of the brain","meningococcal":"a serious brain-lining infection",
 "septicaemia":"germs spreading in the blood","septicemia":"germs spreading in the blood","sepsis":"the body overwhelmed by infection",
 "photophobia":"discomfort in bright light","reperfusion":"restoring blood flow","revascularisation":"restoring blood flow",
 "thrombolysis":"clot-dissolving medicine","diaphoresis":"heavy sweating","dyspnoea":"breathlessness","dyspnea":"breathlessness",
 "haemoptysis":"coughing up blood","necrosis":"tissue death","hypotension":"low blood pressure","hypotensive":"low blood pressure",
 "lactate":"a marker of poor blood flow","perfusion":"blood flow to tissues","occlusion":"a blockage",
 "stenosis":"a narrowing","empirical":"started before tests confirm it","parenteral":"given by injection",
 "prophylaxis":"prevention treatment","arrhythmia":"an abnormal heart rhythm",
 "hypoglycaemia":"low blood sugar","dextrose":"sugar solution"
};

/* ---------------- tokenizer (raw offsets preserved) ---------------- */
function stemWord(w){var suf=["ing","ed","es","s"];for(var i=0;i<suf.length;i++){var s=suf[i];if(w.length-s.length>=3 && w.slice(-s.length)===s)return w.slice(0,w.length-s.length);}return w;}
function tokenize(raw){raw=String(raw==null?"":raw);var toks=[],re=/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g,m;while((m=re.exec(raw))){var text=m[0],start=m.index,norm=text.toLowerCase().replace(/['’]/g,"");toks.push({text:text,norm:norm,stem:stemWord(norm),start:start,end:start+text.length});}return toks;}
var STOP={a:1,an:1,the:1,of:1,in:1,on:1,to:1,his:1,her:1,their:1,my:1,is:1,and:1,with:1,into:1,at:1,from:1,for:1,he:1,she:1,it:1,this:1,that:1,as:1,be:1,i:1,would:1};

/* build synonym token structures once per concept */
function synStruct(str){var t=tokenize(str);return {raw:str,toks:t.map(function(x){return {norm:x.norm,stem:x.stem};})};}

/* ---------------- clause assignment ---------------- */
var BREAKW={but:1,however:1,although:1,though:1,whereas:1};
function assignClauses(raw,toks){var cid=0;for(var i=0;i<toks.length;i++){if(i>0){var gap=raw.slice(toks[i-1].end,toks[i].start);if(/[.;:!?\n]/.test(gap))cid++;else if(BREAKW[toks[i].norm])cid++;}toks[i].clause=cid;}}

/* ---------------- cue definitions (tokenized norm arrays) ---------------- */
var NEG_CUES=[["no"],["not"],["without"],["denies"],["denied"],["deny"],["unlikely"],["doubt"],["never"],["negative"],["cannot","be"],["can","not"],["isnt"],["wasnt"],["arent"],["absence"],["absent"],["nil"]];
var CON_CUES=[["rule","out"],["ruled","out"],["rules","out"],["ruling","out"],["exclude"],["excluded"],["excluding"],["consider"],["considered"],["considering"],["differential"],["differentials"],["ddx"],["versus"],["vs"],["worry","about"],["worried","about"],["must","exclude"],["r","o"]];
var CONN_CUES=[["because"],["given"],["since"],["suggests"],["suggest"],["suggested"],["points"],["therefore"],["due"],["view"],["consistent"],["indicates"],["indicate"],["hence"],["explains"],["classic"],["typical"],["fits"],["fit"],["cause"],["causes"],["caused"],["reason"]];
var CAUSAL_CUES=[["because"],["so"],["since"],["which","means"],["that","is","why"],["so","that"],["means"]];

function findCues(toks,cues){var out=[];for(var i=0;i<toks.length;i++){for(var c=0;c<cues.length;c++){var cu=cues[c];if(i+cu.length>toks.length)continue;var ok=true;for(var j=0;j<cu.length;j++){if(toks[i+j].norm!==cu[j]){ok=false;break;}}if(ok)out.push({start:i,end:i+cu.length-1,clause:toks[i].clause});}}return out;}
function cueNear(occs,hit,win,forward){for(var i=0;i<occs.length;i++){var o=occs[i];if(o.clause!==hit.clause)continue;var d=hit.tokenStart-o.end;if(forward){if(d>=1&&d<=win)return true;}else{if(d>=-win&&d<=win)return true;}}return false;}
function connNear(toks,hit,win){var c=hit.clause,lo=Math.max(0,hit.tokenStart-win),hi=Math.min(toks.length-1,hit.tokenEnd+win);for(var k=lo;k<=hi;k++){if(toks[k].clause!==c)continue;for(var q=0;q<CONN_CUES.length;q++){var cu=CONN_CUES[q];if(k+cu.length>toks.length)continue;var ok=true;for(var j=0;j<cu.length;j++){if(toks[k+j].norm!==cu[j]){ok=false;break;}}if(ok)return true;}}return false;}

/* ---------------- matcher ---------------- */
function findWindow(posLists,win){for(var a=0;a<posLists[0].length;a++){var anchor=posLists[0][a],mn=anchor,mx=anchor,ok=true;for(var k=1;k<posLists.length;k++){var best=-1,bd=1e9;for(var p=0;p<posLists[k].length;p++){var d=Math.abs(posLists[k][p]-anchor);if(d<bd){bd=d;best=posLists[k][p];}}if(best<0){ok=false;break;}if(best<mn)mn=best;if(best>mx)mx=best;}if(ok&&mx-mn<=win)return [mn,mx];}return null;}
function matchConcept(toks,con){var hits=[];con._syn.forEach(function(st){if(st.toks.length===1){var s=st.toks[0];for(var i=0;i<toks.length;i++){if(toks[i].norm===s.norm||(toks[i].norm.length>=4&&s.stem.length>=4&&toks[i].stem===s.stem)){hits.push({tokenStart:i,tokenEnd:i,synonym:st.raw,quality:toks[i].norm===s.norm?"exact":"stem"});}}}else{var n=st.toks.length;for(var i2=0;i2+n<=toks.length;i2++){var ok=true;for(var j=0;j<n;j++){if(toks[i2+j].norm!==st.toks[j].norm){ok=false;break;}}if(ok)hits.push({tokenStart:i2,tokenEnd:i2+n-1,synonym:st.raw,quality:"exact"});}var content=st.toks.filter(function(t){return !STOP[t.norm];});if(content.length>=2){var posLists=content.map(function(t){var arr=[];for(var k=0;k<toks.length;k++){if(toks[k].stem===t.stem||toks[k].norm===t.norm)arr.push(k);}return arr;});if(posLists.every(function(a){return a.length;})){var w=findWindow(posLists,6);if(w)hits.push({tokenStart:w[0],tokenEnd:w[1],synonym:st.raw,quality:"proximity"});}}}});return hits;}
function mergeHits(hits){if(!hits.length)return [];hits=hits.slice().sort(function(a,b){return a.tokenStart-b.tokenStart||b.tokenEnd-a.tokenEnd;});var out=[hits[0]];for(var i=1;i<hits.length;i++){var last=out[out.length-1],h=hits[i];if(h.tokenStart<=last.tokenEnd){if(h.tokenEnd>last.tokenEnd)last.tokenEnd=h.tokenEnd;var rank={exact:3,proximity:2,stem:1};if(rank[h.quality]>rank[last.quality]){last.quality=h.quality;last.synonym=h.synonym;}}else out.push(h);}return out;}

/* analyse one stage's text: hits per concept with polarity + raw offsets */
function analyseStage(caseObj,rawText){var toks=tokenize(rawText);assignClauses(rawText,toks);var neg=findCues(toks,NEG_CUES),con=findCues(toks,CON_CUES);var byConcept={};caseObj.concepts.forEach(function(c){var merged=mergeHits(matchConcept(toks,c));merged.forEach(function(h){h.conceptId=c.id;h.cat=c.cat;h.clause=toks[h.tokenStart].clause;h.negated=cueNear(neg,h,5,true);h.considered=cueNear(con,h,5,false);h.rawStart=toks[h.tokenStart].start;h.rawEnd=toks[h.tokenEnd].end;h.hasReason=connNear(toks,h,12);});if(merged.length)byConcept[c.id]=merged;});return {toks:toks,byConcept:byConcept};}


/* ============================================================
   QUESTION LAYER (additive) — powers the narrative VHL-003 case.
   Reuses the primitives above; never touches gradeAttempt.
   ============================================================ */
/* Q_CONN: superset of CONN_CUES for the depth questions */
var Q_CONN_EXTRA=[["increases"],["increase"],["stimulates"],["stimulate"],["releases"],["release"],
 ["response"],["responds"],["drives"],["drive"],["produces"],["produce"],["promotes"],["promote"],
 ["activates"],["activate"],["leads"],["lead"],["results"],["result"],["makes"],["make"],["means"],
 ["when"],["which"],["if"],["unless"],["as"],["to"],["into"],["so"]];
var Q_CONN=CONN_CUES.concat(Q_CONN_EXTRA);
function connNearQ(toks,hit,win){var c=hit.clause,lo=Math.max(0,hit.tokenStart-win),hi=Math.min(toks.length-1,hit.tokenEnd+win);
 for(var k=lo;k<=hi;k++){if(toks[k].clause!==c)continue;for(var q=0;q<Q_CONN.length;q++){var cu=Q_CONN[q];if(k+cu.length>toks.length)continue;var ok=true;for(var j=0;j<cu.length;j++){if(toks[k+j].norm!==cu[j]){ok=false;break;}}if(ok)return true;}}return false;}

var HONESTY_RE=/(not come across|haven'?t (met|come across|encountered)|never (heard|came across)|fails my memory|don'?t know|do not know|not sure|can'?t recall|cannot recall|unfamiliar|no idea|blanking)/i;

/* ad-hoc concept for a question (no case.concepts bloat) */
function qConcept(id,syns){return {id:id,synonyms:syns,_syn:syns.map(synStruct)};}
function analyseAnswer(rawText,concepts){
 var toks=tokenize(rawText);assignClauses(rawText,toks);
 var neg=findCues(toks,NEG_CUES),con=findCues(toks,CON_CUES);var by={};
 concepts.forEach(function(c){var m=mergeHits(matchConcept(toks,c));m.forEach(function(h){
   h.conceptId=c.id;h.clause=toks[h.tokenStart].clause;
   h.negated=cueNear(neg,h,5,true);h.considered=cueNear(con,h,5,false);
   h.rawStart=toks[h.tokenStart].start;h.rawEnd=toks[h.tokenEnd].end;
   h.reasoned=connNearQ(toks,h,12);});
   if(m.length)by[c.id]=m;});
 return {toks:toks,byConcept:by};
}
function cleanHit(by,id){var hs=by[id]||[];return hs.some(function(h){return !h.negated&&!h.considered;});}

/* star verdict for one question item */
function gradeQuestion(item,answer){
 answer=String(answer==null?"":answer);
 var out={id:item.id,recall:!!item.recall,w:item.w,verdict:null,stars:null,frac:0,assertionFlag:false,reasoned:false,feedback:""};
 if(!answer.trim()){out.verdict="blank";out.stars=0;out.frac=0;out.feedback="No answer given.";return out;}
 var pool=(item.core||[]).slice();
 if(item.refine)pool.push(item.refine);
 if(item.exclude)pool.push(item.exclude);
 (item.pivot||[]).forEach(function(c){pool.push(c);});
 (item.contra||[]).forEach(function(c){pool.push(c);});
 var an=analyseAnswer(answer,pool),by=an.byConcept;
 var wrongAssertion=(item.contra||[]).some(function(c){return cleanHit(by,c.id);});
 // core coverage (computed early so the honest-gap short-circuit cannot override a substantively correct answer)
 var coreHits=(item.core||[]).filter(function(c){return cleanHit(by,c.id);});
 var coreHit=coreHits.length>0;
 // STEP 0 — honest gap (only when there is no substantive core coverage)
 if(HONESTY_RE.test(answer) && !wrongAssertion && !coreHit){
   out.verdict="gap";out.stars=null;out.frac=0.65;out.assertionFlag=false;out.feedback=item.feedbackGap||"New concept — worth learning.";return out;}
 // STEP 1 — core coverage
 var refineHit=item.refine?cleanHit(by,item.refine.id):false;
 var reasoned=item.recall?true:(item.core||[]).some(function(c){var hs=by[c.id]||[];return hs.some(function(h){return !h.negated&&!h.considered&&h.reasoned;});});
 out.reasoned=reasoned;
 // RECALL questions
 if(item.recall){
   var fact=(item.core||[]).some(function(c){return cleanHit(by,c.id);});
   out.verdict=fact?"star":"blank";out.stars=fact?5:0;out.frac=fact?1:0;
   out.feedback=fact?item.feedback5:(item.feedbackGap||"Not named.");return out;}
 // wrong assertion
 if(wrongAssertion){out.verdict="wrong";out.stars=0;out.frac=0;out.feedback="Contradicts the evidence.";return out;}
 // SPECIAL: Q2 exclusion-of-reasoning — count investigations from RAW hits (a leading
 // "no evidence of hypoxia" spuriously negates a trailing normal-test mention across the comma).
 if(item.special==="exclusion"){
   var nInv=(item.core||[]).filter(function(c){return (by[c.id]||[]).length>0;}).length;
   var exHit=item.exclude?cleanHit(by,item.exclude.id):false;
   if(nInv>=1 && exHit){out.verdict="star";out.stars=5;out.frac=1;out.feedback=item.feedback5;return out;}
   if(nInv>=2){out.verdict="star";out.stars=4;out.frac=0.8;out.feedback=item.feedback4;return out;}
   // fall through to generic ladder
 }
 // SPECIAL: Q3 contradiction reward
 if(item.special==="contradiction"){
   var epoHit=cleanHit(by,"epo"), pivotHit=(item.pivot||[]).some(function(c){return cleanHit(by,c.id);});
   if(epoHit && pivotHit && reasoned){out.verdict="star";out.stars=5;out.frac=1;out.feedback=item.feedback5;return out;}
 }
 // GENERIC reasoning ladder
 if(!coreHit){out.verdict="star";out.stars=1;out.frac=0.2;out.feedback="Only a tangential idea appears — name the core mechanism.";return out;}
 if(coreHit && !reasoned){out.verdict="assert";out.stars=2;out.frac=0.4;out.assertionFlag=true;out.feedback="Concepts named without linking them — state the reason.";return out;}
 if(item.refine && !refineHit){out.verdict="star";out.stars=4;out.frac=0.8;out.feedback=item.feedback4||item.feedback5;return out;}
 var enough=(item.core.length<=1)||coreHits.length>=2;
 if(enough){out.verdict="star";out.stars=5;out.frac=1;out.feedback=item.feedback5;return out;}
 out.verdict="star";out.stars=3;out.frac=0.6;out.feedback=item.feedback4||item.feedback5;return out;
}

/* whole-question-set wrapper: Overall /10 + bars + flags */
function gradeQuestions(caseObj,ans){
 ans=ans||{};
 var qs=caseObj.questions||[], res={}, reasonEarned=0, recallEarned=0, earned100=0, assertionCount=0, honestGapCount=0;
 qs.forEach(function(item){
   var r=gradeQuestion(item,ans[item.id]||"");res[item.id]=r;
   var pts=r.frac*item.w; earned100+=pts;
   if(item.recall)recallEarned+=pts; else reasonEarned+=pts;
   if(!item.recall && r.assertionFlag)assertionCount++;
   if(r.verdict==="gap")honestGapCount++;
 });
 var overall10=Math.round(earned100)/10;
 var stk={patient:ans.patient||"",workup:ans.workup||"",results:ans.results||"",management:ans.management||"",bedside:ans.bedside||""};
 var g=gradeAttempt(caseObj,stk);
 var flags={anchored:g.flags.anchored,cleanRevision:g.flags.cleanRevision,assertionCapped:assertionCount>=3};
 return {q:res, earned100:earned100, overall10:overall10,
   reasoningPct:Math.round(reasonEarned/90*100), recallPct:Math.round(recallEarned/10*100),
   assertionCount:assertionCount, honestGapCount:honestGapCount, flags:flags, engine:g};
}


/* ================= SCORING ENGINE ================= */
function firstMention(an,cid){var h=an.byConcept[cid];return (h&&h.length)?h[0].tokenStart:Infinity;}

function scoreOrder(item,an){var fi=firstMention(an,item.first);var bi=Infinity;(item.before||[]).forEach(function(c){bi=Math.min(bi,firstMention(an,c));});var earned=0;if(fi<Infinity && (bi===Infinity || fi<bi))earned=item.w;return {id:item.id,w:item.w,earned:earned,dim:item.dim,satisfied:earned>0?[item.first]:[],flagged:[],concepts:[item.first].concat(item.before||[]),mode:item.mode};}
function scorePathOrder(item,an){var ti=firstMention(an,item.target);var dangers=item.concepts||[],before=0,present=0;dangers.forEach(function(c){var di=firstMention(an,c);if(di<Infinity){present++;if(di<ti)before++;}});var frac=dangers.length?before/dangers.length:0;return {id:item.id,w:item.w,earned:item.w*frac,dim:item.dim,satisfied:[],flagged:[],concepts:dangers,mode:item.mode,present:present};}

function scoreItem(item,SA,ctx){
  var an=SA[item.stage]||{byConcept:{},toks:[]};
  if(item.mode==="order")return scoreOrder(item,an);
  if(item.mode==="pathorder")return scorePathOrder(item,an);
  var concepts=item.concepts||[],per={},sat=[],flg=[];
  concepts.forEach(function(cid){
    var hits=an.byConcept[cid]||[];
    var clean=hits.filter(function(h){return !h.negated && !h.considered;});
    var satisfied=(item.mode==="consider"||item.mode==="avoid")?hits.length>0:clean.length>0;
    var credit=satisfied?1:0;
    if(satisfied){var f=hits[0];if(f.rawStart>1400)credit*=0.6;}
    // §5.8: a credited diagnosis or management concept must carry a reason, in any mode.
    // Diagnostic/danger dims hold dx concepts; management dim holds treatment concepts.
    // Investigation (tests) is not reasoning-guarded.
    if(satisfied && (item.dim==="diagnostic"||item.dim==="danger"||item.dim==="management")){
      ctx.guardedTotal++;
      var pool=clean.length?clean:hits;
      var reasoned=pool.some(function(h){return h.hasReason;});
      if(!reasoned){credit*=0.5;flg.push(cid);ctx.flaggedTotal++;}
    }
    if(satisfied){sat.push(cid);ctx.creditedTotal++;}
    per[cid]=credit;
  });
  var earned;
  if(item.critical&&item.critical.length){
    var crit=item.critical,non=concepts.filter(function(c){return crit.indexOf(c)<0;});
    var cg=crit.reduce(function(s,c){return s+(per[c]||0);},0)/crit.length;
    var ng=non.length?non.reduce(function(s,c){return s+(per[c]||0);},0)/non.length:0;
    earned=item.w*(cg*0.75+(non.length?ng*0.25:cg*0.25));
  }else{
    var cov=concepts.length?concepts.reduce(function(s,c){return s+(per[c]||0);},0)/concepts.length:0;
    if(item.scattergunCap)cov=Math.min(cov,item.scattergunCap);
    earned=item.w*cov;
  }
  return {id:item.id,w:item.w,earned:earned,dim:item.dim,satisfied:sat,flagged:flg,concepts:concepts,mode:item.mode};
}

function leadingDx(caseObj,an){var best=null,bi=Infinity;caseObj.concepts.forEach(function(c){if(c.cat!=="dx")return;var hits=an.byConcept[c.id]||[];hits.forEach(function(h){if(h.negated)return;if(h.tokenStart<bi){bi=h.tokenStart;best=c.id;}});});return best;}
function dxCount(caseObj,an){var n=0;caseObj.concepts.forEach(function(c){if(c.cat!=="dx")return;var hits=an.byConcept[c.id]||[];if(hits.some(function(h){return !h.negated;}))n++;});return n;}

function scoreBedside(caseObj,text){
  var an=analyseStage(caseObj,text),toks=an.toks,bd=caseObj.bedside;
  var slots=bd.slots.map(function(sl){
    var satisfied=false,via=null;
    sl.concepts.forEach(function(cid){
      var hits=an.byConcept[cid]||[],con=caseObj.conceptById(cid);
      hits.forEach(function(h){
        if(h.negated)return;
        var jarg=false;for(var t=h.tokenStart;t<=h.tokenEnd;t++){if(JARGON[toks[t].norm])jarg=true;}
        var formal=(con.formal||[]).indexOf(h.synonym)>=0;
        if(!jarg && !(sl.plainRequired&&formal)){satisfied=true;if(!via)via={cid:cid,phrase:text.slice(h.rawStart,h.rawEnd),label:con.label};}
      });
    });
    return {id:sl.id,label:sl.label,satisfied:satisfied,via:via};
  });
  var nsat=slots.filter(function(s){return s.satisfied;}).length;
  var accuracy=bd.accuracyMax*(slots.length?nsat/slots.length:0);
  var jargonHits=[];toks.forEach(function(t){if(JARGON[t.norm])jargonHits.push({rawStart:t.start,rawEnd:t.end,term:t.norm,plain:JARGON[t.norm]});});
  var words=toks.length,sentences=(text.match(/[.!?]+/g)||[]).length||1,meanLen=words/sentences;
  var simp=bd.simplicityMax-1.5*jargonHits.length;
  if(words>4&&(meanLen<6||meanLen>22))simp-=1;
  var causal=findCues(toks,CAUSAL_CUES).length;if(causal>=2)simp+=1;
  simp=Math.max(0,Math.min(bd.simplicityMax,simp));
  if(words<6){accuracy=Math.min(accuracy,bd.accuracyMax*0.2);simp=Math.min(simp,2);}
  return {slots:slots,nsat:nsat,accuracy:accuracy,accuracyMax:bd.accuracyMax,simplicity:simp,simplicityMax:bd.simplicityMax,jargonHits:jargonHits,analysis:an,words:words};
}

function gradeAttempt(caseObj,stageTexts){
  var SA={};["patient","workup","results","management"].forEach(function(sid){SA[sid]=analyseStage(caseObj,stageTexts[sid]||"");});
  var ctx={flaggedTotal:0,creditedTotal:0,guardedTotal:0};
  var items=caseObj.rubric.map(function(it){return scoreItem(it,SA,ctx);});
  var bedside=scoreBedside(caseObj,stageTexts.bedside||"");
  var byId={};items.forEach(function(r){byId[r.id]=r;});
  // dimensions
  var DIM={diagnostic:{max:0,earned:0,label:"Diagnostic accuracy"},danger:{max:0,earned:0,label:"Danger-first reasoning"},investigation:{max:0,earned:0,label:"Investigation choice"},management:{max:0,earned:0,label:"Management safety"}};
  items.forEach(function(r){if(DIM[r.dim]){DIM[r.dim].max+=r.w;DIM[r.dim].earned+=r.earned;}});
  // revision / bias flags
  var leadD1=leadingDx(caseObj,SA.patient),leadD3=leadingDx(caseObj,SA.results);
  var rev=caseObj.revision||{},contra=rev.contradicted||[],target=caseObj.target;
  var closeDiff=(rev.close||[]);
  var anchored=leadD3&&contra.indexOf(leadD3)>=0;
  var cleanRevision=leadD1&&contra.indexOf(leadD1)>=0&&leadD3===target;
  var held=leadD1===target&&leadD3===target;
  var drifted=leadD3&&leadD3!==target&&contra.indexOf(leadD3)<0&&closeDiff.indexOf(leadD3)<0;
  var d1count=dxCount(caseObj,SA.patient);
  var s1txt=(stageTexts.patient||"").toLowerCase();
  var closedEarly=d1count<2 && /(the diagnosis is|this is clearly|obviously|definitely|no doubt)/.test(s1txt) && firstMention(SA.workup,rev.discriminator)===Infinity;
  // assertion cap
  var assertionCapped=ctx.flaggedTotal>=2 && ctx.flaggedTotal>0.5*Math.max(1,ctx.guardedTotal);
  // apply diagnostic caps
  if(anchored)DIM.diagnostic.earned=Math.min(DIM.diagnostic.earned,0.40*DIM.diagnostic.max);
  if(assertionCapped)DIM.diagnostic.earned=Math.min(DIM.diagnostic.earned,0.55*DIM.diagnostic.max);
  // recompute total from (possibly capped) dims + bedside
  var knowledgeEarned=DIM.diagnostic.earned+DIM.danger.earned+DIM.investigation.earned+DIM.management.earned;
  var expEarned=bedside.accuracy+bedside.simplicity;
  var pct=Math.round(knowledgeEarned+expEarned);
  var knowledge=Math.round(knowledgeEarned/80*100);
  var understanding=Math.round(expEarned/20*100);
  // critical miss (safety): any critical mgmt concept unsatisfied
  var mgmtItem=byId["mgmt"];var criticalMiss=false;
  caseObj.rubric.forEach(function(it){if((it.mode==="do")&&it.critical&&it.dim==="management"){var r=byId[it.id];it.critical.forEach(function(c){if(r.satisfied.indexOf(c)<0)criticalMiss=true;});}});
  var targetReached=(byId["dx-final"]&&byId["dx-final"].satisfied.indexOf(target)>=0);
  var hasFlags=!!(anchored||drifted||closedEarly||assertionCapped);
  var dims5=[
    {key:"Diagnostic accuracy",v:Math.round(DIM.diagnostic.earned/DIM.diagnostic.max*100),plain:"Did you commit to the right diagnosis?"},
    {key:"Danger-first reasoning",v:Math.round(DIM.danger.earned/DIM.danger.max*100),plain:"Did the killers come first?"},
    {key:"Investigation choice",v:Math.round(DIM.investigation.earned/DIM.investigation.max*100),plain:"Right tests, in the right order?"},
    {key:"Management safety",v:Math.round(DIM.management.earned/DIM.management.max*100),plain:"Was the immediate plan safe?"},
    {key:"Explanation",v:understanding,plain:"Could the patient understand you?"}
  ];
  var g={caseId:caseObj.id,SA:SA,items:items,byId:byId,bedside:bedside,DIM:DIM,dims5:dims5,pct:pct,knowledge:knowledge,understanding:understanding,
    flags:{anchored:anchored,cleanRevision:cleanRevision,held:held,drifted:drifted,closedEarly:closedEarly,assertionCapped:assertionCapped},
    hasFlags:hasFlags,criticalMiss:criticalMiss,targetReached:targetReached,leadD1:leadD1,leadD3:leadD3,
    expAccPct:Math.round(bedside.accuracy/bedside.accuracyMax*100)};
  g.verdict=verdictOf(g);
  g.timeline=buildTimeline(caseObj,g);
  g.trackInfo=trackAnalysis(caseObj,SA);
  g.gaps=buildGaps(caseObj,g);
  g.followup=pickFollowup(caseObj,g);
  return g;
}

function verdictOf(g){
  if(g.criticalMiss||g.flags.anchored)return {cls:"vb-unsafe",t:"Unsafe — major gaps",s:g.flags.anchored?"You locked onto a diagnosis the evidence argued against.":"A time-critical, safety step was missing."};
  if(g.flags.assertionCapped)return {cls:"vb-risky",t:"Right answer, risky route",s:"Diagnoses and treatments were asserted without reasons — those concepts were capped. Name the reason, not just the label.",capped:true};
  if(g.knowledge>=70 && g.expAccPct<50)return {cls:"vb-hollow",t:"Knows it, can't say it",s:"Correct on paper, but the patient would not have understood you."};
  if(g.pct>=75 && !g.hasFlags)return {cls:"vb-safe",t:"Safe and systematic",s:"Dangers named first, right diagnosis committed, safe plan, explained plainly."};
  if(g.targetReached && g.hasFlags)return {cls:"vb-risky",t:"Right answer, risky route",s:"You reached the diagnosis, but the reasoning path had a wobble worth fixing."};
  if(g.pct<40)return {cls:"vb-unsafe",t:"Unsafe — major gaps",s:"The thread was dropped early — read the timeline to see where."};
  return {cls:"vb-risky",t:"Right answer, risky route",s:"Sound in places, but the reasoning path had gaps."};
}

function buildTimeline(caseObj,g){
  var stages=["patient","workup","results"];
  var dx=caseObj.concepts.filter(function(c){return c.cat==="dx";});
  var nodes=caseObj.stages.map(function(s){return s.title;});
  var entries=[];
  dx.forEach(function(c){
    var firstStage=-1;
    for(var i=0;i<stages.length;i++){var h=g.SA[stages[i]].byConcept[c.id];if(h&&h.some(function(x){return !x.negated;})){firstStage=i;break;}}
    var committedResults=(g.SA.results.byConcept[c.id]||[]).some(function(x){return !x.negated&&!x.considered;});
    var raisedResults=(g.SA.results.byConcept[c.id]||[]).some(function(x){return !x.negated;});
    var mustNot=caseObj.rubric.some(function(it){return it.mode==="consider"&&(it.concepts||[]).indexOf(c.id)>=0;})||c.id===caseObj.target;
    if(firstStage>=0){
      entries.push({id:c.id,label:c.label,stage:firstStage,carried:committedResults,dropped:!raisedResults&&firstStage<2,isTarget:c.id===caseObj.target});
    }else if(mustNot){
      entries.push({id:c.id,label:c.label,stage:-1,ghost:true});
    }
  });
  return {nodes:nodes,entries:entries};
}

function trackAnalysis(caseObj,SA){
  var stages=["patient","workup","results","management"];
  var used=[],walked=[];
  (caseObj.tracks||[]).forEach(function(tr){
    var lit=false,referenced=false;
    stages.forEach(function(sid){
      var an=SA[sid],hits=an.byConcept[tr.conceptId]||[];
      hits.forEach(function(h){referenced=true;
        // co-occurs in same clause with a non-track rubric concept?
        for(var cid in an.byConcept){if(cid===tr.conceptId)continue;var cc=caseObj.conceptById(cid);if(!cc||cc.cat==="track")continue;an.byConcept[cid].forEach(function(o){if(o.clause===h.clause)lit=true;});}
      });
    });
    if(lit)used.push(tr);else if(!referenced)walked.push(tr);
  });
  return {used:used,walked:walked};
}

function buildGaps(caseObj,g){
  var gaps=[];
  caseObj.rubric.forEach(function(it){var r=g.byId[it.id];if(r.earned < r.w*0.5){gaps.push({id:it.id,label:itemLabel(it),capsule:it.capsule||"",w:it.w,earned:r.earned,cantMiss:!!it.cantMiss,safety:!!it.safety});}});
  g.bedside.slots.forEach(function(s){if(!s.satisfied){gaps.push({id:"slot-"+s.id,label:"At the bedside: "+s.label,capsule:"",bedside:true,w:g.bedside.accuracyMax/g.bedside.slots.length,earned:0});}});
  gaps.sort(function(a,b){return (b.w-b.earned)-(a.w-a.earned);});
  return gaps;
}

function pickFollowup(caseObj,g){
  var best=null,bestLost=-1;
  caseObj.rubric.forEach(function(it){if(!it.probe)return;var r=g.byId[it.id];var lost=it.w-r.earned;if(lost>bestLost){bestLost=lost;best={type:"examiner",itemId:it.id,q:it.probe,concepts:it.concepts||[],lost:lost,restore:0.5};}});
  g.bedside.slots.forEach(function(s){if(s.satisfied)return;var lost=g.bedside.accuracyMax/g.bedside.slots.length;if(lost>bestLost){bestLost=lost;best={type:"patient",slotId:s.id,q:caseObj.bedside.patientQuestions[s.id]||caseObj.bedside.patientQuestions.none,concepts:s.concepts,lost:lost,restore:0.6};}});
  if(!best){best={type:"patient",slotId:"none",q:caseObj.bedside.patientQuestions.none,concepts:[caseObj.target],lost:0,restore:0};}
  return best;
}

var COMMON=["first","and","the","give","start","done","test","the","then","also","next","now","with","from","have","this","that","he","she","it","pain","sign","time","list","case","said","only","some","more","most","very"];
function lintCase(c){
  var errors=[],warnings=[];
  var wsum=c.rubric.reduce(function(s,it){return s+(it.w||0);},0)+(c.bedside.weight||0);

  var ids={};c.concepts.forEach(function(con){ids[con.id]=1;});
  function chk(list,where){(list||[]).forEach(function(id){if(!ids[id])errors.push("Concept id '"+id+"' referenced by "+where+" does not exist.");});}
  c.rubric.forEach(function(it){chk(it.concepts,it.id);if(it.first)chk([it.first],it.id);chk(it.before,it.id);if(it.target)chk([it.target],it.id);});
  c.tracks.forEach(function(t){chk([t.conceptId],"track");});
  c.bedside.slots.forEach(function(s){chk(s.concepts,"bedside slot "+s.id);});
  if(c.revision){chk([c.revision.target],"revision");chk(c.revision.contradicted,"revision");if(c.revision.discriminator)chk([c.revision.discriminator],"revision");}

  var verdicts={};students.forEach(function(s){verdicts[s.verdictT]=(verdicts[s.verdictT]||0)+1;});
  return {N:N,students:students,mean:mean,pass:pass,buckets:buckets,killerMiss:killerMiss,itemMiss:itemMiss,verdicts:verdicts};
}

/* ================= self-test ================= */
function __selftest(){
  var A=[],pass=0;
  function ok(name,cond){A.push({name:name,ok:!!cond});if(cond)pass++;}
  function grade(id,t){return gradeAttempt(caseById(id),t);}
  CASES.forEach(function(c){var l=lintCase(c);ok("lint clean: "+c.id,l.errors.length===0);ok("weights=100: "+c.id,l.weightSum===100);});
  CASES.forEach(function(c){
    var g=grade(c.id,c.demo.strong);ok("strong>=75: "+c.id,g.pct>=75);
    var w=grade(c.id,c.demo.weak);ok("weak<=40: "+c.id,w.pct<=40);
    var gm=grade(c.id,c.demo.gamed);
    // §5.8/§5.9: a keyword-stuffed answer must be flagged AND must not earn a flattering verdict.
    // (Note: gamed cannot fall below weak+10 here — the investigation dimension legitimately credits a
    //  correct list of tests, which is not reasoning-guarded; so we assert the guard fired and the gap to strong.)
    ok("gamed capped: "+c.id,gm.flags.assertionCapped===true);
    ok("gamed not flattering: "+c.id,gm.verdict.cls!=="vb-safe"&&gm.verdict.cls!=="vb-hollow");
    ok("gamed<strong-20: "+c.id,gm.pct<g.pct-20);
  });
  // matcher precision
  var pe=caseById("PE-014");
  var an1=analyseStage(pe,"he has hypertension");ok("hypertension !credits pe",!(an1.byConcept["pe"]));
  var g2=grade("PE-014",{patient:"hypertension",workup:"",results:"",management:"",bedside:""});ok("hypertension dx-early 0",g2.byId["dx-early"].earned===0);
  var anR=analyseStage(pe,"pe ruled out, this is pneumonia");var peH=anR.byConcept["pe"]||[];ok("'pe ruled out' has hit",peH.length>0);ok("'pe ruled out' considered/neg",peH.every(function(h){return h.considered||h.negated;}));
  var gCommit=grade("PE-014",{patient:"",workup:"",results:"pe ruled out, this is pneumonia",management:"",bedside:""});ok("'pe ruled out' fails commit",gCommit.byId["dx-final"].earned===0);
  var gDo=grade("PE-014",{patient:"",workup:"",results:"",management:"i would not give heparin",bedside:""});ok("'not give heparin' fails do",gDo.byId["mgmt"].satisfied.indexOf("anticoag")<0);
  var anEx=analyseStage(pe,"I would exclude aortic dissection");var dH=(anEx.byConcept["dissection"]||[])[0];ok("exclude dissection credited",!!dH&&dH.considered);ok("dissection raw offset exact",!!dH&&"I would exclude aortic dissection".slice(dH.rawStart,dH.rawEnd).toLowerCase().indexOf("dissection")>=0);
  var bd=scoreBedside(pe,pe.demo.strong.bedside);ok("bedside plain satisfies 'what'",bd.slots.filter(function(s){return s.id==="what";})[0].satisfied);
  var bdJ=scoreBedside(pe,"you have a pulmonary embolism");ok("jargon fails plainRequired",!bdJ.slots.filter(function(s){return s.id==="what";})[0].satisfied);
  var anNeg=analyseStage(pe,"he denies haemoptysis. pulmonary embolism is likely");var peN=(anNeg.byConcept["pe"]||[])[0];ok("clause-boundary: pe not negated",!!peN&&!peN.negated);
  var gAvoid=grade("PE-014",pe.demo.strong);ok("avoid nsaids credited",gAvoid.byId["avoid"].earned>0);
  var gAnchor=grade("PE-014",{patient:"this is clearly pneumonia, a chest infection",workup:"give antibiotics",results:"still pneumonia, a chest infection",management:"antibiotics",bedside:"a chest infection"});ok("ANCHORED flagged",gAnchor.flags.anchored===true);
  var gRev=grade("PE-014",{patient:"probably pneumonia",workup:"d-dimer and ctpa",results:"actually a pulmonary embolism because the d-dimer is high and there is a dvt",management:"oxygen and heparin",bedside:"a clot in your lung"});ok("CLEAN REVISION flagged",gRev.flags.cleanRevision===true);
  ok("track lit (immobility)",gAvoid.trackInfo.used.some(function(t){return t.conceptId==="immobility";}));
  // determinism
  var d1=JSON.stringify(summ(grade("PE-014",pe.demo.strong)));var d2=JSON.stringify(summ(grade("PE-014",pe.demo.strong)));ok("deterministic",d1===d2);
  function summ(g){return {p:g.pct,d:g.dims5.map(function(x){return x.v;}),k:g.knowledge,u:g.understanding,f:g.flags};}
  // ===== VHL-003 question layer =====
  var vhl=caseById("VHL-003");
  if(vhl){
    var saba=gradeQuestions(vhl,vhl.demo.saba);
    var strong=gradeQuestions(vhl,vhl.demo.strong);
    var gm3=gradeQuestions(vhl,vhl.demo.gamed);
    ok("VHL Saba overall 8.5",saba.overall10===8.5);
    ok("VHL Saba in band",saba.overall10>=8.0&&saba.overall10<=9.0);
    ok("VHL strong perfect",strong.overall10>=9.5);
    ok("VHL Q4 honest gap not zero",saba.q.q4.verdict==="gap"&&saba.q.q4.frac>0);
    ok("VHL Q4 gap not gaming",saba.q.q4.assertionFlag===false);
    ok("VHL Q7 honest gap not zero",saba.q.q7.verdict==="gap"&&saba.q.q7.frac>0);
    ok("VHL Q7 gap no penalty & not gaming",saba.q.q7.assertionFlag===false);
    var q5item=vhl.questions.filter(function(x){return x.id==="q5";})[0];
    var an5a=gradeQuestion(q5item,"VHL binds to HIF in the presence of oxygen");
    ok("VHL Q5 no-hydroxylated=4",an5a.stars===4);
    var an5b=gradeQuestion(q5item,"prolyl hydroxylases hydroxylate HIF so VHL binds the hydroxylated HIF for proteasomal degradation");
    ok("VHL Q5 hydroxylated=5",an5b.stars===5);
    ok("VHL Q3 contradiction rewarded",saba.q.q3.stars===5);
    ok("VHL Q2 exclusion reasoning=5",saba.q.q2.stars===5);
    ok("VHL Q6 correct mechanism=5",saba.q.q6.stars===5);
    ok("VHL Q1 chain reasoned=5",saba.q.q1.stars===5);
    ok("VHL gamed low",gm3.overall10<=5.0);
    ok("VHL gamed assertionCapped",gm3.flags.assertionCapped===true);
    ok("VHL gamed >=3 assertion Qs",gm3.assertionCount>=3);
    ok("VHL gamed not honest-misfire",gm3.honestGapCount===0);
    var q4item=vhl.questions.filter(function(x){return x.id==="q4";})[0];
    var hg=gradeQuestion(q4item,"I have not come across false hypoxia before");
    ok("honesty=gap",hg.verdict==="gap");
    var asrt=gradeQuestion(q4item,"false hypoxia oxygen sensing pathway");
    ok("keyword-only=assertion not gap",asrt.verdict!=="gap"&&asrt.assertionFlag===true&&asrt.stars===2);
    ok("VHL gamed anchored",gm3.flags.anchored===true);
    ok("VHL Saba clean revision",saba.flags.cleanRevision===true);
    ok("VHL strong clean revision",strong.flags.cleanRevision===true);
    var wsum=vhl.questions.reduce(function(a,it){return a+(it.recall?0:it.w);},0);
    var rsum=vhl.questions.reduce(function(a,it){return a+(it.recall?it.w:0);},0);
    ok("VHL reasoning weighted over recall",wsum===90&&rsum===10);
    var det1=JSON.stringify(gradeQuestions(vhl,vhl.demo.saba).q);
    var det2=JSON.stringify(gradeQuestions(vhl,vhl.demo.saba).q);
    ok("VHL questions deterministic",det1===det2);
  }
  return {pass:pass,total:A.length,fails:A.filter(function(a){return !a.ok;}).map(function(a){return a.name;}),all:A};
}

/* ============ evidence highlighting ============ */
function marksForStage(cs,text,g,stageId,isBedside){
  var an=analyseStage(cs,text);var marks=[];
  // only mark 'asserted without reasoning' on the stage whose rubric item actually flagged the concept
  var flaggedSet={};if(g)cs.rubric.forEach(function(it){if(it.stage!==stageId)return;var r=g.byId[it.id];if(r)(r.flagged||[]).forEach(function(c){flaggedSet[c]=1;});});
  for(var cid in an.byConcept){var con=cs.conceptById(cid);an.byConcept[cid].forEach(function(h){
    var cls,title;
    if(h.negated){cls="neg";title='detected as negated';}
    else if(h.considered){cls="ddx";title='understood “'+text.slice(h.rawStart,h.rawEnd)+'” as considering '+con.label;}
    else if(con.cat==="dx"&&flaggedSet[cid]&&!h.hasReason){cls="assert";title='asserted without reasoning';}
    else {cls=catClass(con.cat);title='understood “'+text.slice(h.rawStart,h.rawEnd)+'” as '+con.label;}
    marks.push({rawStart:h.rawStart,rawEnd:h.rawEnd,cls:cls,title:title,pri:cls==="neg"?3:cls==="assert"?2:1});
  });}
  if(isBedside){var toks=an.toks;toks.forEach(function(t){if(JARGON[t.norm])marks.push({rawStart:t.start,rawEnd:t.end,cls:"jarg",title:'a medical word — the patient needed: '+JARGON[t.norm],pri:2});});}
  return marks;
}
function renderHighlight(raw,marks){
  marks=marks.slice().sort(function(a,b){return a.rawStart-b.rawStart||(b.rawEnd-b.rawStart)-(a.rawEnd-a.rawStart);});
  var out="",cur=0;
  marks.forEach(function(m){if(m.rawStart<cur||m.rawEnd<=m.rawStart)return;out+=esc(raw.slice(cur,m.rawStart));out+='<mark class="'+m.cls+'" title="'+esc(m.title||"")+'">'+esc(raw.slice(m.rawStart,m.rawEnd))+'</mark>';cur=m.rawEnd;});
  out+=esc(raw.slice(cur));
  return out.replace(/\n/g,"<br>");
}

/* ============ timeline ============ */
function timelineHTML(cs,g){
  var tl=g.timeline;
  var cols=tl.nodes.map(function(name,i){
    var here=tl.entries.filter(function(e){return e.stage===i;});
    var dots=here.map(function(e){var cl=e.carried?"tl-solid":(e.dropped?"tl-drop":"tl-live");var star=e.isTarget?" tl-target":"";return '<div class="tldot '+cl+star+'">'+esc(e.label)+(e.carried?' ✓':(e.dropped?' ⋯':''))+'</div>';}).join("");
    var ghosts=(i===0)?tl.entries.filter(function(e){return e.ghost;}).map(function(e){return '<div class="tldot tl-ghost">'+esc(e.label)+' — never raised</div>';}).join(""):"";
    return '<div class="tlcol"><div class="tlnode">'+(i+1)+'</div><div class="tlname">'+esc(name)+'</div>'+dots+ghosts+'</div>';
  }).join("");
  var flags=[];
  if(g.flags.cleanRevision)flags.push('<span class="tlflag good">CLEAN REVISION</span>');
  if(g.flags.anchored)flags.push('<span class="tlflag bad">ANCHORED</span>');
  if(g.flags.closedEarly)flags.push('<span class="tlflag bad">CLOSED EARLY</span>');
  if(g.flags.drifted)flags.push('<span class="tlflag bad">DRIFTED</span>');
  if(g.flags.assertionCapped)flags.push('<span class="tlflag bad">ASSERTIONS WITHOUT REASONING</span>');
  return '<div class="card"><h2>The tracks timeline</h2><div class="small">Every diagnosis you raised, placed at the stage you first named it — solid where you carried it to a commitment, faded where you dropped it, hollow where a killer was never raised.</div>'
    +'<div class="timeline">'+cols+'</div>'
    +(flags.length?'<div class="tlflags">'+flags.join("")+'</div>':'')+'</div>';
}

/* ============ radar ============ */
function radar(dims){
  var cx=118,cy=118,R=88,n=dims.length;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var rings=[.25,.5,.75,1].map(function(r){return '<polygon points="'+dims.map(function(m,i){return pt(i,R*r).join(",");}).join(" ")+'" fill="none" stroke="#ddd4c2" stroke-width="1"/>';}).join("");
  var spokes=dims.map(function(m,i){var p=pt(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#ddd4c2"/>';}).join("");
  var poly='<polygon points="'+dims.map(function(m,i){return pt(i,R*m.v/100).join(",");}).join(" ")+'" fill="rgba(15,91,86,.14)" stroke="#0f5b56" stroke-width="2"/>';
  var dots=dims.map(function(m,i){var p=pt(i,R*m.v/100);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#0f5b56"/>';}).join("");
  var labs=dims.map(function(m,i){var p=pt(i,R+16);return '<text x="'+p[0]+'" y="'+p[1]+'" fill="#8a8371" font-size="9" font-family="monospace" text-anchor="middle" dominant-baseline="middle">'+esc(m.key.split(" ")[0])+'</text>';}).join("");
  return '<svg viewBox="-24 0 284 240" width="100%" style="max-width:300px;display:block;margin:0 auto">'+rings+spokes+poly+dots+labs+'</svg>';
}

function reportView(id,gidx){

/* ---- scorecard report variant (narrative cases) ---- */
function starGlyphs(n){var s='';for(var i=0;i<5;i++)s+='<span class="sc-star'+(i<n?' on':'')+'">'+(i<n?'★':'☆')+'</span>';return '<span class="sc-stars" title="'+n+' of 5">'+s+'</span>';}
function scorecardView(cs,rec,gidx){
  var ans={};STK.forEach(function(k){ans[k]=rec.stages[k]?rec.stages[k].text:"";});
  (cs.questions||[]).forEach(function(it){ans[it.id]=(rec.answers&&rec.answers[it.id])||"";});
  var Q=gradeQuestions(cs,ans);
  var overall=Q.overall10.toFixed(1);
  var vcls=Q.flags.anchored?"vb-unsafe":(Q.flags.assertionCapped?"vb-risky":(Q.overall10>=7.5?"vb-safe":Q.overall10<4?"vb-unsafe":"vb-risky"));
  var vt=Q.flags.anchored?"Anchored on the first hypothesis":(Q.flags.cleanRevision?"Revised cleanly on the evidence":"Scorecard");
  var body='<div class="crumbs"><a data-nav="#/cases">Cases</a> › '+esc(cs.title)+' › Scorecard</div>';
  body+='<div class="verdictband '+vcls+'"><h2>'+esc(vt)+'</h2><div class="sm">'+esc(cs.title)+'</div>'
      + '<span class="scorechip" id="scoreChip">'+esc(overall)+' / 10</span></div>';
  // SECTION 1 — Hypothesis journey
  var flagChip=Q.flags.cleanRevision?'<span class="tlflag good">CLEAN REVISION</span>'
    :Q.flags.anchored?'<span class="tlflag bad">ANCHORED</span>':'';
  body+='<div class="card"><h2>Hypothesis journey</h2>'
    +'<div class="sc-journey"><div class="sc-jstep"><b>Initial working diagnosis</b><div class="evidence">'+esc(ans.workup||"(not stated)")+'</div></div>'
    +'<div class="sc-jstep"><b>The disruption</b><div class="capsule">Oxygen studies normal, but erythropoietin markedly high — the first hypothesis dies.</div></div>'
    +'<div class="sc-jstep"><b>The revision</b><div class="evidence">'+esc(ans.results||"(not stated)")+'</div></div>'
    +'<div class="sc-flags">'+flagChip+'</div></div></div>';
  // SECTION 2 — Question by question
  var rows=(cs.questions||[]).map(function(it){
    var r=Q.q[it.id], a=ans[it.id]||"";
    var verdictCell;
    if(r.verdict==="gap")verdictCell='<span class="sc-gappill">new concept / honest gap</span>'+(it.recallRedTag?' <span class="sc-facttag">recall</span>':'');
    else if(r.verdict==="wrong")verdictCell='<span class="sc-gappill sc-wrong">contradicts the evidence</span>';
    else verdictCell=starGlyphs(r.stars);
    return '<div class="sc-row"><div class="sc-q">'+esc(it.qtext)+'</div>'
      +'<div class="sc-ans evidence">'+(a.trim()?esc(a):'<span class="small">(blank)</span>')+'</div>'
      +'<div class="sc-verdict">'+verdictCell+'</div>'
      +'<div class="sc-refine small">'+esc(r.feedback||"")+'</div></div>';
  }).join("");
  body+='<div class="card"><h2>Question by question</h2><div class="sc-table">'+rows+'</div></div>';
  // SECTION 3 — Reasoning vs Recall
  function bar(lbl,v){return '<div class="metric"><div class="top"><b>'+esc(lbl)+'</b><span>'+v+'%</span></div>'
    +'<div class="bar"><i style="width:'+v+'%;background:'+(v>=70?'var(--green)':v>=40?'var(--amber)':'var(--danger)')+'"></i></div></div>';}
  body+='<div class="card"><h2>Reasoning vs Recall</h2>'+bar("Reasoning (Q1–Q6)",Q.reasoningPct)+bar("Recall (Q7–Q8)",Q.recallPct)
    +'<div class="small">Reasoning is weighted 3x recall.</div></div>';
  // SECTION 4 — Overall
  body+='<div class="card sc-overall"><div class="sc-big">'+esc(overall)+' <span>/ 10</span></div>'
    +'<div class="small">Overall — reasoning-weighted across all eight questions.</div></div>';
  // SECTION 5 — teaching coda (why good clinicians missed it)
  if(cs.coda){
    body+='<div class="card sc-coda"><h2>'+esc(cs.coda.title)+'</h2>'
      +(cs.coda.points||[]).map(function(p){return '<p class="sc-codap">'+esc(p)+'</p>';}).join("")
      +'<div class="sc-codaclose">'+esc(cs.coda.close)+'</div></div>';
  }
  body+='<div class="card"><div class="disclaimer">Graded by a deterministic concept-and-negation engine standing in for the production language examiner. A deployed system uses a language model behind this same rubric, with faculty review of every grade.</div></div>';
  body+='<div class="row"><button class="btn primary" data-revise="'+esc(cs.id)+'">Revise this note</button><button class="btn ghost" data-nav="#/cases">Back to library</button></div>';
  return shell("report",body);
}
function dangerRows(cs,g,recFU){
  var killers=cs.rubric.filter(function(it){return it.id==="killers";})[0];if(!killers)return "";
  var ptext=(S._reportRec&&S._reportRec.rec.stages.patient)?S._reportRec.rec.stages.patient.text:"";
  return killers.concepts.map(function(cid){var con=cs.conceptById(cid);var hits=g.SA.patient.byConcept[cid]||[];var named=hits.length>0;

function profProse(cs,g){
  var p=[],t=cs.target,tl=cs.conceptById(t).label.toLowerCase();

// split a ward note into stage sections on 'O/E' / 'Investigations' / 'Working diagnosis' headers
function splitWard(raw){
  var lines=String(raw==null?"":raw).split(/\n/),cur="history",sec={history:[],exam:[],investigations:[]},dx="";
  lines.forEach(function(ln){var t=ln.trim();
    if(/^(o\/e|on examination|examination)\b/i.test(t)){cur="exam";var r=t.replace(/^(o\/e|on examination|examination)[:\-\s]*/i,"");if(r)sec.exam.push(r);return;}
    if(/^(investigations?|ix|labs|bloods)\b/i.test(t)){cur="investigations";var r2=t.replace(/^(investigations?|ix|labs|bloods)[:\-\s]*/i,"");if(r2)sec.investigations.push(r2);return;}
    var dm=t.match(/^(working diagnosis|impression|diagnosis)[:\-\s]*(.*)$/i);if(dm){dx=dm[2];sec[cur].push(ln);return;}
    sec[cur].push(ln);});
  return {history:sec.history.join("\n").trim(),exam:sec.exam.join("\n").trim(),investigations:sec.investigations.join("\n").trim(),dx:dx};
